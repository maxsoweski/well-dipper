      // Ice-shell chaos (Europa Conamara): inside disrupted regions the shell breaks into
      // RAFTS — a voronoi3d cell field where each cell gets a flat per-cell hashed height
      // AND a per-cell constant TILT (a hashed gradient that gives each raft a distinct
      // NORMAL, so adjacent plates catch light differently — the "jigsaw of moved plates"
      // look, not just bumpy). Between rafts (near cell borders) sits a lower, high-freq
      // refrozen MATRIX. COVERAGE = the SHARED uCryoActivity (Cryo-owned) × a low-freq region
      // mask. The relief NORMAL comes from the exact per-cell tilt + the matrix noised() grad
      // (pinned); the region/interior masks are cosmetic-gradient like F8's flow mask.
      // uCryoActivity<=0 ⇒ early-out (cheap tier: per-cell rotation matrix + subsidence
      // basins + antipodal placement are DEFERRED to the rich tier, relief doc §F9.d).
      void chaosCombiner(vec3 pos, inout float h, inout vec3 grad){
        if (uCryoActivity <= 0.0) return;
        vec4 mn = noised(pos * uChaosMaskScale + uChaosOffset);
        float region = smoothstep(1.0 - uCryoActivity, 1.0 - uCryoActivity + 0.3, 0.5 + 0.5 * mn.x);
        region *= provinceWeight(PROV_CHAOS);                    // §8: chaos clusters over internal heat
        if (region <= 0.0) return;
        vec3 cId, vGrad;
        vec2 ff = voronoi3d(pos * uChaosCellScale + uChaosOffset, uVoroCells, cId, vGrad);
        vec3 rh = hash33(cId);                                   // per-cell randoms (height + tilt)
        float interior = smoothstep(0.0, 0.10, ff.y - ff.x);     // 1 inside the raft, 0 on borders (matrix)
        float raftH = (rh.x - 0.5) * 2.0 * uChaosRaftJitter;     // flat per-cell height (cosmetic grad)
        vec3  tilt  = (rh - 0.5) * 2.0 * uChaosRaftJitter;       // per-cell CONSTANT tilt gradient (exact)
        vec4  rn = noised(pos * uChaosCellScale * 2.7 + uChaosOffset);   // refrozen matrix roughness (pinned grad)
        float matrixDepth = -0.4 * uChaosRaftJitter;
        h    += region * (interior * raftH + (1.0 - interior) * (matrixDepth + uChaosMatrixRough * rn.x));
        grad += region * (interior * tilt  + (1.0 - interior) * uChaosMatrixRough * rn.yzw);
      }

      // ── F10 ridged / grooved icy terrain (Stage-C step 3, Relief — relief doc §F10.a) ──
      // The signature icy-moon look, gated by the SHARED uCryoActivity. TWO mechanisms:
      // (1) DOUBLE RIDGES (Europa) — warped directional lines (like F6 tessera / F8 wrinkles)
      //     carrying the doubleRidgeProfile [ridge | trough | ridge] cross-section. t=sin(phase)
      //     is the signed cross-line coordinate; the profile's dh/dt chain-rules through
      //     dt/dphase=cos(phase) and dphase/dpos=freq·dfield (EXACT field grad, no warp Jacobian).
      // (2) GROOVED BANDS (Ganymede) — fine parallel ridgeWave (1−|sin|) ridges along a second
      //     axis, confined to low-freq band envelopes. Bands' fine ridges reuse F6's pinned
      //     ridgeWave; the band envelope is cosmetic-gradient. uCryoActivity<=0 ⇒ early-out
      //     (cheap tier: lenticulae + refrozen-crack web DEFERRED, relief doc §F10.d).
      void cryoRidgeCombiner(vec3 pos, inout float h, inout vec3 grad){
        if (uCryoActivity <= 0.0) return;
        float amp = uCryoRidgeAmp * uCryoActivity * provinceWeight(PROV_CRYORIDGE);   // §8: ridged plains complement chaos
        // (1) double ridges — warped line field carrying the double-ridge profile
        vec3 ax0 = normalize(uCryoRidgeAxis0);
        vec4 wn = noised(pos * 2.0 + uCryoRidgeOffsetV);
        float field  = dot(pos, ax0) + uCryoRidgeWarp * wn.x;
        vec3  dfield = ax0 + uCryoRidgeWarp * 2.0 * wn.yzw;
        float phase  = field * uDoubleRidgeFreq;
        float t  = sin(phase);
        vec2  dr = doubleRidgeProfile(t, uCryoRidgeOffset, uCryoRidgeWidth);
        h    += amp * dr.x;
        grad += amp * dr.y * cos(phase) * uDoubleRidgeFreq * dfield;   // dh/dt · dt/dphase · dphase/dpos
        // (2) grooved bands — fine ridgeWave ridges in low-freq band envelopes (second axis)
        vec3 ax1 = normalize(uCryoRidgeAxis1);
        vec4 bn = noised(pos * 1.3 + uCryoRidgeOffsetV + uMacroOffset);
        float bfield  = dot(pos, ax1) + uCryoRidgeWarp * bn.x;
        vec3  bdfield = ax1 + uCryoRidgeWarp * 1.3 * bn.yzw;
        float bandEnv = smoothstep(0.35, 0.65, 0.5 + 0.5 * sin(bfield * 2.0));   // where bands exist (cosmetic)
        vec2  rw = ridgeWave(bfield * uGroovedBandFreq);
        float bandAmp = amp * 0.5 * bandEnv;
        h    += bandAmp * (rw.x - 0.5);                              // −0.5 DC cosmetic (normal-only shading)
        grad += bandAmp * rw.y * uGroovedBandFreq * bdfield;
      }

      // ── F18 sublimation landscapes (Cryo step 4, cryo-doc §2 F18) — RELIEF, species-SWITCHED ──
      // The MORPHOLOGY is switched on uVolatileSpecies (the ONE allowed semantic-uniform branch —
      // UNIFORM control flow, not a planetType branch): CO₂→swiss-cheese pits, N₂→convection polygons,
      // CH₄→penitente blades, H₂O→mild hollows. Pits/polygons route the SHARED voronoi3d keystone;
      // blades use the §5.4-pinned bladeProfile — NO forked primitives (cryo-doc §5 risk #2). Relief is
      // CONFINED to the cold cap in-shader (coldFactor, the same gate frostCoverage uses) so a warm
      // world's equator stays bare. Province-aware per integration-index §8: the contribution is scaled
      // by uProvinceWeight (the no-op 1.0 multiplier until Stage-D wires the spatial field — the
      // FEATURE_ID-keyed provinceWeight() accessor rides with the Stage-D scoped job). uSubStrength≤0 OR
      // species 0 ⇒ early-out (Stage-A base + all prior relief untouched — regression-safe).
      void sublimationCombiner(vec3 pos, inout float h, inout vec3 grad){
        if (uSubStrength <= 0.0 || uVolatileSpecies == 0) return;
        // cold-cap confinement: coldFactor 0 at the hot point (equator / substellar) → 1 at the cold
        // point (pole / antistellar eyeball). Same field as frostCoverage so F18 sits inside the frost.
        float coldFactor;
        if (uFrostLocked == 1){
          coldFactor = clamp(vSubstellarAngle / 3.14159265, 0.0, 1.0);
        } else {
          float sinLat = normalize(pos).y;
          coldFactor = mix(sinLat * sinLat, 1.0, uFrostLatitudeBias * 0.6);
        }
        // confine to where the volatile is actually SOLID — mirror frostCoverage's localT<condensationT
        // test (reusing the frost uniforms) so a UNIFORMLY cold world (Pluto/Frozen) etches broadly
        // while a warm-poled world etches only its cold cap. Cosmetic-gradient mask (slowly varying,
        // not chain-ruled). h is the accumulated relief this frame → free altitude lapse (frost climbs).
        float localT  = uPlanetTempEq * (1.0 - uFrostLatChill * coldFactor) - h * uFrostLapseRate * uPlanetTempEq;
        float coldnes = uFrostCondensationT - localT;                 // >0 ⇒ volatile is solid here
        float band    = uSubColdGate * uPlanetTempEq;                 // confinement edge softness (K)
        float capMask = smoothstep(-band, band, coldnes);
        if (capMask <= 0.0) return;
        float amp = uSubAmp * uSubStrength * capMask * provinceWeight(PROV_SUBLIMATION);   // §8 (spatial field LIVE 2026-06-10)

        if (uVolatileSpecies == 3){
          // CH₄ penitentes — strongly anisotropic SHARP blades, aligned to the sun azimuth (penitentes
          // lean toward noon). Blade axis = sun direction projected into the local tangent plane.
          vec3 n = normalize(pos);
          vec3 sunT = uLightDir - n * dot(uLightDir, n);
          float sl = length(sunT);
          vec3 bladeAxis = sl > 1e-4 ? sunT / sl : normalize(cross(n, vec3(0.0, 1.0, 0.0)) + vec3(1e-4));
          vec4 wn = noised(pos * 1.7 + uSubOffset);
          float field  = dot(pos, bladeAxis) + 0.15 * wn.x;            // mild warp (blades not perfectly straight)
          vec3  dfield = bladeAxis + 0.15 * 1.7 * wn.yzw;
          float phase = field * uBladeFreq;
          vec2 bp = bladeProfile(phase, uBladeSharp);
          h    += amp * (bp.x - 0.5);                                  // −0.5 DC (normal-only), blades stand up
          grad += amp * bp.y * uBladeFreq * dfield;                    // dh/dphase · dphase/dpos (EXACT field grad)
          return;
        }

        // CO₂ swiss-cheese (2), N₂ pits (4), H₂O hollows (1) — CARVE flat-floored radial pits via the
        // §5.4-pinned grabenProfile (radial: d = normalized pit radius, halfWidth=1 → −1 floor → 0 rim).
        float pitScale = (uVolatileSpecies == 4) ? uSubPolyScale * 1.7 : uSubPitScale;  // N₂ pits = a finer octave over the polygons
        vec3 pCell, pGrad;
        vec2 pf = voronoi3d(pos * pitScale + uSubOffset, uVoroCells, pCell, pGrad);
        vec3 phh = hash33(pCell);
        float host = step(1.0 - uSubPitDensity, phh.x);                // fraction of cells hosting a pit
        float pitR = mix(0.35, 0.75, phh.y);                          // hashed pit radius (cell units)
        float r = pf.x / pitR;
        vec2 gp = grabenProfile(r, 1.0, uSubFloorFrac);               // depth ∈ [−1,0], gp.y = wall slope
        // CO₂ scarps actively RETREAT → deeper on the sun-facing hemisphere (slowly-varying factor held
        // locally-constant, the ejecta-patch-mask convention — its tiny gradient is cosmetic).
        float asym = (uVolatileSpecies == 2)
          ? 1.0 + 0.4 * clamp(dot(normalize(pos), normalize(uLightDir)), -1.0, 1.0)
          : 1.0;
        float pitAmp = amp * host * asym;
        h    += pitAmp * gp.x;                                        // gp.x ≤ 0 → carves down
        grad += pitAmp * gp.y * (1.0 / pitR) * pGrad * pitScale;      // dh/dr · dr/dpos (chain-ruled, EXACT)

        // N₂ convection polygons — RAISED cell interiors with trough borders (Sputnik Planitia). The
        // border relief uses the chaos-convention cosmetic gradient (voronoi3d returns ∂f1 only, not
        // ∂(f2−f1)); the pit field above carries the exact chain-ruled relief. (Center→edge pit-size
        // grading is the rich-tier refinement, deferred — cryo-doc §2 N₂.)
        if (uVolatileSpecies == 4){
          vec3 cCell, cGrad;
          vec2 cf = voronoi3d(pos * uSubPolyScale + uSubOffset, uVoroCells, cCell, cGrad);
          float interior = smoothstep(0.0, 0.12, cf.y - cf.x);        // 1 inside the cell → 0 at the trough border
          h += amp * 0.6 * (interior - 0.5);                          // raised centers, trough borders (cosmetic grad)
        }
      }

      // ── F17 glacial relief (Cryo step 5, cryo-doc §2 F17) — ice mantle + flow lineations ──
      // The last cryo feature. TWO pieces (Max scoped v1 to mantle + lineations; U-valley/fjord
      // flow-LINE carving DEFERRED to a rich tier, like F4's Voronoi-web / F18's araneiforms):
      // (1) ICE MANTLE — a slope-damped FBM (fbmdDamped) ponded in LOW-slope basins (ice fills
      //     flats smooth, flows off steeps), confined to the cold cap by the SAME localT<condensationT
      //     gate F18/frost use (reuses the frost uniforms) — so a warm world glaciates only its cold
      //     poles, a uniformly-cold Pluto broadly. The mantle ADDS gentle ice-surface relief.
      // (2) FLOW LINEATIONS (moraine/esker) — flow-ALIGNED ridges: a warped directional field whose
      //     base axis is the LOCAL across-flow direction (⊥ to downhill = −tangential grad), carried
      //     by the §5.4-pinned ridgeWave (1−|sin|). The flow axis is held locally-constant (the
      //     cryo-doc flow-proxy: no iteration, the cost-saver), so the gradient is EXACT for the field
      //     given a fixed axis — the F8-wrinkle / F10-groove pattern, axis swapped global→local-flow.
      // Both reuse pinned primitives → NO new finite-diff oracle. Province-aware (§8): ×uProvinceWeight.
      // Wired before lavaCombiner so lava still suppresses LAST. uGlacialStrength≤0 ⇒ early-out.
      void glacialCombiner(vec3 pos, float fwBase, inout float h, inout vec3 grad){
        if (uGlacialStrength <= 0.0) return;
        // cold-cap confinement — identical field to frostCoverage/sublimationCombiner (reuse frost uniforms)
        float coldFactor;
        if (uFrostLocked == 1){
          coldFactor = clamp(vSubstellarAngle / 3.14159265, 0.0, 1.0);
        } else {
          float sinLat = normalize(pos).y;
          coldFactor = mix(sinLat * sinLat, 1.0, uFrostLatitudeBias * 0.6);
        }
        float localT  = uPlanetTempEq * (1.0 - uFrostLatChill * coldFactor) - h * uFrostLapseRate * uPlanetTempEq;
        float coldnes = uFrostCondensationT - localT;                 // >0 ⇒ ice is solid here
        float band    = uGlacialColdGate * uPlanetTempEq;
        float capMask = smoothstep(-band, band, coldnes);
        if (capMask <= 0.0) return;

        // Flow proxy — glacial ice flows down the REGIONAL slope, not every fine bump, so the flow
        // direction comes from a LOW-frequency field (cryo-doc §2 F17 "cheap flow proxy", no iteration),
        // NOT the accumulated grad (whose every fbm octave contributes equally to |grad| → a noisy,
        // incoherent direction → blotchy lineations). The regional slope also drives the basin mask.
        const float FLOW_SCALE = 0.7;
        vec3  nrm = normalize(pos);
        vec4  flow = noised(pos * FLOW_SCALE + uGlacialOffset);
        vec3  fG  = flow.yzw * FLOW_SCALE;                            // regional height gradient (object space)
        vec3  gT  = fG - nrm * dot(fG, nrm);                          // tangential component
        float slope = length(gT);
        float base = uGlacialStrength * capMask * provinceWeight(PROV_GLACIAL);   // §8 (spatial field LIVE 2026-06-10)

        // (1) ice mantle — slope-damped FBM, ponded where the REGIONAL surface is LOW-slope (basins).
        // The basin mask is slowly-varying (held locally-constant, the chaos/ejecta cosmetic-grad convention).
        float basinMask = 1.0 - smoothstep(uGlacialBasinThresh, uGlacialBasinThresh * 2.5, slope);
        vec4  ice = fbmdDamped(pos * uGlacialScale, uOctaves, fwBase * uGlacialScale, uGlacialSlopeDamp);
        float mAmp = uGlacialAmp * base * basinMask;
        h    += mAmp * ice.x;
        grad += mAmp * ice.yzw * uGlacialScale;

        // (2) flow lineations (moraine/esker) — flow-aligned ridgeWave ridges. Across-flow axis ⊥
        // regional downhill in the tangent plane; if the surface is flat (no flow), skip (lineations are
        // a FLOW signature). Amplitude scales with flow vigor (∝ 1/g) — low-g sheets carry bolder lineations.
        if (slope > 1e-4){
          vec3 flowDir   = -gT / slope;                              // regional downhill unit vector (tangent)
          vec3 acrossAx  = normalize(cross(nrm, flowDir));           // ⊥ flow in tangent plane (held const)
          vec4 wn = noised(pos * uLineationWarpFreq + uGlacialOffset + uMacroOffset);
          float field  = dot(pos, acrossAx) + uLineationWarp * wn.x; // ridges run ALONG flow (field varies across)
          vec3  dfield = acrossAx + uLineationWarp * uLineationWarpFreq * wn.yzw;  // EXACT grad (axis held const)
          float phase  = field * uLineationFreq;
          vec2  rw = ridgeWave(phase);
          float lAmp = uLineationAmp * base * uGlacialFlowVigor;
          h    += lAmp * (rw.x - 0.5);                               // −0.5 DC cosmetic (normal-only shading)
          grad += lAmp * rw.y * uLineationFreq * dfield;
        }
      }

      // ── Cryo frost-coverage mask (Stage-C Cryo step 2, F23/F22 — cryo-doc §2) ─────────────
      // THE keystone of the cryo domain: a per-fragment COVERAGE scalar ∈ [0,1] answering "is it
      // cold enough HERE for this volatile to be solid?" — a coverage test, NOT relief (no height
      // delta, no gradient; logic unit-tested, mask verified visually). localT is a substellar/
      // latitude-driven temperature minus an altitude lapse; frost deposits where localT <
      // condensationT, softened to a fractal snowline. Consumed at the albedo stage (mix toward the
      // bright uFrostAlbedo) so the LUMINANCE lift survives posterize as a bright cap — the colour
      // TINT is the stylize/drop part (cryo-doc §2.a). uFrostMaxCoverage≤0 OR condensationT≤0 ⇒
      // early-out (bone-dry / hot worlds unchanged — regression-safe).
      float frostCoverage(vec3 p, float heightField, out float bandCoord){
        bandCoord = 0.0;                                                   // pole-distance coordinate for F22 PLD strata
        if (uFrostMaxCoverage <= 0.0 || uFrostCondensationT <= 0.0) return 0.0;
        // coldFactor ∈ [0,1]: 0 at the hot point (equator / substellar), 1 at the cold point
        // (pole / antistellar). Tidally-locked worlds freeze on the antistellar hemisphere (the
        // "eyeball" cap) via the SHARED vSubstellarAngle varying; others by geographic latitude.
        float coldFactor;
        if (uFrostLocked == 1){
          coldFactor = clamp(vSubstellarAngle / 3.14159265, 0.0, 1.0);     // 0 substellar(hot) → 1 antistellar(cold)
        } else {
          float sinLat = normalize(p).y;                                   // smooth geographic latitude (not the bumpy normal)
          float latCold = sinLat * sinLat;                                 // 0 equator → 1 pole
          // axial-tilt bias lifts the equatorial floor so high-obliquity worlds frost low latitudes
          coldFactor = mix(latCold, 1.0, uFrostLatitudeBias * 0.6);
        }
        // F22 PLD band coordinate: coldFactor ramps SMOOTHLY pole-ward across the whole cap (the
        // coverage itself saturates to the budget just past the snowline, so it can't carry rings).
        bandCoord = coldFactor;
        // localT: equilibrium temp cooled toward the cold point, minus an altitude lapse (frost
        // climbs mountains — heightField is the accumulated relief, already computed this frame).
        float localT = uPlanetTempEq * (1.0 - uFrostLatChill * coldFactor)
                     - heightField * uFrostLapseRate * uPlanetTempEq;
        float coldness = uFrostCondensationT - localT;                     // >0 ⇒ volatile freezes here
        // fractal boundary breakup (kills the drawn-on latitude-circle tell), in Kelvin units
        float breakup = noised(p * uFrostNoiseScale + uFrostOffset).x * uFrostNoiseAmp * uPlanetTempEq;
        float band = uFrostEdgeSoftness * uPlanetTempEq;                   // soft snowline width in K
        float raw = smoothstep(-band, band, coldness + breakup);
        // §8 convention-complete: frost carries a NEUTRAL affinity (floor 1.0 ⇒ weight ≡ 1) —
        // F22/F23 are climate (latitude/temperature), geology must not gate them. The multiply
        // stays so a future taste pass can dial it via the data without touching this code.
        return raw * uFrostMaxCoverage * provinceWeight(PROV_FROST);
      }

      // ── pldBands — F22 polar-layered-deposit strata (cryo-doc §2 F22) ──
      // The perennial cap reads as STACKED bright/dark annular bands: preserved depositional layers
      // exposed in the cap. ALBEDO banding, NOT relief (no height/grad — logic unit-tested, verified
      // visually, like the step-2 frost mask). The caller passes a POLE-DISTANCE coordinate in [0,1]
      // (coldFactor: 0 at the snowline edge → 1 at the pole / antistellar cold point) which ramps
      // smoothly across the whole cap, so iso-value contours ARE the concentric rings. (The coverage
      // itself can't carry rings — it saturates to the budget just past the snowline.) Slice into
      // uPldLevels layers; adjacent layers alternate
      // bright/dark by PARITY, crossfaded across the soft riser. Returns a luminance factor in
      // [1−uPldStrength, 1] (even rings bright, odd rings dimmed). Transcribed from the CPU pldBands().
      // uPldStrength≤0 OR uPldLevels<1 ⇒ 1.0 (no banding); coverage 0 ⇒ idx 0, parity 0 ⇒ 1.0.
      float pldBands(float coverage){
        if (uPldStrength <= 0.0 || uPldLevels < 1.0) return 1.0;
        float phase = max(coverage, 0.0) * uPldLevels;
        float idx = floor(phase);
        float frac = phase - idx;
        float e0 = 1.0 - uPldSoftness;
        float riser = smoothstep(e0, 1.0, frac);
        float parity = mix(mod(idx, 2.0), mod(idx + 1.0, 2.0), riser);
        return 1.0 - uPldStrength * parity;
      }

      void main(){
        vec3 N = normalize(vObjN);

        // ── voronoi3d seam-gate debug (index §5 risk #1) — early-return viz ──
        if (uDebugMode > 0){
          vec3 vCell, vGrad;
          vec2 ff = voronoi3d(vPos * uVoroScale, uVoroCells, vCell, vGrad);
          vec3 dbg;
          if (uDebugMode == 1){
            dbg = vec3(ff.x);                                        // F1 grayscale — cell bowls
          } else if (uDebugMode == 2){
            dbg = vec3(1.0 - smoothstep(0.0, 0.06, ff.y - ff.x));    // F2-F1 crack mask (borders)
          } else if (uDebugMode == 3){
            dbg = hash33(vCell);                                     // flat per-cell color — SEAM TEST
          } else if (uDebugMode == 4){
            vec3 pn = perturbAnalytic(N, vGrad, 0.5);               // voronoi grad as lit relief
            dbg = uBaseColor * (max(dot(pn, uLightDir), 0.0) + 0.05);
          } else if (uDebugMode == 5){
            // emissiveBlackbody ramp swatch — pole(500K)→pole(4000K) gradient.
            // Confirms the GLSL transcription matches the CPU mirror: bottom
            // deep-red, climbing through orange/amber to warm-white on top.
            float tempK = mix(500.0, 4000.0, clamp(N.y * 0.5 + 0.5, 0.0, 1.0));
            dbg = emissiveBlackbody(tempK);
          } else {
            // mode 6: vSubstellarAngle varying — 0 (white, substellar) → π (black,
            // antistellar). Confirms the shared varying is computed correctly:
            // a bright sub-star spot fading to a dark antistellar hemisphere.
            dbg = vec3(1.0 - vSubstellarAngle / 3.14159265);
          }
          gl_FragColor = vec4(dbg, 1.0);
          return;
        }

        // ════════════════════════════════════════════════════════════════════
        // §3 PIPELINE ORDER (integration-index) — the compositing contract.
        // Each Stage-C domain inserts at its labeled stage; the foundation wires
        // stages 1 / 6 / 8 / 9 + the ★ emissive channel, and leaves stages 2-5/7
        // as placeholders the domains fill from their per-domain docs. The one
        // hard invariant already honored: ★ emissive terms are added AFTER the
        // posterize split so they don't band into gray steps (Stage-A §2.C).
        // ════════════════════════════════════════════════════════════════════

        // ── Stage 0.5: Stage-D province fields — ONCE per fragment, BEFORE any consumer
        // (relief combiners, rayField, lavaCrackEmissive, frostCoverage all read gProvince).
        initProvinces(vPos);

        // ── Stage 1: noised() height/derivative base (Stage-A foundation) ──
        vec3 shadeN;
        // canonical shared accumulator (index §1): Relief writes tectonic graben;
        // Fluvial incised gorges + Cryo chasma ADD IN. Stages 2/3/4 consume it.
        float canyonHeight = 0.0;
        float fluvialWet = 0.0;   // F11 channel strength, consumed by the Stage-6 species floor-tint
        // Stage 3 CRYO frost-coverage (F23/F22) — albedo overlay, set in the analytic branch
        // (needs the accumulated height for the altitude lapse), consumed at Stage 6.
        float frostCover = 0.0;
        float frostBandCoord = 0.0;   // F22 PLD pole-distance coordinate (set by frostCoverage)
        // F14 standing-liquid coverage — set by the Stage-4 level-set cut (analytic branch),
        // consumed at Stage 6 (liquid albedo fill) + implicitly by spec (flat normal = glint).
        float liquidMask = 0.0;
        if (uNormalMode == 1){
          // Production finite-diff path (regression reference)
          shadeN = perturbFiniteDiff(N, vPos, uPerturb);
        } else {
          // New analytic path — relief amplitude grows with approach (lodRamp), so
          // "one scalar drives all complexity" (spec §2.B): octaves AND detail depth.
          float fwBase = max(max(fwidth(vPos.x), fwidth(vPos.y)), fwidth(vPos.z));
          vec4 hd = fbmd(vPos, uOctaves, fwBase);
          float h = hd.x;
          vec3 grad = hd.yzw;
          // ── Stage 2: RELIEF combiners — mountains (F1, ridged base), craters
          // (F2, voronoi3d consumer), then canyons (F4, tectonic graben → canyonHeight).
          // Each ADDS a height delta + chain-rule gradient onto the FBM base; the single
          // perturbAnalytic below bends the normal so crestlines/rims/bowls/central-peaks/
          // trench-walls/scarp-faces all light correctly. F4 writes the shared canyonHeight
          // accumulator (Fluvial incised gorges + Cryo chasma ADD IN at stages 3/4); F5
          // scarps add fault-block relief onto h/grad (no shared accumulator).
          mountainCombiner(vPos, fwBase, h, grad);
          craterCombiner(vPos, h, grad);
          ejectaCombiner(vPos, h, grad);            // F3 — apron wrapping the F2 craters
          canyonCombiner(vPos, h, canyonHeight, grad);
          fluvialCombiner(vPos, h, canyonHeight, grad, fluvialWet);   // F11 — channels carve into canyonHeight
          scarpCombiner(vPos, h, grad);
          plateauCombiner(vPos, fwBase, h, grad);
          tesseraCombiner(vPos, h, grad);
          edificeCombiner(vPos, h, grad);          // F7 — volcanic shield/strato cones + caldera
          chaosCombiner(vPos, h, grad);            // F9 — ice-shell chaos rafts (reads shared uCryoActivity)
          cryoRidgeCombiner(vPos, h, grad);        // F10 — double ridges + grooved bands (reads shared uCryoActivity)
          sublimationCombiner(vPos, h, grad);      // F18 — sublimation landscapes (species-switched: pits/polygons/blades/hollows)
          glacialCombiner(vPos, fwBase, h, grad);  // F17 — glacial ice mantle + flow-aligned moraine/esker lineations (reads frost cap gate)
          lavaCombiner(vPos, h, grad);             // F8 — flood-basalt plains SMOOTH/suppress relief + wrinkle ridges (runs LAST)
          deltaCombiner(vPos, h, grad, fluvialWet);// F12 — depositional aprons where channels meet base level (reads FINAL h)
          // ── Stage 4 (F14): standing-liquid level-set cut (card §4) — AFTER all relief so
          // fluvial channels + basins flood for free off the accumulated h. Inside the mask
          // the height clamps to the equipotential and the gradient flattens to the geometric
          // normal — the flat-vs-perturbed normal contrast IS the liquid read, and the existing
          // Blinn-Phong spec catches a coherent glint lobe with no spec-path changes.
          // provinceWeight(PROV_LAKES) is NEUTRAL (floor 1.0 — hydrology, not geology).
          // (the liquidStability gate lives in applyDrivers: not-wet ⇒ seaLevel = -1)
          if (uSeaLevel > -1.0){
            liquidMask = smoothstep(uSeaLevel + 0.02, uSeaLevel - 0.02, h) * provinceWeight(PROV_LAKES);
            h    = mix(h, uSeaLevel, liquidMask);
            grad = mix(grad, vec3(0.0), liquidMask);
          }
          float reliefAmp = uPerturb * mix(0.7, 1.0, uLodRamp);
          shadeN = perturbAnalytic(N, grad, reliefAmp);
          // ── Stage 3: CRYO frost-coverage mask (F23/F22) — coverage test, not relief; needs the
          // accumulated height h for the altitude lapse. Consumed at the Stage-6 albedo overlay.
          frostCover = frostCoverage(vPos, h, frostBandCoord);
          // F14 × F22 phase consistency: standing liquid means local T is ABOVE the volatile's
          // condensation point (liquid phase, by definition) — frost cannot deposit on the open
          // sea. Titan's methane seas stay radar-dark against bright frosted terrain. (Frozen-sea
          // / eyeball ice-ring variant deferred — flagged in card §7 for the integration pass.)
          frostCover *= 1.0 - liquidMask;
        }

        // ── Stage 2 (cont.): mountains / scarps; writes canyonHeight   [domain: Relief]
        // ── Stage 3: CRYO — frost-mask + sublimation pits; reads uCryoActivity; adds into canyonHeight [domain: Cryo]
        // ── Stage 4: FLUVIAL incision — channels/karst carve, add into canyonHeight; uLiquidMask cut at seaLevel [domain: Fluvial]
        // ── Stage 5: AEOLIAN — dunes (anisotropic relief mod); dust mantle SMOOTHS relief (runs AFTER stage 2) [domain: Aeolian]
        //    (stages 2-5 reshape shadeN / height / canyonHeight; placeholders until their domains land.)

        // ── Envelope composite-split (spec §2.C) — each term is the A/B/C surface.
        // A bypassed term skips the quantizer => smooth glow over the posterized base.
        float diff = max(dot(shadeN, uLightDir), 0.0);
        float ambient = 0.035;
        vec2 fc = gl_FragCoord.xy;
        // View vector — planet sits at origin, identity quaternion, so world==object space
        vec3 V = normalize(cameraPosition - vPos);

        // ── Stage 6: surface albedo / material (relief + cryo frost tint + liquid material) ──
        // F3 bright rays — fresh high-albedo ejecta streaks brighten the lit surface BEFORE
        // posterize (the relief doc §F3.a albedo exception; only term here that's albedo not relief).
        float rayBright = rayField(vPos) * diff;       // sunlit fresh material only
        // Cryo frost (F23/F22): high-albedo overlay mixed into the base BEFORE posterize so the
        // luminance lift survives quantization as a bright cap (cryo-doc §2.a; the colour TINT is
        // the stylize/drop part). frostCover=0 ⇒ uBaseColor unchanged (regression-safe).
        // F22 PLD strata: dim the frost albedo in alternating annular layers (pldBands), keyed on the
        // pole-distance coordinate (frostBandCoord = coldFactor) which ramps smoothly across the whole
        // cap — the coverage itself saturates to the budget past the snowline, so it cannot carry rings.
        // The mix gates the strata to the cap (frostCover=0 ⇒ mix→uBaseColor, bare ground untouched).
        vec3 frostShade = uFrostAlbedo * pldBands(frostBandCoord);
        // F14 standing liquid — species-keyed fill mixed BEFORE frost so frost wins where
        // cold (sea ice; the eyeball ice-ring falls out of the latitude lapse for free).
        // Water = dark cool fill; methane/ethane = darker warm fill (Titan radar-dark).
        vec3 liquidCol = (uLiquidSpecies == 1) ? vec3(0.11, 0.07, 0.03) : vec3(0.04, 0.10, 0.22);
        vec3 albedoCol = mix(uBaseColor, liquidCol, liquidMask);
        albedoCol = mix(albedoCol, frostShade, frostCover);
        // F11 species floor-tint — faint channel-floor albedo (water vs methane). Albedo only;
        // fluvialWet=0 ⇒ unchanged. Kept subtle so it reads as a floor darkening through posterize.
        vec3 fluvTint = (uLiquidSpecies == 1) ? vec3(0.30, 0.22, 0.10) : vec3(0.10, 0.14, 0.24);
        albedoCol = mix(albedoCol, fluvTint, clamp(fluvialWet, 0.0, 1.0) * 0.35 * uFluvialDensity);
        vec3 surface = posterize(min(albedoCol * (diff + ambient) + uBaseColor * rayBright, vec3(1.0)), uLevels, fc, 0.4, uDitherMode);

        // ── Stage 7: EXOTIC overlay — base-type + overlay-layer composite; consumes the FULL natural-base
        //    lit color + landMask; renders LAST among surface terms, before the envelope split. [domain: Exotic]
        //    (placeholder; maturity→0 must reveal the bare stage-6 base — the overlay-correctness test.)

        // ── Stage 8: CLOUDS & HAZE — cloud-as-relief deck + haze muting (muting runs BEFORE final posterize);
        //    AEOLIAN F40 storm veil wins the upper slot when both active. [domains: Clouds, Aeolian]
        // Clouds (analytic-FBM weather layer — animated via uTime; off plain snoise, onto noised() — Q7).
        vec4 cw = fbmd(vPos * 1.7 + vec3(uTime * 0.02, 0.0, 0.0), 5.0, 0.0);
        float cloud = smoothstep(0.15, 0.5, cw.x) * uCloudCoverage * (diff + 0.05);
        vec3 cloudC = vec3(cloud);
        cloudC = posterize(cloudC, uLevels, fc, 0.4, uDitherMode);

        // ── Stage 9: OPTICAL — limb/terminator scattering (additive-tint ONLY; must not double-darken). [domain: Optical]
        // Limb / atmosphere rim glow (fresnel against the geometric normal, sun-weighted).
        float limb = pow(1.0 - max(dot(N, V), 0.0), 3.0) * uLimbStrength * (diff + 0.15);
        vec3 limbC = uBaseColor * limb;
        limbC = (uLimbBypass == 1) ? limbC : posterize(limbC, uLevels, fc, 0.4, uDitherMode);

        // ════════ posterize(surface) split — ★ EMISSIVE channel: all terms below BYPASS the quantizer ════════
        // Owners: thermal Bands F32/F33 (emissiveBlackbody), magma Exotic F41 (emissiveBlackbody),
        // city lights F48/49, bioluminescence F46, aurora Optical F37, sunglint Optical F36.

        // ★ Emissive glow (lava/hot stand-in for F41/F32) — Lambert-independent (visible on the dark side).
        vec3 emissive = uBaseColor * uEmissive;
        emissive = (uEmissiveBypass == 1) ? emissive : posterize(emissive, uLevels, fc, 0.4, uDitherMode);
        // ★ F8 lava cracks — ALWAYS bypass the quantizer (the canonical Option-C survivor, §F8.c):
        // spatial Worley crack-mask glow that stays crisp over the posterized basalt.
        emissive += lavaCrackEmissive(vPos);

        // ★ Specular glint (sunglint F36 stand-in) — Blinn-Phong, only on the lit side.
        vec3 H = normalize(uLightDir + V);
        float spec = pow(max(dot(shadeN, H), 0.0), 48.0) * uSpecStrength * step(0.0001, diff);
        vec3 specC = vec3(spec);
        specC = (uSpecBypass == 1) ? specC : posterize(specC, uLevels, fc, 0.4, uDitherMode);

        // ★ Aurora (Optical F37 stand-in) — night-side polar ring; rays from analytic noised(); skips quantizer.
        float lat = N.y;                                       // -1..1 latitude proxy (object-space normal)
        float ringMask = exp(-pow((abs(lat) - 0.7) / 0.12, 2.0));
        float nightMask = smoothstep(0.1, -0.1, diff);         // visible in darkness/twilight
        float rays = 0.5 + 0.5 * noised(N * 8.0 + vec3(uTime * 0.1)).x;
        float aurora = ringMask * nightMask * rays * uAuroraIntensity;
        vec3 auroraC = vec3(0.3, 0.9, 0.5) * aurora * 0.6;

        gl_FragColor = vec4(min(surface + emissive + specC + limbC + cloudC + auroraC, vec3(1.0)), 1.0);
      }
    `;

    const uniforms = {
      uNoiseScale: { value: 4.0 },
      uOctaves:    { value: 4.0 },

    let sceneTarget = null;

        magFilter: THREE.NearestFilter,
        depthBuffer: true,

      blitMat.uniforms.tDiffuse.value = sceneTarget.texture;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      return { w, h };

        varying vec2 vUv;

    // ── Per-layer terrain seeds ──────────────────────────────────────────────
    // A seed maps to a constant 3D offset into the infinite noise field; sampling
    // a different region = different terrain. macro seed shifts octaves 0..2 (the
    // continents), detail seed shifts octaves 3+ (surface texture). Constant
    // offsets don't disturb the analytic gradient, so normals/lighting are safe.
    function seedOffset(seed, out){
      const h = (n) => { const x = Math.sin(n) * 43758.5453; return (x - Math.floor(x)) * 256.0; };
      return out.set(h(seed*12.9898 + 78.233), h(seed*39.346 + 11.135), h(seed*53.711 + 94.673));
    }
    function updateSeedUniforms(){
      seedOffset(state.macroSeed,  uniforms.uMacroOffset.value);
      seedOffset(state.detailSeed, uniforms.uDetailOffset.value);
    }

    // mirror core.js seededUnitVec3() / seedOffset() so a roll lands in the same
    // ranges the driven values do (unit sphere; per-component 0..256 noise offset). ──
    function randUnitVec3(){
      const z = Math.random() * 2.0 - 1.0;
      const phi = Math.random() * Math.PI * 2.0;
      const r = Math.sqrt(Math.max(0.0, 1.0 - z * z));
      return [r * Math.cos(phi), r * Math.sin(phi), z];
    }

    // ▸ Drivers (open) — "types are driver-bundle PRESETS, not shader branches" (spec §2.D).
    // A preset is a physics bundle; deriveUniforms() maps it to semantic uniforms with NO
    // planetType branch — generalizing the aurora precedent in PlanetGenerator.js:435-487.
    // This is the generation-side scaffolding Stage-B features plug into.
    // radiusEarth/massEarth + eccentricity/starMassEarth/orbitRadiusEarth mirror the
    // generator's real output bundle (PhysicsEngine estimateMassEarth + orbital params);
    // deriveUniforms reads them for surfaceGravity (§2 #1) + tidalHeat (§2 #2). Values are
    // illustrative + roughly consistent (rocky M≈R^3.7·0.9; 1 AU = 23455 RE) — lab-tunable,
    // the consumers (Relief F2/F7/F8, Aeolian F15, Cryo P7) land in step 3.
    // composition.volatileFraction + atmosphere.retained/pressure mirror the generator's
    // real planetData (deriveComposition / computeAtmosphere) — deriveUniforms reads them
    // for the liquidStability/liquidSpecies master gate (§2 #3). "Titan (methane seas)"
    // exercises the cold methane species (1); "Frozen (airless)" proves the airless gate→0.
    const DRIVER_PRESETS = {
      'Rocky (Earthlike)': { radiusEarth:1.0, massEarth:0.9, eccentricity:0.017, starMassEarth:332946, orbitRadiusEarth:23455, composition:{ironFraction:0.32,density:5.5,volatileFraction:0.15}, T_eq:288, tidalState:{locked:false}, atmosphere:{color:[0.5,0.6,0.9],retained:true,pressure:1.0,composition:'n2-o2'}, habitability:0.7, surfaceHistory:{erosion:0.4,bombardmentIntensity:0.55,resurfacingRate:0.1} },
      'Lava (hot airless)': { radiusEarth:0.9, massEarth:0.65, eccentricity:0.15, starMassEarth:332946, orbitRadiusEarth:938, composition:{ironFraction:0.7,density:7,volatileFraction:0.02}, T_eq:950, tidalState:{locked:true,lockType:'synchronous'}, atmosphere:null, habitability:0, surfaceHistory:{erosion:0,bombardmentIntensity:0.3,resurfacingRate:0.95} },
      'Ocean (temperate)': { radiusEarth:1.1, massEarth:1.3, eccentricity:0.02, starMassEarth:332946, orbitRadiusEarth:23455, composition:{ironFraction:0.28,density:5,volatileFraction:0.35}, T_eq:295, tidalState:{locked:false}, atmosphere:{color:[0.4,0.6,0.95],retained:true,pressure:1.5,composition:'n2-o2'}, habitability:0.9, surfaceHistory:{erosion:0.6,bombardmentIntensity:0.4,resurfacingRate:0.3} },
      'Titan (methane seas)': { radiusEarth:0.4, massEarth:0.025, eccentricity:0.03, starMassEarth:332946, orbitRadiusEarth:120000, composition:{ironFraction:0.18,density:1.9,volatileFraction:0.4}, T_eq:94, tidalState:{locked:false}, atmosphere:{color:[0.8,0.6,0.3],retained:true,pressure:1.5,composition:'n2-o2'}, habitability:0.05, surfaceHistory:{erosion:0.2,bombardmentIntensity:0.5,resurfacingRate:0.4} },
      'Frozen (airless)': { radiusEarth:0.5, massEarth:0.07, eccentricity:0.005, starMassEarth:332946, orbitRadiusEarth:117275, composition:{ironFraction:0.2,density:2.5,volatileFraction:0.3}, T_eq:60, tidalState:{locked:false}, atmosphere:null, habitability:0.05, surfaceHistory:{erosion:0.1,bombardmentIntensity:0.85,resurfacingRate:0.05} },
      // "Europa (icy moon)" exercises Cryo P7: tidal ENERGY (eccentric close orbit) + VOLATILE-rich
      // (water-ice crust, vf 0.5) + COLD (T_eq 110 K, frozen shell) → derives cryoActivity≈1, the SHARED
      // uCryoActivity gate F9/F10 read (chaos rafts + double ridges render from the preset, no lab knob).
      // The lab models planet-around-STAR self-heating, so the close eccentric orbit stands in for a real
      // moon's planet-sourced tidal flexing (the documented P7 seam) — same convention as "Lava" at orbit 938.
      'Europa (icy moon)': { radiusEarth:0.5, massEarth:0.07, eccentricity:0.1, starMassEarth:332946, orbitRadiusEarth:2500, composition:{ironFraction:0.2,density:2.0,volatileFraction:0.5}, T_eq:110, tidalState:{locked:true,lockType:'synchronous'}, atmosphere:null, habitability:0.05, surfaceHistory:{erosion:0.05,bombardmentIntensity:0.3,resurfacingRate:0.6} },
    };
    const driverUI = { preset: 'Rocky (Earthlike)', qualityTier: 1.0 };
    function applyDrivers(){
      const u = deriveUniforms(DRIVER_PRESETS[driverUI.preset], driverUI.qualityTier);
      state.emissive = u.emissive; state.specStrength = u.specStrength; state.limbStrength = u.limbStrength;
      uniforms.uEmissive.value = u.emissive;
      uniforms.uSpecStrength.value = u.specStrength;
      uniforms.uLimbStrength.value = u.limbStrength;
      // cloudCoverage / auroraIntensity / craterCells / atmosphereModel consumed by Task 7 + Stage C
      if (uniforms.uCloudCoverage)  uniforms.uCloudCoverage.value  = u.cloudCoverage;
      if (uniforms.uAuroraIntensity) uniforms.uAuroraIntensity.value = u.auroraIntensity;
      // §2 #3 master liquid gate → RESERVED→LIVE uniforms (Fluvial owner; Optical/Aeolian/Cryo read in step 3+)
      if (uniforms.uLiquidStability) uniforms.uLiquidStability.value = u.liquidStability;
      if (uniforms.uLiquidSpecies)   uniforms.uLiquidSpecies.value   = u.liquidSpecies;
      // F2 craters (Stage-C step 3) — derived surfacings flow into state (frame loop writes
      // them to uniforms); uVoroCells = the qualityTier 27↔9 cellular knob (registry: Relief wires it).
      state.craterDensity    = u.craterDensity;
      state.craterComplexD   = u.craterComplexD;
      state.craterRelaxation = u.craterRelaxation;
      state.terraceCount     = u.terraceCount;
      uniforms.uVoroCells.value = u.craterCells;
      // F3 ejecta & rays (Stage-C step 3) — derived strength/rampart/ray-brightness flow
      // into state (frame loop → uniforms). Placement reuses the F2 crater uniforms.
      state.ejectaStrength   = u.ejectaStrength;
      state.ejectaRampart    = u.ejectaRampart;
      state.rayBrightness    = u.rayBrightness;
      // F1 mountains (Stage-C step 3) — derived amplitude + orogeny belt strength/strike.
      // orogenyAxis (unit vec2) → an angle the GUI exposes + the frame loop rebuilds.
      state.mountainAmp      = u.mountainAmp;
      state.orogenyStrength  = u.orogenyStrength;
      state.orogenyAngle     = Math.atan2(u.orogenyAxis[1], u.orogenyAxis[0]);
      // F4 canyons (Stage-C step 3) — derived depth + rift count + seeded plane normals.
      // depth/count flow into state (frame loop → uniforms); axes copy straight to the
      // uniform vec3 array (no GUI control — they're a per-planet seed property).
      state.chasmaDepth      = u.chasmaDepth;
      state.chasmaCount      = u.chasmaCount;
      state.chasmaAxes       = u.chasmaAxes;
      for (let i = 0; i < 3; i++) uniforms.uChasmaAxis.value[i].set(u.chasmaAxes[i][0], u.chasmaAxes[i][1], u.chasmaAxes[i][2]);
      // F5 scarps (Stage-C step 3) — derived strength + thrust↔normal style + seeded
      // front axis. strength/style flow into state (frame loop → uniforms); axis copies

      state.scarpStrength    = u.scarpStrength;
      state.scarpStyle       = u.scarpStyle;
      state.scarpAxis        = u.scarpAxis;
      uniforms.uScarpAxis.value.set(u.scarpAxis[0], u.scarpAxis[1], u.scarpAxis[2]);
      // F6 plateaus (Stage-C step 3) — derived strength flows into state (frame loop →
      // uniform); scale/offset/levels/softness are lab knobs.
      state.plateauStrength  = u.plateauStrength;

      state.tesseraAxes      = u.tesseraAxes;
      for (let i = 0; i < 2; i++) uniforms.uTesseraAxis.value[i].set(u.tesseraAxes[i][0], u.tesseraAxes[i][1], u.tesseraAxes[i][2]);

      state.volcanismStrength = u.volcanismStrength;
      state.edificeMaxHeight  = u.edificeMaxHeight;
      state.shieldStratoMix   = u.shieldStratoMix;

      // scale/wrinkle/crack/glow are lab knobs.
      state.lavaCoverage = u.lavaCoverage;
      state.lavaActivity = u.lavaActivity;
      state.lavaAxis     = u.lavaAxis;
      // F9/F10 icy terrain (Stage-C step 3) — Relief-owned SHAPE flows into state. The COVERAGE
      // gate (cryoActivity) is now DERIVED by Cryo (P7 — registry LIVE) and flows in from the
      // preset like every other driven field; the ◀ ICY ACTIVITY slider stays a manual override
      // (drag overrides until the next preset/quality change re-derives — same as lavaActivity etc.).
      state.cryoActivity = u.cryoActivity;
      state.chaosCellScale = u.chaosCellScale;
      state.chaosRaftJitter = u.chaosRaftJitter;
      state.chaosMatrixRough = u.chaosMatrixRough;
      state.doubleRidgeFreq = u.doubleRidgeFreq;
      state.cryoRidgeOffset = u.cryoRidgeOffset;
      state.cryoRidgeWidth = u.cryoRidgeWidth;
      state.groovedBandFreq = u.groovedBandFreq;
      state.cryoRidgeAxis0 = u.cryoRidgeAxes[0];
      state.cryoRidgeAxis1 = u.cryoRidgeAxes[1];
      // Cryo step 2 frost-coverage (F23/F22) — driven budget/condensationT/bias/albedo/locked/tempEq
      // flow into state (frame loop → uniforms); latChill/lapse/edge/noise stay lab knobs.
      state.frostMaxCoverage   = u.frostMaxCoverage;
      state.frostCondensationT = u.frostCondensationT;
      state.frostLatitudeBias  = u.frostLatitudeBias;
      state.frostAlbedo        = u.frostAlbedo;
      state.frostLocked        = u.frostLocked;
      state.tempEq             = u.tempEq;
      // Cryo step 3 F22 PLD strata — driven strength/levels flow into state; softness a lab knob.
      state.pldStrength        = u.pldStrength;
      state.pldLevels          = u.pldLevels;
      // Cryo step 4 F18 sublimation — driven gate + species flow into state; shape params stay lab knobs.
      state.subStrength        = u.subStrength;
      state.volatileSpecies    = u.volatileSpecies;
      // Cryo step 5 F17 glacial — driven gate + flow vigor flow into state; shape params stay lab knobs.
      state.glacialStrength    = u.glacialStrength;
      state.glacialFlowVigor   = u.glacialFlowVigor;
      // 🎲 transient contract: a preset / qualityTier change discards manual rolls → clean
      // slate. Axes above already re-derive from the seed; reset the domain offsets to 0.
      state.craterOffset = [0,0,0]; state.mountainDomainOffset = [0,0,0]; state.scarpDomainOffset = [0,0,0];
      state.plateauDomainOffset = [0,0,0]; state.tesseraDomainOffset = [0,0,0]; state.edificeOffset = [0,0,0];
      state.lavaOffset = [0,0,0]; state.chaosOffset = [0,0,0]; state.cryoRidgeOffsetV = [0,0,0];
      state.frostOffset = [0,0,0]; state.subOffset = [0,0,0]; state.glacialOffset = [0,0,0];
      state.fluvialOffset = [0,0,0];
      // ── F11 fluvial (lab audit 2026-06-07) — derive from surfaced drivers ──

      // tracks D4 rain; depth adds a touch of D14 gravity. Relict (was-wet, now-dry: low
      // stability but erosion evidence) gets faint, softened channels via activity→erosion.
      const _fp = DRIVER_PRESETS[driverUI.preset];
      const _erosion = _fp.surfaceHistory?.erosion ?? 0;
      const _stab = u.liquidStability, _rain = u.precipitation, _g = u.surfaceGravity;
      const _clamp01 = x => Math.max(0, Math.min(1, x));
      const _wet = _stab > 0.15;
      // Relict only on worlds that COULD have held surface liquid (retain an atmosphere).
      // A genuinely airless world (atmosphere:null) floors to 0 — its surfaceHistory.erosion
      // is bombardment/space-weathering, not fluvial — honoring the spec's "NONE on airless" gate.
      const _hadLiquid = !!(_fp.atmosphere && _fp.atmosphere.retained !== false);
      state.fluvialActivity = _wet ? 1.0 : _clamp01(_erosion);              // relict if dried
      state.fluvialDensity  = _wet ? _clamp01(_stab * (0.3 + 0.7 * _rain))  // active network
                                   : (_hadLiquid ? 0.4 * _clamp01(_erosion) : 0.0);  // faint relict / none if airless
      state.fluvialDepth    = 0.08 + 0.10 * _rain + 0.04 * _clamp01(_g);
      state.fluvialMeander  = 0.3 + 0.5 * _rain;
      // ── F14 lakes & seas — standing liquid (card §6.5 step 4) ──
      // Coverage ∝ stability × volatile budget; seaLevel maps coverage onto the accumulated-h
      // range (≈ -0.2 low basins … +0.3 drowns most relief). Same _wet gate as F11: a world
      // that can't hold surface liquid gets seaLevel -1 (the shader pass early-outs).
      const _vol = _clamp01((_fp.composition?.volatileFraction ?? 0) * 2.0);
      const _seaCoverage = _wet ? _clamp01(_stab * _vol) : 0.0;
      state.seaLevel = _wet && _seaCoverage > 0.0 ? -0.2 + 0.5 * _seaCoverage : -1.0;
      uniforms.uLiquidMask.value = _seaCoverage;   // the F36 coverage scalar (registry row)
      // ── F12 deltas & fans — deposition tracks the channel network: density × activity
      // (active worlds sharp lobes, relict Mars-like worlds subdued fans; zero without rivers).
      state.deltaDensity = state.fluvialDensity * (0.5 + 0.5 * state.fluvialActivity);
      state._derived = u;
      syncDisplays();
      applyArchetypeFilter();   // preset changed → re-derive relevant archetype + re-filter

    const featureFolders = {
      craters: fCraters, ejecta: fEjecta, mountains: fMountains, canyons: fCanyons,
      scarps: fScarps, plateaus: fPlateaus, tessera: fTessera, edifices: fEdifices,
      lava: fLava, chaos: fChaos, cryoRidge: fCryoRidge, frost: fFrost,
      sublimation: fSub, glacial: fGlacial, rivers: fRivers, lakes: fLakes,
      deltas: fDeltas,
    };
    // Move each feature's enable controller out of the folder body and into its
    // title bar (design 2026-06-07, mechanism b). The controller stays in the
    // gui tree, so syncDisplays()/updateDisplay() keeps the title box synced when
    // presets/solo/enable-all flip enables. stopPropagation → toggling the box
    // doesn't collapse the folder.
    function relocateEnableToTitle(folder, prop){
      const ctrl = folder.controllers.find(c => c.property === prop);
      if (!ctrl) return;
      const title = folder.$title;
      title.classList.add('title-has-toggle');
      ctrl.domElement.classList.add('title-toggle');
      ctrl.domElement.addEventListener('click', e => e.stopPropagation());
      title.appendChild(ctrl.domElement);
    }
    for (const [key, folder] of Object.entries(featureFolders)) {
      relocateEnableToTitle(folder, FEATURES[key].enableKey);
    }
    // soloKey=null → enable ALL features; otherwise enable ONLY that feature.
    function setFeatureEnables(soloKey){
      for (const k of Object.keys(FEATURES)) {
        state[FEATURES[k].enableKey] = (soloKey === null) || (k === soloKey);
      }
      syncDisplays();
    }
    // The relevant feature set = UNION of featuresOf() over every archetype whose
    // presets include the current Drivers preset (Frozen maps to two → union).
    function relevantFeatureSet(){
      const archs = Object.keys(ARCHETYPES).filter(a => ARCHETYPES[a].presets.includes(driverUI.preset));
      const set = new Set();
      for (const a of archs) for (const k of featuresOf(a)) set.add(k);
      return { set, archs };
    }
    function applyArchetypeFilter(){
      const { set, archs } = relevantFeatureSet();
      filterUI.archetypeLabel = archs.map(a => ARCHETYPES[a].label).join(' + ') || '(none)';
      for (const [key, folder] of Object.entries(featureFolders)) {
        if (!filterUI.filter || set.has(key)) folder.show(); else folder.hide();
      }
      syncDisplays();
    }
    // One 🔆 solo button per feature folder (appended below its existing controls).
    for (const [key, folder] of Object.entries(featureFolders)) {
      folder.add({ solo(){ setFeatureEnables(key); } }, 'solo').name('🔆 solo (isolate)');
    }
    // Header controls live in the top fFilter folder.
    fFilter.add(filterUI, 'archetypeLabel').name('archetype').disable();
    fFilter.add(filterUI, 'filter').name('filter to relevant').onChange(applyArchetypeFilter);
    fFilter.add({ enableAll(){ setFeatureEnables(null); } }, 'enableAll').name('enable all');
    fFilter.add({ clearSolo(){ setFeatureEnables(null); } }, 'clearSolo').name('clear solo');

    // ▸ Seeds — macro shifts continents (octaves 0-2), detail shifts texture (3+)
    const fSeeds = guiLeft.addFolder('Seeds'); fSeeds.close();
    fSeeds.add(state, 'macroSeed', 0, 10000, 1).name('macro seed').listen().onChange(updateSeedUniforms);
    fSeeds.add(state, 'detailSeed', 0, 10000, 1).name('detail seed').listen().onChange(updateSeedUniforms);
    fSeeds.add({ newPlanet(){ state.macroSeed = (Math.random()*10000)|0; state.detailSeed = (Math.random()*10000)|0; updateSeedUniforms(); } }, 'newPlanet').name('New planet (re-roll both)');

    // ▸ Presets — lil-gui save/load round-trips the whole panel as JSON
    const fPresets = guiLeft.addFolder('Presets'); fPresets.close();
    fPresets.add({ copy(){ const j = JSON.stringify(saveAll()); window._lab._lastCopied = j; navigator.clipboard?.writeText(j).catch(()=>{}); } }, 'copy').name('Copy settings (JSON)');
    fPresets.add({ reset(){ resetAll(); rebuildTarget(); updateSeedUniforms(); } }, 'reset').name('Reset to defaults');

    applyDrivers();   // load the default driver bundle (Rocky) into the envelope uniforms

    // ─────────────────────────────────────────────────────────────────────────
    // Mouse orbit + zoom — ports src/camera/CameraController.js to the lab.
    // Left-drag => orbit (yaw/pitch); wheel => zoom (distance). Camera moves,
    // planet quaternion stays identity, so object-space light math is unchanged.
    // ─────────────────────────────────────────────────────────────────────────
    const DRAG_SENS = 0.003;          // matches CameraController.dragSensitivity
    const PITCH_LIMIT = 1.55;         // ~89°, avoid pole flip
    let dragging = false, lastX = 0, lastY = 0;
    canvas.addEventListener('pointerdown', (e) => {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      try { canvas.setPointerCapture(e.pointerId); } catch {}   // keep tracking if drag leaves canvas
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      state.yaw   -= dx * DRAG_SENS;
      state.pitch += dy * DRAG_SENS;
      state.pitch = Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, state.pitch));
    });
    const endDrag = (e) => {
      dragging = false;
      if (e.pointerId != null && canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.ctrlKey) return;   // Ctrl+wheel = browser-zoom intent; block it (preventDefault above) but don't move the camera
      // multiplicative => even feel across the range; clamp surface-skim(1.1)..overview(30)
      const factor = Math.exp(Math.sign(e.deltaY) * 0.12);
      state.distance = Math.max(1.1, Math.min(30, state.distance * factor));
    }, { passive: false });

    // ─────────────────────────────────────────────────────────────────────────
    // Copy / apply settings — serialize the live look so Max can paste it back
    // in chat and the next agent can reproduce "the settings he likes".
    // ─────────────────────────────────────────────────────────────────────────
    function settingsBlob(){
      return {
        pixelScale: state.pixelScale, octaves: state.octaves, octAuto: state.octAuto,
        levels: state.levels, perturb: state.perturb, normalMode: state.normalMode,
        fwClamp: state.fwClamp, spinSpeed: state.spinSpeed,
        macroSeed: state.macroSeed, detailSeed: state.detailSeed,
        yaw: +state.yaw.toFixed(4), pitch: +state.pitch.toFixed(4), distance: +state.distance.toFixed(2),
      };
    }
    // Programmatic state apply (used by chrome-devtools verification + Copy-paste round-trip).
    // Sets state keys directly, refreshes derived uniforms, then syncs the lil-gui display.
    function applySettings(o){
      if (!o) return;
      const keys = ['pixelScale','octaves','levels','perturb','distance','yaw','pitch',
                    'macroSeed','detailSeed','octAuto','fwClamp','spinSpeed','normalMode'];
      for (const k of keys) if (o[k] != null) state[k] = o[k];
      if (o.pixelScale != null) rebuildTarget();
      updateSeedUniforms();
      syncDisplays();
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Loop
    // ─────────────────────────────────────────────────────────────────────────
    const hud = $('hud');
    const lightObj = new THREE.Vector3();
    const invQuat = new THREE.Quaternion();
    let t = 0;

    function frame(){
      t += 0.0025;
      planet.rotation.y += state.spinSpeed;   // 0 = stopped; 0.000375 (slider center) = the original rate

      // Camera orbits the origin (yaw/pitch/distance) — mouse-driven, mirrors CameraController.
      const dist = state.distance * R;
      const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
      camera.position.set(
        dist * cp * Math.sin(state.yaw),
        dist * sp,
        dist * cp * Math.cos(state.yaw)
      );
      camera.lookAt(0, 0, 0);

      const lod = lodRampOf(state.distance);
      const oct = state.octAuto ? autoOctaves(lod) : state.octaves;
      // Discrete which-body-is-LOD2 flag, hysteresis-guarded (enter 18 / exit 22) to stop flicker.
      state._lod2Active = lodHysteresis(state.distance, state._lod2Active ?? false);

      // Light dir into object space (sphere rotates; lighting math is object-space)
      invQuat.copy(planet.quaternion).invert();
      lightObj.copy(WORLD_LIGHT).applyQuaternion(invQuat);

      uniforms.uOctaves.value = oct;
      uniforms.uLodRamp.value = lod;
      uniforms.uLevels.value = state.levels;
      uniforms.uPerturb.value = state.perturb;
      uniforms.uNormalMode.value = state.normalMode;
      uniforms.uFwClamp.value = state.fwClamp ? 1 : 0;
      uniforms.uDitherMode.value = state.ditherMode;
      uniforms.uEmissive.value = state.emissive;
      uniforms.uSpecStrength.value = state.specStrength;
      uniforms.uLimbStrength.value = state.limbStrength;
      uniforms.uProvinceWeight.value = state.provinceWeight;
      uniforms.uSeaLevel.value = state.lakesEnabled ? state.seaLevel : -1.0;   // ✓ enable gate (preserves slider value)
      uniforms.uDeltaDensity.value = state.deltasEnabled ? state.deltaDensity : 0.0;   // ✓ enable gate
      uniforms.uDeltaAmp.value = state.deltaAmp;
      uniforms.uDeltaApronH.value = state.deltaApronH;
      uniforms.uEmissiveBypass.value = state.emissiveBypass ? 1 : 0;
      uniforms.uSpecBypass.value = state.specBypass ? 1 : 0;
      uniforms.uLimbBypass.value = state.limbBypass ? 1 : 0;
      uniforms.uTime.value = t;   // clouds drift + aurora rays animate (Task 7)
      uniforms.uDebugMode.value = state.debugMode | 0;
      uniforms.uVoroScale.value = state.voroScale;
      // uVoroCells set by applyDrivers (qualityTier) — the debug folder's voroCells
      // still drives the spike viz; craters read the driver-set uVoroCells.
      if (state.debugMode > 0) uniforms.uVoroCells.value = state.voroCells | 0;
      uniforms.uCraterDensity.value    = state.cratersEnabled ? state.craterDensity : 0.0;   // ✓ enable gate (preserves slider value)
      uniforms.uCraterComplexD.value   = state.craterComplexD;
      uniforms.uCraterRelaxation.value = state.craterRelaxation;
      uniforms.uTerraceCount.value     = state.terraceCount;
      uniforms.uCraterScale.value      = state.craterScale;
      uniforms.uCraterAmp.value        = state.craterAmp;
      // F3 ejecta & rays — strength/rampart/ray-brightness driven; amp/lump/count/sharp lab.
      uniforms.uEjectaStrength.value   = state.ejectaEnabled ? state.ejectaStrength : 0.0;   // ✓ enable gate
      uniforms.uEjectaRampart.value    = state.ejectaRampart;
      uniforms.uEjectaAmp.value        = state.ejectaAmp;
      uniforms.uEjectaLump.value       = state.ejectaLump;
      uniforms.uRayBrightness.value    = state.ejectaEnabled ? state.rayBrightness : 0.0;    // ✓ enable gate (rays share toggle)
      uniforms.uRayCount.value         = state.rayCount;
      uniforms.uRaySharp.value         = state.raySharp;
      // F1 mountains — amplitude/orogeny driven; ridge fold + scale lab-tunable.
      uniforms.uMountainAmp.value      = state.mountainsEnabled ? state.mountainAmp : 0.0;   // ✓ enable gate
      uniforms.uRidgeOffset.value      = state.ridgeOffset;
      uniforms.uRidgeGain.value        = state.ridgeGain;
      uniforms.uOrogenyStrength.value  = state.orogenyStrength;
      uniforms.uOrogenyAxis.value.set(Math.cos(state.orogenyAngle), Math.sin(state.orogenyAngle));
      uniforms.uMountainScale.value    = state.mountainScale;
      // F4 canyons — depth/count/width/floor driven+lab; axes set in applyDrivers (seed prop).
      uniforms.uChasmaDepth.value      = state.canyonsEnabled ? state.chasmaDepth : 0.0;   // ✓ enable gate
      uniforms.uChasmaCount.value      = state.chasmaCount | 0;
      uniforms.uChasmaWidth.value      = state.chasmaWidth;
      uniforms.uChasmaFloor.value      = state.chasmaFloor;
      // F5 scarps — strength/style driven; width/freq/warp lab-tunable; axis set in applyDrivers.
      uniforms.uScarpStrength.value    = state.scarpsEnabled ? state.scarpStrength : 0.0;   // ✓ enable gate
      uniforms.uScarpStyle.value       = state.scarpStyle;
      uniforms.uScarpWidth.value       = state.scarpWidth;
      uniforms.uScarpFreq.value        = state.scarpFreq;
      uniforms.uScarpWarp.value        = state.scarpWarp;
      uniforms.uScarpWarpFreq.value    = state.scarpWarpFreq;
      // F6 plateaus — strength driven; scale/offset/levels/softness lab-tunable.
      uniforms.uPlateauStrength.value  = state.plateausEnabled ? state.plateauStrength : 0.0;   // ✓ enable gate
      uniforms.uPlateauScale.value     = state.plateauScale;
      uniforms.uPlateauOffset.value    = state.plateauOffset;
      uniforms.uPlateauLevels.value    = state.plateauLevels;
      uniforms.uPlateauSoftness.value  = state.plateauSoftness;
      uniforms.uTesseraStrength.value  = state.tesseraEnabled ? state.tesseraStrength : 0.0;   // ✓ enable gate
      uniforms.uTesseraFreq.value      = state.tesseraFreq;
      uniforms.uTesseraWarp.value      = state.tesseraWarp;
      uniforms.uTesseraWarpFreq.value  = state.tesseraWarpFreq;
      // F7 edifices — volcanism/height/viscosity driven; scale/amp/caldera lab-tunable.
      uniforms.uVolcanismStrength.value = state.edificesEnabled ? state.volcanismStrength : 0.0;   // ✓ enable gate
      uniforms.uEdificeMaxHeight.value = state.edificeMaxHeight;
      uniforms.uShieldStratoMix.value  = state.shieldStratoMix;
      uniforms.uEdificeScale.value     = state.edificeScale;
      uniforms.uEdificeAmp.value       = state.edificeAmp;
      uniforms.uEdificeCaldera.value   = state.edificeCaldera;
      // F8 lava plains — coverage (SMOOTHS relief, gates region) + activity (emissive cracks)
      // driven; wrinkle/crack/glow lab-tunable. The enable toggle gates BOTH the early-outs
      // (uLavaCoverage zeroes the plains combiner AND the crack emissive's coverage guard).
      uniforms.uLavaCoverage.value = state.lavaEnabled ? state.lavaCoverage : 0.0;   // ✓ enable gate
      uniforms.uLavaActivity.value = state.lavaEnabled ? state.lavaActivity : 0.0;   // ✓ enable gate (cracks dark)
      uniforms.uLavaAxis.value.set(state.lavaAxis[0], state.lavaAxis[1], state.lavaAxis[2]);
      uniforms.uLavaScale.value    = state.lavaScale;
      uniforms.uWrinkleAmp.value   = state.wrinkleAmp;
      uniforms.uWrinkleFreq.value  = state.wrinkleFreq;
      uniforms.uWrinkleWarp.value  = state.wrinkleWarp;
      uniforms.uCrackScale.value   = state.crackScale;
      uniforms.uCrackWidth.value   = state.crackWidth;
      uniforms.uLavaGlowRate.value = state.lavaGlowRate;
      // F9/F10 icy terrain — uCryoActivity is the SHARED seam (lab-knob stub, owner Cryo; gates
      // BOTH combiners' early-out). Per-feature enables zero each feature's OWN amplitude for
      // independent A/B (chaos → jitter+matrixRough to 0; ridges → amp to 0); SHAPE is driven.
      uniforms.uCryoActivity.value     = state.cryoActivity;
      uniforms.uChaosCellScale.value   = state.chaosCellScale;
      uniforms.uChaosRaftJitter.value  = state.chaosEnabled ? state.chaosRaftJitter : 0.0;   // ✓ enable gate
      uniforms.uChaosMatrixRough.value = state.chaosEnabled ? state.chaosMatrixRough : 0.0;  // ✓ enable gate
      uniforms.uChaosMaskScale.value   = state.chaosMaskScale;
      uniforms.uDoubleRidgeFreq.value  = state.doubleRidgeFreq;
      uniforms.uCryoRidgeOffset.value  = state.cryoRidgeOffset;
      uniforms.uCryoRidgeWidth.value   = state.cryoRidgeWidth;
      uniforms.uGroovedBandFreq.value  = state.groovedBandFreq;
      uniforms.uCryoRidgeAmp.value     = state.cryoRidgeEnabled ? state.cryoRidgeAmp : 0.0;   // ✓ enable gate
      uniforms.uCryoRidgeWarp.value    = state.cryoRidgeWarp;
      uniforms.uCryoRidgeAxis0.value.set(state.cryoRidgeAxis0[0], state.cryoRidgeAxis0[1], state.cryoRidgeAxis0[2]);
      uniforms.uCryoRidgeAxis1.value.set(state.cryoRidgeAxis1[0], state.cryoRidgeAxis1[1], state.cryoRidgeAxis1[2]);
      // Cryo step 2 frost-coverage — ✓ enable gate zeroes the BUDGET (clean A/B; shape/tint preserved)
      uniforms.uFrostMaxCoverage.value   = state.frostEnabled ? state.frostMaxCoverage : 0.0;   // ✓ enable gate
      uniforms.uFrostCondensationT.value = state.frostCondensationT;
      uniforms.uFrostLatitudeBias.value  = state.frostLatitudeBias;
      uniforms.uFrostAlbedo.value.setRGB(state.frostAlbedo[0], state.frostAlbedo[1], state.frostAlbedo[2]);
      uniforms.uPlanetTempEq.value       = state.tempEq;
      uniforms.uFrostLocked.value        = state.frostLocked;
      uniforms.uFrostLatChill.value      = state.frostLatChill;
      uniforms.uFrostLapseRate.value     = state.frostLapseRate;
      uniforms.uFrostEdgeSoftness.value  = state.frostEdgeSoftness;
      uniforms.uFrostNoiseAmp.value      = state.frostNoiseAmp;
      uniforms.uFrostNoiseScale.value    = state.frostNoiseScale;
      uniforms.uFrostOffset.value.set(state.frostOffset[0], state.frostOffset[1], state.frostOffset[2]);
      uniforms.uPldStrength.value        = state.frostEnabled ? state.pldStrength : 0.0;   // F22 PLD rides the ✓ enable gate
      uniforms.uPldLevels.value          = state.pldLevels;
      uniforms.uPldSoftness.value        = state.pldSoftness;
      // Cryo step 4 F18 sublimation — ✓ enable gate zeroes the gate (clean A/B; shape knobs preserved)
      uniforms.uSubStrength.value        = state.subEnabled ? state.subStrength : 0.0;   // ✓ enable gate
      uniforms.uVolatileSpecies.value    = state.volatileSpecies;
      uniforms.uSubAmp.value             = state.subAmp;
      uniforms.uSubPitScale.value        = state.subPitScale;
      uniforms.uSubPolyScale.value       = state.subPolyScale;
      uniforms.uSubFloorFrac.value       = state.subFloorFrac;
      uniforms.uSubPitDensity.value      = state.subPitDensity;
      uniforms.uBladeFreq.value          = state.bladeFreq;
      uniforms.uBladeSharp.value         = state.bladeSharp;
      uniforms.uSubColdGate.value        = state.subColdGate;
      uniforms.uGlacialStrength.value    = state.glacialEnabled ? state.glacialStrength : 0.0;   // ✓ enable gate
      uniforms.uGlacialFlowVigor.value   = state.glacialFlowVigor;
      uniforms.uGlacialAmp.value         = state.glacialAmp;
      uniforms.uGlacialScale.value       = state.glacialScale;
      uniforms.uGlacialSlopeDamp.value   = state.glacialSlopeDamp;
      uniforms.uGlacialBasinThresh.value = state.glacialBasinThresh;
      uniforms.uLineationAmp.value       = state.lineationAmp;
      uniforms.uLineationFreq.value      = state.lineationFreq;
      uniforms.uLineationWarp.value      = state.lineationWarp;
      uniforms.uLineationWarpFreq.value  = state.lineationWarpFreq;
      uniforms.uGlacialColdGate.value    = state.glacialColdGate;
      // 🎲 per-feature domain offsets (axes are written directly by the 🎲 handlers / applyDrivers)
      uniforms.uCraterOffset.value.set(state.craterOffset[0], state.craterOffset[1], state.craterOffset[2]);
      uniforms.uMountainDomainOffset.value.set(state.mountainDomainOffset[0], state.mountainDomainOffset[1], state.mountainDomainOffset[2]);
      uniforms.uScarpDomainOffset.value.set(state.scarpDomainOffset[0], state.scarpDomainOffset[1], state.scarpDomainOffset[2]);
      uniforms.uPlateauDomainOffset.value.set(state.plateauDomainOffset[0], state.plateauDomainOffset[1], state.plateauDomainOffset[2]);
      uniforms.uTesseraDomainOffset.value.set(state.tesseraDomainOffset[0], state.tesseraDomainOffset[1], state.tesseraDomainOffset[2]);
      uniforms.uEdificeOffset.value.set(state.edificeOffset[0], state.edificeOffset[1], state.edificeOffset[2]);
      uniforms.uLavaOffset.value.set(state.lavaOffset[0], state.lavaOffset[1], state.lavaOffset[2]);
      uniforms.uChaosOffset.value.set(state.chaosOffset[0], state.chaosOffset[1], state.chaosOffset[2]);
      uniforms.uCryoRidgeOffsetV.value.set(state.cryoRidgeOffsetV[0], state.cryoRidgeOffsetV[1], state.cryoRidgeOffsetV[2]);
      uniforms.uSubOffset.value.set(state.subOffset[0], state.subOffset[1], state.subOffset[2]);
      uniforms.uGlacialOffset.value.set(state.glacialOffset[0], state.glacialOffset[1], state.glacialOffset[2]);
      // F11 fluvial — riversEnabled gates density→0 (early-out), preserving the slider value.
      uniforms.uFluvialDensity.value  = state.riversEnabled ? state.fluvialDensity : 0.0;
      uniforms.uFluvialActivity.value = state.fluvialActivity;
      uniforms.uFluvialDepth.value    = state.fluvialDepth;
      uniforms.uFluvialMeander.value  = state.fluvialMeander;
      uniforms.uFluvialWidth.value    = state.fluvialWidth;
      uniforms.uFluvialFreq.value     = state.fluvialFreq;
      uniforms.uFluvialWarpAmt.value  = state.fluvialWarp;
      uniforms.uFluvialLowBias.value  = state.fluvialLowBias;
      uniforms.uFluvialOffset.value.set(state.fluvialOffset[0], state.fluvialOffset[1], state.fluvialOffset[2]);
      uniforms.uLightDir.value.copy(lightObj);

      hud.textContent =
        `dist/radius : ${state.distance.toFixed(1)}\n` +
        `pixelScale  : ÷${state.pixelScale}  (cell ≈ ${state.pixelScale}px)\n` +
        `lodRamp     : ${lod.toFixed(3)}\n` +
        `lod2 flag   : ${state._lod2Active ? 'ACTIVE' : 'off'}\n` +
        `octaves(eff): ${oct.toFixed(2)}${state.octAuto ? '  (auto)' : '  (manual)'}\n` +
        `posterize   : ${state.levels} levels\n` +
        `normals     : ${state.normalMode === 0 ? 'analytic' : 'finite-diff'}\n` +
        `fwidth clamp: ${state.fwClamp ? 'on' : 'off'}`;

      // Pass 1: planet into low-res buffer (dither runs in here → chunky cells)
      renderer.setRenderTarget(sceneTarget);
      renderer.render(scene, camera);
      // Pass 2: nearest-upscale blit to the screen
      renderer.setRenderTarget(null);
      renderer.render(blitScene, blitCamera);
      requestAnimationFrame(frame);
    }
    rebuildTarget();
    frame();

    window.addEventListener('resize', () => {
      const { w, h } = rebuildTarget();
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ─────────────────────────────────────────────────────────────────────────
    // "?" help overlay — self-documenting so the code needn't be open
    // ─────────────────────────────────────────────────────────────────────────
    $('help').innerHTML = `
      <h2>PLANET LOD LAB — WHAT THIS IS</h2>
      <p>Isolated harness for the <b>LOD2 close-up planet detail</b> feature: when you
      fly close to a planet, getting nearer should add <b>more surface DETAIL</b>
      (finer relief, more noise octaves) — not just a bigger blurry sphere. It also
      A/Bs a new <b>analytic-derivative normal</b> stack against the production
      finite-diff path. Everything renders through the same low-res dithered retro
      pipeline the real game uses, so any envelope judgment here is at the true scale.</p>

      <h3>CONTROLS</h3>
      <dl>
        <dt>macro / detail seed</dt><dd>Re-rolls the terrain by sampling a different region of the noise field. <b>macro</b> reshapes the big continents (octaves 0–2); <b>detail</b> varies the fine surface texture (octaves 3+) while the continents hold. ◀▶ step ±1, rnd jumps to a random seed. Both seeds are saved by Copy settings, so a planet you like is reproducible.</dd>
        <dt>mouse: drag / scroll</dt><dd>Drag to orbit the planet (yaw + pitch, clamped ±89°); scroll wheel to zoom — distance 1.1 = surface-skimming (fills the screen), 30 = overview. Distance drives lodRamp. Ports src/camera/CameraController.js.</dd>
        <dt>pixelScale (÷)</dt><dd>Renders the planet into a low-res buffer (¼, ⅓…) then nearest-upscales. Matches production RetroRenderer (÷3). Higher = chunkier dither cells. This is the faithful retro lever — the inline Bayer runs inside this buffer.</dd>
        <dt>octaves</dt><dd>Manual FBM octave count (used only when "Octaves: MANUAL"). More octaves = finer relief.</dd>
        <dt>posterize lv</dt><dd>Number of brightness bands the dither quantizes to. Fewer = harder retro banding.</dd>
        <dt>perturb</dt><dd>Relief strength — how much the surface noise bends the shading normal.</dd>
        <dt>Normals: ANALYTIC / FINITE-DIFF</dt><dd>A/B the new one-eval analytic-gradient normals vs the production 3-tap finite-difference path, at the same distance. Analytic should carry relief across the whole lit face; finite-diff goes flat in direct light (relief only near the terminator).</dd>
        <dt>Octaves: AUTO / MANUAL</dt><dd>AUTO = octaves ramp with distance: mix(4,9,lodRamp). MANUAL hands the octave slider control.</dd>
        <dt>fwidth clamp</dt><dd>Fades octaves that have shrunk below ~1 screen pixel to their mean, killing dither shimmer/aliasing on the far side. Off = see the raw shimmer.</dd>
        <dt>spin speed (rad/frame)</dt><dd>Auto-rotates the planet so you can watch the terminator sweep. 0 = stopped (default — drag to rotate it yourself); the slider center (0.000375 rad/frame) is the original auto-rate.</dd>
        <dt>Copy settings</dt><dd>Writes the live state (pixelScale, octaves, levels, perturb, toggles, yaw/pitch/distance) to the clipboard as JSON. Paste it back in chat so the next agent can reproduce the look.</dd>
        <dt>Reset</dt><dd>Restores all defaults (distance 20, ÷3, analytic, auto octaves, clamp on, spin speed 0).</dd>
      </dl>

      <h3>HUD READOUTS (top-left)</h3>
      <dl>
        <dt>dist/radius</dt><dd>Current approach distance in radii.</dd>
        <dt>pixelScale</dt><dd>The buffer divisor and the resulting on-screen dither-cell size in CSS px.</dd>
        <dt>lodRamp</dt><dd>0→1 detail ramp: <code>smoothstep(20,6,approach)</code>. 1 = closest/most detail.</dd>
        <dt>octaves(eff)</dt><dd>Effective octave count actually fed to the FBM this frame (auto or manual).</dd>
        <dt>posterize</dt><dd>Active brightness-band count.</dd>
        <dt>normals</dt><dd>Which normal path is live (analytic | finite-diff).</dd>
        <dt>fwidth clamp</dt><dd>Whether the sub-pixel octave fade is on.</dd>
      </dl>
    `;
    $('helpBtn').addEventListener('click', () => $('help').classList.toggle('open'));

    // Expose for chrome-devtools verification (set state, read a frame)
    window._lab = { state, uniforms, planet, camera, lodRampOf, autoOctaves, rebuildTarget,
                    settingsBlob, applySettings, driverUI, applyDrivers,
                    setPreset(name){ if (DRIVER_PRESETS[name]) { driverUI.preset = name; applyDrivers(); } return state._derived; },
                    setQuality(q){ driverUI.qualityTier = q; applyDrivers(); return state._derived; },
                    solo(key){ setFeatureEnables(key); }, enableAllFeatures(){ setFeatureEnables(null); },
                    setFilter(on){ filterUI.filter = on; applyArchetypeFilter(); },
                    featureVisible(key){ return !featureFolders[key]._hidden; },
                    featureEnabled(key){ return !!state[FEATURES[key].enableKey]; },
                    featureFolders, filterUI,
                    get sceneTarget(){ return sceneTarget; } };
  </script>
</body>
