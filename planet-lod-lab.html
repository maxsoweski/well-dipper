          float cityMask = smoothstep(cityThresh, cityThresh + 0.12, cityFbm) * cityLand * clamp(cityCoast, 0.0, uCityCoastBoost);
          float cityNight = 1.0 - smoothstep(-0.1, 0.1, diff);                  // LIVE aurora nightMask form (NOT the card-prose smoothstep(0.1,-0.1,diff), invalid GLSL)
          float city = cityMask * cityNight * uCityIntensity * provinceWeight(PROV_CITYLIGHTS);
          cityC = uCityColor * clamp(city, 0.0, 1.0);
        }
        // ★ F49 ecumenopolis night glow — F48's warm grid run to SATURATION (whole-surface lattice, no
        // dark rural/ocean gaps — UAT item 1) + per-district hash brightness tiering (bright cores / dim
        // sprawl — UAT item 6), on the post-quantizer emissive-bypass channel, gated by the aurora nightMask.
        // SATURATION distinctive vs F48: the +0.25 floor on the grid term + HIGH default coverage means the
        // WHOLE nightside glows. Deterministic (uMacroOffset-seeded); uEcuCoverage 0 ⇒ ecuC = vec3(0) exactly.
        vec3 ecuC = vec3(0.0);
        if (uEcuCoverage > 0.0) {
          float ecuCovE = ecuCoverageMask(vPos) * provinceWeight(PROV_ECUMENOPOLIS);
          vec4 ecuEw = noised(vPos * (uEcuDistrictScale*0.6) + uMacroOffset + vec3(-3.1,8.4,1.7));
          vec3 ecuEwp = vPos + uEcuWarpAmt * vec3(ecuEw.x, ecuEw.y, ecuEw.z);
          vec3 ecuDistId, ecuGE;
          vec2 ecuRE = voronoi3d(ecuEwp * uEcuDistrictScale, 27, ecuDistId, ecuGE);
          float ecuDistHash = hash33(ecuDistId).x;
          float ecuBright = mix(0.35, 1.0, ecuDistHash);                       // bright cores / dim sprawl tiering
          float ecuGrid = 1.0 - smoothstep(0.0, uEcuSeamWidth*1.5, ecuRE.y - ecuRE.x); // glowing street lattice
          float ecuNight = 1.0 - smoothstep(-0.1, 0.1, diff);                  // LIVE aurora nightMask form (NOT card-prose smoothstep(0.1,-0.1), invalid GLSL)
          float ecuGlow = (ecuGrid + 0.25) * ecuBright * ecuNight * uEcuGlowIntensity * ecuCovE;  // +0.25 floor ⇒ whole nightside glows (saturation)
          ecuC = uEcuGlowColor * clamp(ecuGlow, 0.0, 1.0);
        }
        // ★ F30 lightning — transient convective flash blobs; bypasses the quantizer so
        // each pop stays crisp over the posterized cloud deck (card §6 item 6). Strength 0
        // (enable off, or any airless preset) skips the call: byte-identical F29 output —
        // the F30 regression contract.
        if (uLightningStrength > 0.0) emissive += lightningEmissive(vPos, N, diff, cw.x);
        // ★ F32/F33 thermal day/night — irradiation-driven self-emission on locked hot
        // worlds (ONE temperature curve, two consumers — the emissiveBlackbody header
        // contract). Energy-balance kernel (F32 card section 4): tempK ramps from the
        // F33 night floor to the F32 day peak with starFacing^redistribution, where the
        // facing is taken against uThermalDir — uLightDir rotated EAST about the spin
        // axis by the superrotation hotspot offset (CPU per-frame writer), so the glow
        // bleeds past one terminator and dies before the other. Hue = the shared
        // emissiveBlackbody ramp. Brightness = a stylized Stefan-Boltzmann nod,
        // (tempK/1800)^4 saturating at 1800 K — an ABSOLUTE ramp (deliberately NOT
        // normalized by uDayTempK): the writer's ownership split rewrites uDayTempK /
        // uNightTempK on enable toggles, and an absolute ramp means the split changes
        // WHICH temps render, never how bright a given temperature is (exact A/B
        // continuity between solo and combined). F33 terms in the same block: a
        // low-frequency 3-octave fbmd silicate-cloud mask that only DARKENS the glow
        // on the night hemisphere (Gao/Powell nightside decks block outgoing IR —
        // dark patches, never bright), plus a thin warm fresnel rim on the dark limb
        // so the silhouette stays legible at full-disk distance; the rim rides the
        // night temperature's own brightness ramp, so F33-off extinguishes it with
        // the floor. Strength 0 (every pre-existing preset derives 0) skips the whole
        // block: byte-identical F31 output — the F32/F33 regression contract.
        if (uThermalStrength > 0.0){
          float sf = max(dot(N, uThermalDir), 0.0);
          float tempK = mix(uNightTempK, uDayTempK, pow(sf, uRedistribution));
          float tb = clamp(tempK * (1.0 / 1800.0), 0.0, 1.0);
          float tb2 = tb * tb;
          float thermalBright = tb2 * tb2;                          // (tempK/1800)^4 via squares (no pow edge cases)
          // F33 silicate occlusion — patchy low-freq deck, slow superrotation drift;
          // confined to the night hemisphere (fades out by sf 0.25) so the dayside
          // lobe stays clear (the decks condense where it is cold, card F33 section 4).
          float nightHemi = 1.0 - smoothstep(0.0, 0.25, sf);
          float socc = smoothstep(0.05, 0.45, fbmd(vPos * 0.9 + vec3(uTime * 0.012, 0.0, 0.0), 3.0, 0.0).x);
          float thermalOcc = 1.0 - uThermalOcclusion * socc * nightHemi;
          vec3 thermalC = emissiveBlackbody(tempK) * thermalBright * thermalOcc * provinceWeight(PROV_DAYTHERM);
          // F33 warm limb rim (dark side only) — fresnel^4 against the geometric
          // normal, night-gated; kept subtle (0.6 of the floor brightness at grazing).
          float fres = clamp(1.0 - max(dot(N, V), 0.0), 0.0, 1.0);
          float fres2 = fres * fres;
          float nb = clamp(uNightTempK * (1.0 / 1800.0), 0.0, 1.0);
          float nb2 = nb * nb;
          thermalC += emissiveBlackbody(uNightTempK) * (nb2 * nb2) * (fres2 * fres2) * nightHemi * 0.6 * provinceWeight(PROV_NIGHTTHERM);
          emissive += uThermalStrength * thermalC;
        }
        // ★ F41 hemispheric magma ocean — the EXOTIC consumer of the shared
        // emissiveBlackbody ramp (ONE curve, the F32/F33/F41 header contract; the
        // 1800 K-normalized quartic brightness is reused VERBATIM so a given
        // temperature renders the same energy in either feature). T(theta) follows
        // the K2-141b GCM irradiation law T_ss x cos^(1/4)(theta) — the pow base is
        // floored at 0.05 (always positive: never the spec-undefined pow region) —
        // so the bypass glow forms CONCENTRIC temperature contours: white/amber hot
        // pole fading to a dull-red shoreline rim along the blackbody ramp. In-sea
        // structure (the Kilauea foundering-crust read): dark plates separated by
        // bright incandescent seams — the F8 crack vocabulary on the SHARED
        // voronoi3d keystone, REUSING the F8 uCrackScale / uCrackWidth knobs +
        // uLavaOffset seed (one crack language per planet, no duplicated Voronoi).
        // Churn = BOUNDED two-phase advection (the F25/F40 fract crossfade —
        // nothing accumulates; fly-away/re-approach lands in a plausible nearby
        // state): two half-period phases drift the warp domain +-half around a rest
        // pose and crossfade on a triangle weight; the warp vector is the noised()
        // analytic gradient (one sample = a free vec3). Open melt at the hot pole
        // fades into crusted plates toward the shoreline (the mgCrust ramp — seams
        // carry the glow, plates keep a faint translucent floor), and the brightness
        // ramp itself dims the seams shoreward as T(theta) falls. The shoreline is
        // a thin ANIMATED emissive band straddling the mask edge (liquidus-
        // temperature waves lapping the rock; gaussian via exp(-t*t) — never
        // pow(neg); shimmer is periodic sin, no accumulation). ALL terms ride this
        // post-posterize emissive channel (the designated survivor, card §4).
        // Angle 0 (enable off via the per-frame writer, or every non-magma preset)
        // skips the block: byte-identical pre-F41 emissive — the regression contract.
        if (uMagmaSeaAngle > 0.0){
          float mgPh0 = fract(uTime * uMagmaChurnSpeed);
          float mgPh1 = fract(uTime * uMagmaChurnSpeed + 0.5);
          float mgWgt = abs(2.0 * mgPh0 - 1.0);                 // triangle weight hides each phase wrap
          vec3 mgDrift = vec3(0.30, 0.0, 0.22);                 // each phase displaced +-half around its rest pose
          vec4 mgW0 = noised(vPos * 1.9 + uLavaOffset + mgDrift * (mgPh0 - 0.5));
          vec4 mgW1 = noised(vPos * 1.9 + uLavaOffset + mgDrift * (mgPh1 - 0.5));
          vec3 mgWarpV = mix(mgW0.yzw, mgW1.yzw, mgWgt);        // churn warp vector (analytic gradient — free)
          vec3 mgC = vec3(0.0);
          if (mgSeaMask > 0.0){
            // cos floor 0.04 (review N1): K2's shoreline sits at cos 0.0465 — a
            // 0.05 floor disagrees with the CPU liquidus iso-angle solve there.
            float mgTempK = uMagmaTemp * pow(max(cos(vSubstellarAngle), 0.04), 0.25);
            float mgTb = clamp(mgTempK * (1.0 / 1800.0), 0.0, 1.0);
            float mgTb2 = mgTb * mgTb;                          // (tempK/1800)^4 via squares (no pow edge cases)
            vec3 mgCid; vec3 mgGrd;
            vec2 mgFF = voronoi3d((vPos + 0.16 * mgWarpV) * uCrackScale + uLavaOffset, uVoroCells, mgCid, mgGrd);
            float mgSeam = 1.0 - smoothstep(0.0, uCrackWidth, mgFF.y - mgFF.x);
            float mgRelT = clamp(vSubstellarAngle / max(uMagmaSeaAngle, 1e-3), 0.0, 1.0);   // 0 hot pole -> 1 shoreline (guarded div)
            float mgCrust = smoothstep(0.15, 0.65, mgRelT);     // open melt at the pole -> foundering plates shoreward
            float mgStruct = mix(1.0, max(mgSeam, 0.06), mgCrust);   // whole crust keeps a faint translucent floor
            mgC = emissiveBlackbody(mgTempK) * (mgTb2 * mgTb2) * mgStruct * mgSeaMask;   // mask already carries provinceWeight
          }
          // shoreline waves — thin emissive band on the SAME breakup-warped angle the
          // mask uses (so the band hugs the ragged shore exactly), at the liquidus
          // temperature: 0.27 = the 1300 K point on the shared 1800 K quartic.
          float mgShoreT = (mgAngleW - uMagmaSeaAngle) / 0.035;
          float mgShore = exp(-mgShoreT * mgShoreT) * (0.65 + 0.35 * sin(uTime * 1.3 + mgWarpV.x * 9.0));
          emissive += mgC + emissiveBlackbody(1300.0) * 0.27 * mgShore * provinceWeight(PROV_MAGMA);
        }
        // ★ F42 diamond glints + tar sheen — the carbon crust's two specular accents,
        // BOTH riding this post-posterize channel (the designated survivor family,
        // card section 6 item 3: "the few high-energy effects that look wrong when
        // banded" — a glint dithered into a soft blob is no glint). NOT thermal
        // emission (graphite at T_eq 600 is not visibly incandescent): both terms
        // are sun+view-dependent reflections, so each carries step(0.0001, diff) —
        // dark side stays dark. Diamond glints (card section 6.5 step 6) = the
        // game snow-sparkle technique: ONE voronoi3d call tiles sparse cells, a
        // per-cell hash33 picks the rare diamond-bearing cells (high threshold via
        // uGlintDensity) AND jitters a per-cell micro-normal off shadeN, then
        // pow(max(dot(Nc,H),0), 60) fires only when that cell's facet aligns with
        // the half-vector — isolated crisp specks that shift as sun/camera move,
        // confined to carbCrest (uplifted crests, the high-pressure-carbon story)
        // and masked OUT of tar fills upstream. Tar sheen = a broad soft
        // Blinn-Phong (exponent 8, dim — a waxy hydrocarbon flat, DELIBERATELY
        // distinct from F36's tight liquid glint at exp ~200 and from the hard
        // specks beside it) on the carbTar mask, whose F14-style flattened normal
        // the combiner already relaxed. Spec-safety: pow bases are max(dot,0)
        // clamped, exponents constant; no divisions. Strength 0 (enable off via
        // the per-frame writer, or every preset without the C/O field) skips the
        // block: byte-identical pre-F42 emissive — the F42 regression contract.
        if (uCarbonStrength > 0.0){
          vec3 cbHv = normalize(uLightDir + V);
          if (carbCrest > 0.0 && uGlintDensity > 0.0){
            vec3 cbCid; vec3 cbGrd;
            vec2 cbFF = voronoi3d(vPos * 16.0 + uDetailOffset, uVoroCells, cbCid, cbGrd);
            vec3 cbHash = hash33(cbCid + vec3(31.0));
            float cbSparse = step(1.0 - 0.15 * uGlintDensity, cbHash.x);     // rare diamond-bearing cells
            float cbSpot = 1.0 - smoothstep(0.0, 0.18, cbFF.x);              // speck hugs the cell center
            vec3 cbN = normalize(shadeN + 0.45 * (cbHash - 0.5));            // per-cell hashed micro-facet
            float cbGlint = pow(max(dot(cbN, cbHv), 0.0), 60.0);
            emissive += vec3(0.92, 0.96, 1.0) * 2.5 * cbGlint * cbSparse * cbSpot
                        * carbCrest * step(0.0001, diff)
                        * uCarbonStrength * provinceWeight(PROV_CARBON);
          }
          if (carbTar > 0.0){
            float cbSheen = pow(max(dot(shadeN, cbHv), 0.0), 8.0);
            emissive += vec3(0.32, 0.30, 0.26) * 0.12 * cbSheen * carbTar * step(0.0001, diff);
          }
        }
        // ★ F43 crystal facet sparks — per-facet specular glints riding the SAME post-
        // posterize emissive bypass family as the F42 glints (card section 6 item 3: a
        // crystal spark dithered into a soft blob is no spark). DISTINCT vocabulary from
        // F42: F42 sparks ride crest∩cell (diamond on uplifted carbon crests); F43 sparks
        // ride FACET ALIGNMENT — the facet's own tilted micro-normal (a per-cell hashed
        // tilt off shadeN, the same per-cell tilt the combiner banked into the relief)
        // aligning with the half-vector H, so as yaw sweeps the field, sparks flip on and
        // off facet-by-facet (the euhedral-face brightness-flip read, card UAT item 3).
        // Gated by fctMask (only on GROWN facets) × a sparse per-cell hash (rare bright
        // faces, not a speckle texture) × step(0.0001, diff) (dark side stays dark). A
        // reflection, NOT thermal emission (a crystal world at T_eq 150 is not incandescent).
        // Spec-safety: pow base is max(dot,0) clamped, exponent constant; no divisions.
        // uFacetStrength 0 (enable off via the writer, or every preset off the crystal class)
        // skips the block: byte-identical pre-F43 emissive — the F43 regression contract.
        if (uFacetStrength > 0.0 && fctMask > 0.0){
          vec3 fctHv = normalize(uLightDir + V);
          vec3 fctCid; vec3 fctCgrd;
          vec2 fctSF = voronoi3d(vPos * uFacetScale + uMacroOffset + vec3(41.3, -27.6, 9.4),
                                 uVoroCells, fctCid, fctCgrd);
          vec3 fctSh = hash33(fctCid);                                  // SAME cell hash as the combiner
          float fctSparse = step(0.62, hash33(fctCid + vec3(88.0)).y);  // rare bright faces
          float fctSpot = 1.0 - smoothstep(0.0, 0.30, fctSF.x);         // spark hugs the facet-face center (crisp, not whole-cell)
          vec3  fctN = normalize(shadeN + 0.55 * (fctSh - 0.5));        // the facet's tilted micro-normal
          float fctSpark = pow(max(dot(fctN, fctHv), 0.0), 80.0);       // tight per-facet lobe

                      * fctMask * step(0.0001, diff)
                      * uFacetStrength * provinceWeight(PROV_FACETS);
        }

        // ★ Sunglint (F36) — the mirror image of the star on standing liquid, LIQUID-ONLY.
        // Promoted from the Blinn-Phong stand-in (which glinted on the whole surface,
        // land included): the lobe now multiplies by the SAME Stage-4 liquidMask the
        // F14 sea cut / water coloring already use (the reserved Fluvial-to-Optical
        // contract), so adjacent land/ice stays matte and any no-sea preset (airless,
        // gas h2-he envelope, hot Venus: uSeaLevel -1 keeps liquidMask 0) renders NO
        // glint. shadeN inside the mask is the flattened (geometric) sea normal — the
        // F14 cut already relaxed grad to 0 there, so the lobe reads as one coherent
        // specular point pinned to the half-vector geometry, not relief sparkle.
        // Species + Cox-Munk arrive pre-derived (uGlintTint / uGlintExp / uSpecStrength:
        // water cold-white exp ~200, methane warm dim exp ~120; roughness broadens AND
        // dims at the per-frame writer). pow() base keeps the clamped max(dot, 0)
        // pattern and the exponent is floored — never spec-undefined. Glitter breakup
        // (card section 4 step 3): ONE high-frequency noised() sample from vPos (slow
        // uTime domain drift = shimmer, deterministic, no accumulation) resolves the
        // far-distance point into discrete specks at close LOD; the mask fades in on
        // uLodRamp (0 at d20 = clean single point) and the x2.2 gain compensates the
        // sparse-speck duty cycle so integrated energy stays comparable across the
        // fade. The strength-and-mask guard skips the whole block when the glint
        // cannot fire: enable off (writer zeroes uSpecStrength), no-sea presets, or
        // land fragments all yield specC = vec3(0) EXACTLY — the F36 regression
        // contract (the default LOOK changes by design: the stand-in's land sheen is
        // retired, logged as the card section 6.5 taste fork).
        vec3 specC = vec3(0.0);
        if (uSpecStrength > 0.0 && liquidMask > 0.0){
          vec3 H = normalize(uLightDir + V);
          float spec = pow(max(dot(shadeN, H), 0.0), max(uGlintExp, 1.0)) * uSpecStrength * step(0.0001, diff);
          spec *= liquidMask * provinceWeight(PROV_GLINT);
          float gn = noised(vPos * 60.0 + vec3(uTime * 0.35)).x;
          float specks = smoothstep(0.05, 0.35, gn) * 2.2;
          spec *= mix(1.0, specks, smoothstep(0.5, 1.0, uLodRamp));
          specC = uGlintTint * spec;
          specC = (uSpecBypass == 1) ? specC : posterize(specC, uLevels, fc, 0.4, uDitherMode);
        }

        // ★ Aurorae (F37) — driver-true night-side magnetic ovals, promoted from the
        // fixed-constant stand-in (lat 0.7 / width 0.12 / hard-coded green). The whole
        // production applyAurora() structure (Planet.js) ports in: a gaussian ring in
        // MAGNETIC latitude (mlat = dot(N, uMagAxis) — the ~11-deg dipole tilt makes
        // the oval visibly off-axis from the spin pole, the cheapest realism
        // multiplier per card section 4), a 2-octave anisotropic curtain (striations
        // HIGH-frequency along azimuth, LOW along latitude — the load-bearing curtain
        // cue), and a second slower noised() term as flicker (shimmer over a STEADY
        // oval — the card section 6 animation contract). nightMask + the additive
        // emissive-bypass compositing stay exactly where the stand-in sat (pure
        // luminance glow, never posterized — Option C). Spec-safety: the gaussian is
        // exp(-t*t) (no pow(neg)); azimuth needs NO atan at all — the unit in-plane
        // direction mDir (N projected off the dipole axis, normalized with a floored
        // denominator) feeds the noise domain directly, so the domain is continuous
        // everywhere (no -pi/pi seam) and merely spins fast near the magnetic pole,
        // where azStable fades the striation contrast to flat glow (the ring gaussian
        // still leaks ~exp(-2) at the pole, so the degenerate region IS visible and
        // must degrade gracefully). The uAuroraIntensity > 0.0 guard skips the whole

        vec3 auroraC = vec3(0.0);
        if (uAuroraIntensity > 0.0){
          float mlat = dot(N, uMagAxis);                       // -1..1 magnetic latitude
          float t = (abs(mlat) - uAuroraRingLat) / max(uAuroraRingWidth, 1e-3);
          float ringMask = exp(-t * t);
          // night mask — same -0.1..0.1 twilight band as the stand-in, but with the
          // edges in spec order (smoothstep with edge0 > edge1 is undefined GLSL).
          float nightMask = 1.0 - smoothstep(-0.1, 0.1, diff); // visible in darkness/twilight
          // magnetic-frame azimuth direction: tangent basis about uMagAxis. The cross
          // with +z is safe — uMagAxis keeps y ~cos(11 deg) ~0.98, never parallel to z.
          vec3 mE1 = normalize(cross(uMagAxis, vec3(0.0, 0.0, 1.0)));
          vec3 mE2 = cross(uMagAxis, mE1);
          vec2 mxz = vec2(dot(N, mE1), dot(N, mE2));
          float mr = length(mxz);
          vec2 mDir = mxz / max(mr, 1e-4);                     // unit azimuth dir (floored: no 0/0)
          float azStable = smoothstep(0.0, 0.1, mr);           // fade striations where azimuth degenerates
          // 2-octave curtain (the Planet.js applyAurora structure on the lab's
          // analytic noised()): azimuth freq 8/16 vs latitude freq 1.5/2.5 —
          // anisotropy is the striation. Time drifts the LATITUDE slot (curtains
          // rise); bounded/periodic-free accumulation is fine (weather-layer class).
          float curtain = noised(vec3(mDir * 8.0,  mlat * 1.5 + uTime * 0.12)).x * 0.5 + 0.5;
          curtain += (noised(vec3(mDir * 16.0, mlat * 2.5 + uTime * 0.2)).x * 0.5 + 0.5) * 0.25;
          float cb = max(curtain, 0.0) * 0.8;                  // normalize the 1.25 2-octave max
          float rays = mix(0.4, cb * cb, azStable);            // square via multiply (no pow); flat at the pole
          // slow flicker — a LOW-frequency azimuth domain on a slow clock multiplies
          // brightness 0.5..1.0: the rays shimmer while the oval geometry stays put.
          float flicker = clamp(0.75 + 0.25 * noised(vec3(mDir * 2.0, uTime * 0.05)).x, 0.0, 1.0);
          float aurora = ringMask * nightMask * rays * flicker * uAuroraIntensity
                       * provinceWeight(PROV_AURORA);
          // gain 0.8 (stand-in 0.6): the flicker mean 0.75 would otherwise dim the
          // default read below the stand-in's — 0.6/0.75 = 0.8 preserves mean energy.
          auroraC = uAuroraColor * aurora * 0.8;
        }

        // ★ Airglow (F38) — thin UNIFORM night-limb photochemical shell (P24 non-
        // magnetic half; aurora's sibling). NOT a polar oval (F37), NOT a broad
        // scattering halo (F34), NOT a hemisphere fill (F33): a thin DEFINED green
        // ring pinned exactly at the grazing-angle limb on the dark hemisphere, at
        // ALL latitudes. Two masks on the emissive-bypass channel (never posterized):
        //   • night mask — the LIVE aurora form 1.0 - smoothstep(-0.1,0.1,diff)
        //     (edge0 < edge1; the reversed card-prose form is spec-undefined GLSL).
        //   • limb mask — fresnel/grazing term grazing = 1 - |dot(N,V)| (~0 face-on,
        //     →1 at the silhouette), raised to K and passed through a SHARP smoothstep
        //     window (E0→E1 high on the grazing curve) so the band is a thin crisp ring
        //     with defined inner/outer edges — the stylization directive (tracker:127-130)
        //     to BEAT the 6-level envelope: a discrete band, not a smooth low-contrast
        //     fade (the fade is exactly what posterize+Bayer crushes). Color is the hard
        //     airglow-green constant (OI 557.7 nm), uniform — NO composition lookup. The
        //     uAirglowIntensity > 0.0 guard skips the whole block: enable off (writer
        //     zeroes it) and airless worlds (atmoFactor 0) both yield airglowC = vec3(0)
        //     EXACTLY — the F38 regression contract.
        vec3 airglowC = vec3(0.0);
        if (uAirglowIntensity > 0.0){
          float nightMask = 1.0 - smoothstep(-0.1, 0.1, diff);          // night/twilight gate (LIVE aurora form)
          float grazing   = 1.0 - abs(dot(N, V));                        // 0 face-on → 1 at the limb (geometric normal, like F34)
          float limb      = smoothstep(0.55, 0.78, pow(grazing, 2.0));   // SHARP window high on the grazing curve → thin DEFINED ring (K=2.0, E0=0.55, E1=0.78)
          airglowC = uAirglowColor * (limb * nightMask * uAirglowIntensity) * provinceWeight(PROV_AIRGLOW);
        }

        // ★ Cloud optics (F39) — antisolar BACKSCATTER GLORY: discrete colored concentric
        // rings on the LIT cloud deck, centered where the camera looks back along the sun
        // line (dot(V, uLightDir) → 1 at the antisolar point). The exact OPPOSITE gate of
        // airglow: a LIT-cloud-top effect (dayside), not a night-limb shell. Three
        // deliberate stylizations vs the real sub-degree spectral glory (card §1):
        //   • the ring radius uGloryRadius is inflated far past the real angle so the bands
        //     read at planet distance;
        //   • the palette is a flat constant warm-outer→cool-inner (red → green → violet),
        //     NO composition lookup (mirrors airglow's flat green);
        //   • 2–3 HARD posterized colour steps (floor-quantized theta/uGloryRadius) — leans
        //     INTO discreteness so the bands survive the 6-level envelope as INTENTIONAL
        //     steps. Emissive-bypass channel ⇒ never double-quantized by Bayer.
        // Reuses the live V (view-to-camera, L3302), diff (max(dot(shadeN,uLightDir),0), L3298)
        // and uLightDir — no redeclaration. The uCloudOpticsIntensity > 0.0 && uCloudCoverage
        // > 0.0 guard skips the whole block: enable off (writer zeroes intensity) and any
        // cloudless world (master gate 0) both yield cloudOpticsC = vec3(0) EXACTLY — the
        // F39 regression contract.
        vec3 cloudOpticsC = vec3(0.0);
        if (uCloudOpticsIntensity > 0.0 && uCloudCoverage > 0.0){
          float theta = acos(clamp(dot(V, uLightDir), -1.0, 1.0));     // 0 at antisolar point, grows outward
          float lit   = smoothstep(0.0, 0.1, diff);                    // dayside gate (OPPOSITE of airglow's night mask)
          float radius = max(uGloryRadius, 1e-3);                      // floor the denominator — no 0/0
          float ringMask = step(theta, radius);                       // 1 inside the ring stack, 0 beyond uGloryRadius
          float band = floor(clamp(theta / radius, 0.0, 0.999) * 3.0); // 3 HARD steps: 0 (inner) / 1 (mid) / 2 (outer)
          // flat constant palette, warm-outer → cool-inner (NO composition lookup)
          vec3 gloryInner = vec3(0.35, 0.45, 1.00);   // blue-violet inner
          vec3 gloryMid   = vec3(0.35, 1.00, 0.45);   // green mid
          vec3 gloryOuter = vec3(1.00, 0.45, 0.35);   // reddish outer
          vec3 gloryCol = band < 0.5 ? gloryInner : (band < 1.5 ? gloryMid : gloryOuter);
          cloudOpticsC = gloryCol * (ringMask * lit * uCloudOpticsIntensity) * provinceWeight(PROV_CLOUDOPTICS);
        }

        gl_FragColor = vec4(min(surface + emissive + specC + limbC + termC + cloudC + auroraC + airglowC + cloudOpticsC + bioC + machC + cityC + ecuC, vec3(1.0)), 1.0);
      }
    `;

    const uniforms = makeUniforms(WORLD_LIGHT);

    // ── AC4 river carve uniforms. samplerCube must always be bound, so seed with a 1×1 black
    // (depth 0 = no carve) dummy cube until the overlay renders the real one. Strength/floor 0 by
    // default ⇒ the carve is a no-op (planet renders byte-identically) until the overlay turns it on.
    function makeDummyCubeTexture(){
      const faces = [];
      for (let i = 0; i < 6; i++){
        const c = document.createElement('canvas'); c.width = c.height = 1;
        const cx = c.getContext('2d'); cx.fillStyle = '#000'; cx.fillRect(0, 0, 1, 1);
        faces.push(c);
      }
      const ct = new THREE.CubeTexture(faces); ct.needsUpdate = true; return ct;
    }
    // sampler2D dummy for the river-LOD patch (Option B STEP 2). MUST be a 2D DataTexture (NOT a
    // CubeTexture) — a samplerCube dummy would be an invalid bind for sampler2D uRiverCarvePatchMap.
    // 1×1 black ⇒ depth 0; with uRiverCarvePatchStrength=0 it's never sampled anyway (regression-safe).
    function makeDummyTex2D(){
      const t = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1, THREE.RGBAFormat);
      t.needsUpdate = true; return t;
    }
    const _dummyCarveCube = makeDummyCubeTexture();
    const _dummyPatchTex = makeDummyTex2D();
    uniforms.uRiverCarveMap      = { value: _dummyCarveCube };
    // ── WS4 T5 (D6 belt-and-braces): a samplerCube must ALWAYS be bound, so seed uTectonicGrainCube
    // with the SAME 1×1 black dummy until the grain bake (T7/T8) renders the real strike cube. The
    // grained combiners BRANCH on uTectonicGrainStrength (default 0) so this dummy is NEVER sampled at
    // the byte-identical fallback — it exists only so the bind is valid (an unbound/null samplerCube
    // can warn/UB on some drivers and would perturb the strength-0 A/B capture this AC rests on).
    uniforms.uTectonicGrainCube  = { value: makeDummyCubeTexture() };
    // ── AC2 baked relief — same D6 belt-and-braces: a samplerCube must ALWAYS be bound, so seed
    // uReliefBakeCube with a 1×1 black dummy until route() bakes the real height cube. The height
    // source BRANCHES on uReliefBakeStrength (default 0) so this dummy is NEVER sampled at the
    // byte-identical fallback — it exists only so the bind is valid (a null samplerCube can warn/UB).
    const _dummyReliefCube = makeDummyCubeTexture();
    uniforms.uReliefBakeCube     = { value: _dummyReliefCube };
    uniforms.uReliefBakeStrength = { value: 0.0 };   // default 0 ⇒ byte-identical (prod uniforms.js default also stays 0)
    uniforms.uRiverCarveStrength = { value: 0.0 };
    uniforms.uRiverCarveFloor    = { value: 0.0 };
    uniforms.uRiverCarveDepth    = { value: 0.0 };   // Option B: h-units the floor is lowered (→ F14 floods)
    uniforms.uRiverCarveRough    = { value: 0.0 };   // fbm roughness on depth+walls (breaks the clean V/waterline)
    uniforms.uRiverCarveGateHi   = { value: 0.18 };  // relief gate (UAT item3): carve fades out above this elevation-over-sea
    // Option B river-LOD STEP 2 — camera-localised tributary patch uniforms (default OFF = no-op).
    uniforms.uRiverCarvePatchMap      = { value: _dummyPatchTex };
    uniforms.uRiverCarvePatchN        = { value: new THREE.Vector3(0, 0, 1) };  // patch centre/normal
    uniforms.uRiverCarvePatchU        = { value: new THREE.Vector3(1, 0, 0) };  // local-frame tangent (su)
    uniforms.uRiverCarvePatchV        = { value: new THREE.Vector3(0, 1, 0) };  // local-frame tangent (sv)
    uniforms.uRiverCarvePatchAngular  = { value: 0.14 };  // ~8° half-angle cap
    uniforms.uRiverCarvePatchStrength = { value: 0.0 };   // 0 ⇒ patch off (regression-safe default)

    const geometry = new THREE.SphereGeometry(R, 256, 256);  // 256 for surface-skimming silhouette
    // ── #3a E5 gas-giant band/jet writer attributes (default 0 = flat; refilled by rebakeE5Bands()
    // on gas presets). Solid presets never read them (uBandStrength gate ⇒ zonalBandCol dead). ──
    {
      const _vc = geometry.attributes.position.count;
      geometry.setAttribute('aBand',  new THREE.BufferAttribute(new Float32Array(_vc), 1));
      geometry.setAttribute('aShear', new THREE.BufferAttribute(new Float32Array(_vc), 1));
      geometry.setAttribute('aMush',  new THREE.BufferAttribute(new Float32Array(_vc), 1));
    }
    const material = new THREE.ShaderMaterial({ vertexShader, fragmentShader, uniforms });
    const planet = new THREE.Mesh(geometry, material);
    scene.add(planet);

    // ── AC4 — dendritic river ribbon overlay (planet-lod-rivers.js, the shared router/ribbon
    // pipeline proven in the router lab). Lazily builds its irregular spherical-Delaunay mesh on
    // first enable, then reads the lab's LIVE height field via FloatType RTT (octaves pinned high,
    // the SHARED AC1 height GLSL) → priority-flood/D-inf routing → Horton–Strahler → variable-width
    // ribbon. Parented to `planet` (never scaled/moved) so it co-rotates with the spin; hidden
    // until the Rivers & valleys toggle turns it on (state.riversEnabled — the shared rivers
    // enableKey). riverOverlayState + the control fns live below the GUI;
    // re-route hooks hang off applyDrivers (debounced) so rivers track the current preset/dials.
    const riverOverlay = createRiverOverlay({ renderer, uniforms, octavesDuringRead: 9 });
    riverOverlay.ribbon.visible = false;
    planet.add(riverOverlay.ribbon);
    // Option B river-LOD STEP 2 — camera-localised fine-tributary patch. Reads the REAL GPU height at
    // a fine tangent-plane lattice (octaves 12 > the router's 9), grows the dendritic network onto the
    // in-patch trunk outlets, and bakes valley depth into a 2D ortho RTT unioned into sampleCarve.
    // On-demand (static camera); bake via the GUI button / window._lab.bakeTributaryPatch().
    const tributaryPatch = createTributaryPatch({ renderer, uniforms, octaves: 12 });
    // §2 Fork C — the fine-ribbon mesh (the LOD legibility channel), parented to `planet` like the
    // trunk ribbon so it co-rotates. Hidden until a bake raises patchStrength > 0 (managed below).
    planet.add(tributaryPatch.fineRibbon);
    // enabled mirrors state.riversEnabled (the registry enableKey) for the internal route/carve
    // guards; setRiverOverlay keeps the two in sync. (No _f11Saved — the old F11-off coupling is gone.)
    const riverOverlayState = { enabled: false, seaFromHistogram: true, targetOceanFraction: 0.35,
      carve: true, carveStrength: 0.01, carveFloor: 1.3, carveDepthH: 0.08, carveRough: 0.5,
      carveGateHi: 0.18,
      patchStrength: 0.0, patchAngularDeg: 8,   // Option B river-LOD STEP 2: fine-tributary patch (default off)
      patchChannelMinOrder: 4,   // §8.10 — fine-channel RENDER threshold (Strahler ≥ this). 2 ≈ smear at target
                                 // gridRes; ~4 reads as legible dendrites. Tunable live via the GUI slider.
      // §2 Fork A un-occlude — the ribbon meshes are baked at DEFAULT_PARAMS.LIFT (0.999, BELOW the
      // r=1.0 surface, so the depth-writing surface hides them). Because relief is shaded-not-displaced,
      // there is no geometric channel to seat the ribbon in: a uniform mesh scale just above (1/0.999)
      // lifts it ABOVE the surface so depthTest (kept TRUE) shows the near hemisphere and still occludes
      // the far one. Tunable live (occlude↔float) because the right amount is a UAT judgment; 0.999 was
      // chosen to avoid the old 1.0035 "floating" look, and on this fine 256² sphere a tiny lift clears
      // occlusion with near-imperceptible float. Portable: the game-port applies the same radial offset
      // relative to its own (also non-displaced) surface radius.
      ribbonLift: 1.0014,
      status: '(off)' };

    // Lift both parented ribbon meshes just above the surface via a uniform radial scale about the
    // planet centre (no geometry rebake; the carve bake keeps DEFAULT_PARAMS.LIFT=0.999 untouched).
    // Called on init and from the GUI slider.
    function applyRibbonLift(){
      const s = riverOverlayState.ribbonLift;
      riverOverlay.ribbon.scale.setScalar(s);
      tributaryPatch.fineRibbon.scale.setScalar(s);
    }
    applyRibbonLift();

    // ─────────────────────────────────────────────────────────────────────────
    // F34 / F31e — detached haze shell: a slightly enlarged BACK-FACE sphere
    // drawn additively behind the planet (the Crying Suns second-pass approach,
    // card §4 ladder rung 2). The opaque planet depth-occludes the shell's inner
    // disc, leaving only the 1.0R..1.15R annulus — a halo that extends PAST the
    // solid silhouette, which the single-sphere Stage-9 rim cannot do. The
    // fragment shader quantizes its own fresnel into 1-2 concentric arcs (the
    // Titan detached-haze layer cake); intensity = state.limbHazeShell, derived
    // > 0 ONLY on the thick-haze class (Titan / Venus / Sub-Neptune) — every
    // other preset keeps the mesh invisible (the F34 regression contract; the
    // per-frame writer also hides it whenever limbEnabled is off). World-space:
    // the halo is rotation-independent, so it is NOT parented to the spinning
    // planet; sun-weighting reads the static WORLD_LIGHT directly.
    // ─────────────────────────────────────────────────────────────────────────
    const hazeShellUniforms = {
      uShellColor:     { value: new THREE.Color(1.0, 0.55, 0.22) },   // synced to state.limbColor per frame
      uShellIntensity: { value: 0.0 },                                // state.limbHazeShell (0 default = invisible)
      uShellLight:     { value: new THREE.Vector3().copy(WORLD_LIGHT) },
    };
    const hazeShellMat = new THREE.ShaderMaterial({
      uniforms: hazeShellUniforms,
      vertexShader: /* glsl */ `
        varying vec3 vNormalW;
        varying vec3 vWorldPos;
        void main(){
          vNormalW = normalize(mat3(modelMatrix) * normal);
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: /* glsl */ `
        uniform vec3  uShellColor;
        uniform float uShellIntensity;
        uniform vec3  uShellLight;
        varying vec3 vNormalW;
        varying vec3 vWorldPos;
        void main(){
          vec3 N = normalize(vNormalW);
          vec3 V = normalize(cameraPosition - vWorldPos);
          // Back faces only: dot(N, V) runs from 0 at the shell's own silhouette
          // down to ~-0.49 at the planet-occluded inner edge (cos asin(1/1.15)),
          // so -dot * 2.0 remaps the visible annulus to ~0..1; t=1 hugs the
          // solid limb, t=0 is the outer shell edge. No pow() anywhere.
          float t = clamp(-dot(N, V) * 2.0, 0.0, 1.0);
          // 1-2 concentric DETACHED arcs (the F31e Titan layers). Review M1:
          // a zero band must sit adjacent to the limb so the arcs read as
          // detached rings, not a thickened rim. From limb outward:
          // gap (t>0.85) - bright arc - gap - dim arc - fade at outer edge.
          float tq = (step(0.55, t) - step(0.85, t))
                   + 0.5 * (step(0.10, t) - step(0.35, t));
          // Sun-weighting mirrors the Stage-9 rim's (diff + 0.15) convention.
          float w = clamp(dot(N, uShellLight), 0.0, 1.0) * 0.85 + 0.15;
          gl_FragColor = vec4(uShellColor * tq * w * uShellIntensity, 1.0);
        }
      `,
      side: THREE.BackSide,
      transparent: true,          // sorts AFTER the opaque planet (depth-occlusion of the inner disc)
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });
    const hazeShell = new THREE.Mesh(new THREE.SphereGeometry(R * 1.15, 96, 96), hazeShellMat);
    hazeShell.visible = false;    // per-frame writer shows it ONLY when limbEnabled && limbStrength > 0 && limbHazeShell > 0
    scene.add(hazeShell);

    // ─────────────────────────────────────────────────────────────────────────
    // F51 RINGS — a SECOND mesh in the same scene (hazeShell precedent above).
    //
    // Builds the production _createRing() envelope (Planet.js:1105-1235) — RingGeometry
    // in the equatorial plane, planet-shadow cylinder test, Bayer dither-discard alpha,
    // 6-level posterize — but SWAPS the fake-sine band body for the dead RingRenderer.js
    // physics-driven ringlet/gap loop (RingRenderer.js:208-235), fed CPU-side by
    // generateRingPhysics() with a synthetic params bundle (one inner moon → outer-edge
    // clip + a 2:1 Cassini-class gap). Adds the ONE new term §4 wants: an fwidth(t)
    // band-limit clamp so fine ringlets fade to their mean at grazing angles instead of
    // moiréing against the 4×4 Bayer grid. All identifiers prefixed uRing*/ring* — NO
    // GLSL reserved words (esp. NOT `partition`, the acute trap for ring code).
    // ─────────────────────────────────────────────────────────────────────────
    const RING_MAX_RINGLETS = 16;
    const RING_MAX_GAPS = 8;
    const RING_COMPOSITION_COLORS = {   // RingRenderer.js:28-33
      ice:   [0.85, 0.92, 0.98],
      rock:  [0.35, 0.32, 0.30],
      dust:  [0.55, 0.45, 0.35],
      mixed: [0.60, 0.58, 0.55],
    };

    // Synthetic params bundle (§6.5 host-preset step): origin 'roche', a density pair,
    // an ageGyr, and ONE synthetic inner moon (orbit = 9 planet radii) that both clips
    // the outer edge and carves a 2:1 resonance gap inside the annulus. planetRadiusEarth=1
    // so the physics' radii-in-planet-radii equal lab object-space units (lab R = 1.0).
    function makeRingPhysics() {
      return generateRingPhysics({
        origin: 'roche',
        planetDensity: 5500,
        planetRadiusEarth: 1,
        ageGyr: 0.3,                     // young → dense disk (ageFactor near 1)
        axialTilt: 0,
        // Inner moon at 9 R_p: clips outer edge to ~8.2 R_p AND lands a 2:1 (Cassini-class,
        // dominant) gap at ~5.7 R_p plus a finer 3:1 gap at ~4.3 R_p INSIDE the annulus →
        // generateRingPhysics partitions the disk into 3 discrete ringlets (UAT: 3-5 bands +
        // one dominant gap). (Icy Roche limit ~4.15 R_p pushes the disk out, so the moon must
        // sit far enough that its resonances fall above that inner edge.)
        moons: [{ orbitRadiusEarth: 9.0, radiusEarth: 1 }],
        rngFloat1: 0.3, rngFloat2: 0.5, rngFloat3: 0.6, rngFloat4: 0.2, rngFloat5: 0.5,
      });
    }
    const ringPhysics = makeRingPhysics();

    // Flatten ringlets[]/gaps[] into the Float32Array layout RingRenderer builds
    // (RingRenderer.js:69-101). Lab R = 1.0, so multiply by R (= identity) for clarity.
    const ringletInnerR  = new Float32Array(RING_MAX_RINGLETS);
    const ringletOuterR  = new Float32Array(RING_MAX_RINGLETS);
    const ringletOpacity = new Float32Array(RING_MAX_RINGLETS);
    const ringletColors  = new Float32Array(RING_MAX_RINGLETS * 3);
    let ringletCount = 0;
    for (let i = 0; i < ringPhysics.ringlets.length && ringletCount < RING_MAX_RINGLETS; i++) {
      const rl = ringPhysics.ringlets[i];
      if (rl.outerR - rl.innerR < 0.001) continue;
      const j = ringletCount;
      ringletInnerR[j]  = R * rl.innerR;
      ringletOuterR[j]  = R * rl.outerR;
      // PRESENTATIONAL OPACITY LIFT + ALTERNATING CONTRAST (UAT item 2): physics opacities
      // (~0.45/0.52/0.58) sit close together × density ~0.64 → effective ~0.29-0.37, which
      // reads as a smooth radial gradient rather than discrete ringlets after the 6-level
      // posterize. We (a) lift the base so the dense bands read solidly, and (b) push adjacent
      // ringlets apart in density (odd brighter / even dimmer) so the band BOUNDARIES register
      // as discrete light/dark steps. Physics ORDERING is preserved (this only amplifies).
      const baseOp = rl.opacity * (ringPhysics.density ?? 1.0);
      const altContrast = (j % 2 === 0) ? 1.15 : 0.78;   // discrete light/dark banding
      ringletOpacity[j] = Math.min(1.0, baseOp * 1.6 * altContrast);
      const c = RING_COMPOSITION_COLORS[rl.composition] || RING_COMPOSITION_COLORS.mixed;
      ringletColors[j*3] = c[0]; ringletColors[j*3+1] = c[1]; ringletColors[j*3+2] = c[2];
      ringletCount++;
    }
    const ringGapCenters = new Float32Array(RING_MAX_GAPS);
    const ringGapWidths  = new Float32Array(RING_MAX_GAPS);
    let ringGapCount = 0;
    // PRESENTATIONAL GAP-WIDTH BOOST (UAT item 3): the physics gap widths (~0.035 R_p
    // for the dominant 2:1, ~0.02 for the finer 3:1) are physically faithful but
    // sub-Bayer-cell at this stylized scale, so the dominant Cassini-analog clearing
    // never registers against the 4×4 dither. We widen the clearings for read WITHOUT
    // touching the upstream physics: the WIDEST physics gap is the dominant one (2:1
    // resonance carves the most), so it gets the larger boost → ONE commanding gap,
    // thinner ones stay subordinate. Half-falloff in R_p; visible clearing ≈ 2×.
    const ringGapsSorted = ringPhysics.gaps
      .map((g, idx) => ({ ...g, idx }))
      .sort((a, b) => b.width - a.width);   // widest (dominant) first
    for (let k = 0; k < ringGapsSorted.length && ringGapCount < RING_MAX_GAPS; k++) {
      const g = ringGapsSorted[k];
      ringGapCenters[ringGapCount] = R * g.radius;
      // Dominant gap (k===0) → ~0.34 R_p half-width (commanding Cassini clearing);
      // subordinate gaps → ~0.12 R_p (crisp but clearly thinner, appear up close).
      const boostHalfWidth = (k === 0) ? 0.34 : 0.12;
      ringGapWidths[ringGapCount] = R * boostHalfWidth;
      ringGapCount++;
    }

    const ringInnerR = R * ringPhysics.innerRadius;
    const ringOuterR = R * ringPhysics.outerRadius;

    const ringUniforms = {
      ringColor1:   { value: new THREE.Vector3(...ringPhysics.color1) },
      ringColor2:   { value: new THREE.Vector3(...ringPhysics.color2) },
      ringOpacity:  { value: 1.0 },
      innerRadius:  { value: ringInnerR },
      outerRadius:  { value: ringOuterR },
      lightDir:     { value: new THREE.Vector3().copy(WORLD_LIGHT) },   // object-space, written per-frame
      planetRadius: { value: R },
      uRingletCount:   { value: ringletCount },
      uRingletInnerR:  { value: ringletInnerR },
      uRingletOuterR:  { value: ringletOuterR },
      uRingletOpacity: { value: ringletOpacity },
      uRingletColors:  { value: ringletColors },
      uGapCount:    { value: ringGapCount },
      uGapCenters:  { value: ringGapCenters },
      uGapWidths:   { value: ringGapWidths },
      uRingMeanDensity: { value: ringPhysics.density ?? 0.5 },   // disk-wide baseline for the fwidth band-limit fade
    };

    const ringMat = new THREE.ShaderMaterial({
      side: THREE.DoubleSide,
      transparent: true,
      depthWrite: false,
      uniforms: ringUniforms,
      vertexShader: /* glsl */ `
        #include <common>
        #include <logdepthbuf_pars_vertex>
        varying vec3 vPos;
        varying vec3 vRelWorldPos;
        void main() {

    // ── Per-layer terrain seeds ──────────────────────────────────────────────
    // A seed maps to a constant 3D offset into the infinite noise field; sampling
    // a different region = different terrain. macro seed shifts octaves 0..2 (the
    // continents), detail seed shifts octaves 3+ (surface texture). Constant
    // offsets don't disturb the analytic gradient, so normals/lighting are safe.
    function seedOffset(seed, out){
      const h = (n) => { const x = Math.sin(n) * 43758.5453; return (x - Math.floor(x)) * 256.0; };
      return out.set(h(seed*12.9898 + 78.233), h(seed*39.346 + 11.135), h(seed*53.711 + 94.673));
    }
    let _seedUniformsInited = false;
    function updateSeedUniforms(){
      seedOffset(state.macroSeed,  uniforms.uMacroOffset.value);
      seedOffset(state.detailSeed, uniforms.uDetailOffset.value);
      // AC3: a seed change (macro/detail reroll, "New planet", scenario restore) is a planet change,
      // so re-route the dendritic network always (debounced; routes even when the ribbon is hidden).
      // Skipped on the first call — startup routing is handled by the deferred initial route below,
      // which also waits for first paint so the one-time mesh build doesn't block it.
      if (_seedUniformsInited && typeof riverRerouteDebounced === 'function') riverRerouteDebounced();
      _seedUniformsInited = true;
    }
    updateSeedUniforms();

    // ── 🎲 randomize helpers (GUI-side, Math.random — NOT seeded; the rolls are
    // transient, discarded on preset/qualityTier change via applyDrivers). Shapes
    // mirror core.js seededUnitVec3() / seedOffset() so a roll lands in the same
    // ranges the driven values do (unit sphere; per-component 0..256 noise offset). ──
    function randUnitVec3(){
      const z = Math.random() * 2.0 - 1.0;
      const phi = Math.random() * Math.PI * 2.0;
      const r = Math.sqrt(Math.max(0.0, 1.0 - z * z));
      return [r * Math.cos(phi), r * Math.sin(phi), z];
    }
    function randOffset(){ return [Math.random() * 256.0, Math.random() * 256.0, Math.random() * 256.0]; }

      obscure:  ['dustEnabled','dunesEnabled','lavaEnabled','chaosEnabled','cryoRidgeEnabled','frostEnabled','subEnabled','glacialEnabled','karstEnabled','massWastEnabled'],

        _preIsolate = { enables: captureEnables(), relief: grainCarveUI.reliefBakeStrength };

    // ── Sun direction (world-space), runtime-adjustable ──────────────────────────
    // Rewrites the WORLD_LIGHT constant (mutated in place) from state.lightAzimuth/Elevation,
    // and refreshes the one-time uShellLight copy. The planet surface (uLightDir) and the rings
    // read WORLD_LIGHT per-frame so they follow automatically; uShellLight is an init-only copy,
    // so it must be refreshed here. Convention matches camera yaw/pitch (az +z→+x, el above xz).
    function applyLightDir(){
      const az = THREE.MathUtils.degToRad(state.lightAzimuthDeg);
      const el = THREE.MathUtils.degToRad(state.lightElevationDeg);
      const ce = Math.cos(el);
      WORLD_LIGHT.set(ce * Math.sin(az), Math.sin(el), ce * Math.cos(az)).normalize();

    }

    const TERM_COLOR_BY_PRESET = {

      'Venus (sulfuric shroud)':    [1.00, 0.62, 0.28],   // broad orange arc (Akatsuki crescent)
      'Gas giant (Jovian)':         [1.00, 0.58, 0.30],   // warm NH3-deck amber

    // visible/opt-in: the histogram sea override (gated to enabled, below, in riverReroute) and the
    // terrain-carve gouging amounts (gated to enabled && carve, in applyCarveAmounts). So AC3 on its
    // own produces no visible change — nothing samples G/B yet, and depth-carve stays off by default.
    function ensureNetworkRouted(label){
      const _preset = driverUI.preset;
      const _fp = DRIVER_PRESETS[_preset];
      // Increment 2 (plate driver-response): build the bodyDrivers bundle from the live derived
      // uniforms (state._derived, set by applyDrivers; fall back to a fresh derive if route runs
      // before the first applyDrivers) + the raw preset, honoring the override sliders / A/B mode.
      // bodyDrivers is the SEPARATE driver-response channel; grainDrivers (the grain bake) stays at
      // its DEFAULT_GRAIN_DRIVERS neutral bundle (untouched). Off the plate path the writer ignores it.
      const _u = state._derived || deriveUniforms(_fp, driverUI.qualityTier);
      const _bodyDrivers = buildBodyDrivers(_u, _fp);
      state._lastBodyDrivers = _bodyDrivers;   // surfaced by _lab.plateProbe() (the values that reached the writer)
      // V2-1 Slice D (SHADOW): compute the E1 regime tuple from the SAME condition vector + macroSeed and
      // stash it for _lab.e1Probe() (AC7). DATA-ONLY — state._lastE1 is NEVER threaded into route() below
      // (archetype stays PRESET_ARCHETYPE), so E1 has ZERO routing influence this increment. The lab-only
      // weight override (_e1WeightOverride, console/_lab-set) rides in via opts.weights; default ⇒ frozen.
      state._lastE1 = computeE1(_bodyDrivers.condition, state.macroSeed, _e1WeightOverride ? { weights: _e1WeightOverride } : {});
      const res = riverOverlay.route({
        label: label || 'route',
        seaMode: riverOverlayState.seaFromHistogram ? 'histogram' : 'live',
        targetFraction: riverOverlayState.targetOceanFraction,
        radiusEarth: state.planetRadiusEarth,   // AC6: width/footprint scales with planet radius
        widthSeed: state.macroSeed,             // UAT item1: per-planet seeded width-scale draw
        macroSeed: state.macroSeed,             // WS4 T8/D9: grain co-orients with the gProvince partition (same seed feeds uMacroOffset)
        // plate-uplift increment (AC5): the regime discriminator. Earth-like terrestrial/ocean bodies
        // get the one-pass plate/uplift field; every other regime keeps the despun E6 path byte-identical.
        archetype: PRESET_ARCHETYPE[_preset] || null,
        locked: !!(_fp && _fp.tidalState && _fp.tidalState.locked),
        // magmatism increment (AC9/§5): the substellar temperature source. writeBodyRelief derives
        // T_ss = locked ? T_eq*1.4 : 0 (the shipped F41 convention, :3617) and gates the magma-ocean
        // basin on T_ss > 1300 K — a WIDE sea for Magma (T_eq 2000 → T_ss 2800) vs a small pond for
        // Lava (T_eq 950 → T_ss 1330). Inert off the volcanic path (only 'lava'/'volcanic' read it).
        T_eq: (_fp && _fp.T_eq != null) ? _fp.T_eq : 288,
        bodyDrivers: _bodyDrivers,              // Increment 2: the D-vector → driversToTune() → plate tune override
      });
      const stats = res.stats;
      // Always point the planet shader at the freshly-rendered carve cube (the REAL texture, never
      // the dummy) so AC4–6 combiners can sample its G/B channels. The dummy stands in ONLY before
      // the first route completes (the deferred initial route, below).
      uniforms.uRiverCarveMap.value = riverOverlay.carveTexture || _dummyCarveCube;
      // WS4 T8: point the planet shader at the freshly-baked grain cube (the REAL strike field). The
      // dummy 1×1 cube (set at init) stands in ONLY before the first route; once route() bakes, the
      // grained combiners (T5 scarp / T13 rest) sample the shared field. Strength still defaults 0, so
      // nothing changes visibly until uTectonicGrainStrength>0 — the branch guard keeps strength-0 byte-identical.
      uniforms.uTectonicGrainCube.value = riverOverlay.grainTexture || uniforms.uTectonicGrainCube.value;
      // AC2: point the planet shader at the freshly-baked relief height cube (Phase B exposes
      // riverOverlay.reliefTexture). Falls back to the dummy until the first bake. Strength still
      // gates the fetch (default 0), so nothing changes visibly until uReliefBakeStrength>0.
      uniforms.uReliefBakeCube.value = riverOverlay.reliefTexture || _dummyReliefCube;
      uniforms.uRiverCarveGateHi.value = riverOverlayState.carveGateHi;
      applyCarveAmounts();                 // (re)apply the enabled && carve-gated gouging amounts
      riverOverlayState.status = `ocean ${stats.oceanPct}% · ord ${stats.maxStrahler} · R_b ${stats.bifurcationRatio} · w×${stats.widthRadiusFactor}r/${stats.widthSeedFactor}s · ${stats.totalMs}ms`;
      syncDisplays();
      return res;                          // { stats, seaLevel }
    }
    // Option B river-LOD STEP 2 — bake the fine-tributary patch at the CURRENT camera direction.
    // center = object-space camera dir (the lightObj pattern: invQuat · normalize(camera.position)).
    // The patch reads the in-patch trunk channels from the retained router graph (riverOverlay.routed)
    // and the base mesh verts; growTributaries needs base verts + per-node isChannel/strahler, which
    // the mesh carries (verts) and the routed graph carries (isChannel/strahler) — merged below.
    // Static, on-demand: re-bake-on-move / windowing are deferred (spec §9). Sets patch uniforms;
    // the master uRiverCarvePatchStrength is applied from the GUI value (0 ⇒ regression-safe).
    // §3.2 — derive the fine lattice density from the target tributary feature size + the SEED-DERIVED
    // planet radius, at a CANONICAL reference cap (not the live cap). gridRes is fixed per feature per
    // planet size (recomputed only when the radius/s_feat change — it reads state.planetRadiusEarth
    // live, so a radius reroll auto-updates it); the live patchAngularDeg carries the zoom response (a
    // tighter cap ⇒ finer km/cell for free at the SAME gridRes, per §3.1c). Clamped [56, 560]: floor at
    // the legacy density, cap at the perf budget (Nf ≈ π·gridRes²/4 ≈ 158k verts at 448 → sub-second
    // one-shot bake now that the snap is O(1)).
    const RIVER_LOD_REF_CAP_DEG = 8.0;   // canonical design cap the density is fixed at
    const RIVER_LOD_S_FEAT_KM   = 4.0;   // target tributary-valley feature size (≥2 cells/valley)
    function deriveTributaryGridRes(){
      const Rplanet_km = state.planetRadiusEarth * 6371;
      const refAlpha   = THREE.MathUtils.degToRad(RIVER_LOD_REF_CAP_DEG);
      const capDiam_km = 2 * Math.sin(refAlpha) * Rplanet_km;
      return Math.max(56, Math.min(560, Math.ceil(capDiam_km / RIVER_LOD_S_FEAT_KM)));
    }
    function bakeTributaryPatch(){
      let routed = riverOverlay.routed;
      if (!routed){ ensureNetworkRouted('patch-prep'); routed = riverOverlay.routed; }
      const baseMesh = riverOverlay.mesh;
      if (!routed || !baseMesh){ console.warn('[patch] no routed graph / mesh yet'); return null; }
      const invQ = new THREE.Quaternion().copy(planet.quaternion).invert();
      const c = camera.position.clone().normalize().applyQuaternion(invQ);  // object-space cam dir
      const angularRadius = THREE.MathUtils.degToRad(riverOverlayState.patchAngularDeg);
      const gridRes = deriveTributaryGridRes();
      const info = tributaryPatch.bake({
        routed,
        baseMesh: { verts: baseMesh.verts, N: baseMesh.N, isChannel: routed.isChannel, strahler: routed.strahler },
        center: [c.x, c.y, c.z],
        angularRadius,
        seed: state.macroSeed,
        params: { gridRes, radiusEarth: state.planetRadiusEarth,   // radius scales the fine-ribbon width law (Fork B)
                  channelOrderMin: riverOverlayState.patchChannelMinOrder },   // §8.10 legible-density threshold
      });
      info && (info.gridRes = gridRes);
      uniforms.uRiverCarvePatchStrength.value = riverOverlayState.patchStrength;
      // §2 Fork C — show the fine ribbon iff the patch is active (strength > 0); a bake at strength 0
      // stays regression-safe (mesh hidden, carve patch contributes 0).
      tributaryPatch.fineRibbon.visible = riverOverlayState.patchStrength > 0;
      return info;   // { center, u, v, angular, segmentCount, ribbonVerts, gridRes }
    }
    // route(): re-read the live height field + re-route + re-ribbon (no mesh rebuild — AC7).
    // In histogram mode the overlay OWNS the planet sea so the visible water and the river
    // outlets agree: drive state.seaLevel (the per-frame F14 sync propagates it to uSeaLevel) and
    // force lakes/coast on. 'live' mode instead routes to whatever sea the preset currently shows.
    // riverReroute is the ENABLED-only path: it routes (via ensureNetworkRouted) AND applies the
    // opt-in histogram sea override. The always-on routing on preset/seed change goes through
    // riverRerouteDebounced → ensureNetworkRouted directly, so it never forces the sea override.
    function riverReroute(label){
      if (!riverOverlayState.enabled) return;
      // route the network + carve cube, then apply the overlay-only histogram sea override.
      const { seaLevel } = ensureNetworkRouted(label);
      if (riverOverlayState.seaFromHistogram){
        state.seaLevel = seaLevel;
        state.lakesEnabled = true;
        state.coastStrength = 1.0;

    // Enable/disable: this toggle now controls ONLY the visible RIBBON overlay + the opt-in
    // histogram sea override + the terrain-gouging amounts. The dendritic NETWORK itself is always
    // routed (AC3 — ensureNetworkRouted on load + preset/seed change), so the carve cube + graph
    // exist regardless of this toggle; we do NOT revert uRiverCarveMap to the dummy on disable.
    // ON: show ribbon + re-route (refreshes the route, applies the sea override + gouging amounts).
    // OFF: hide ribbon, zero gouging amounts (applyCarveAmounts), undo the histogram sea override.
    function setRiverOverlay(on){
      state.riversEnabled = on;            // the registry enableKey — keep it authoritative
      riverOverlayState.enabled = on;      // internal mirror for riverReroute/applyCarveAmounts guards
      riverOverlay.ribbon.visible = on;
      if (on){
        syncDisplays();
        riverReroute('enable');            // network already routed; this refreshes + applies sea override + carve
      } else {
        applyCarveAmounts();               // enabled=false → forces gouging amounts to 0 (planet un-gouged)
        riverOverlayState.status = '(routed, ribbon off)';
        applyDrivers();                    // restore the driven sea level (undo the histogram override)
      }

    // live carve tuning (no re-route needed — just the shader amounts). The terrain-GOUGING
    // amounts stay gated by enabled && carve (so AC3's always-on routing never gouges by default —
    // the carve cube exists but nothing displaces terrain unless the overlay is enabled and carve
    // is on). The relief gate is set unconditionally (harmless without strength). When disabled the
    // gouging amounts are forced to 0 so no stale value survives a disable.
    function applyCarveAmounts(){
      const carveOn = riverOverlayState.enabled && riverOverlayState.carve;
      uniforms.uRiverCarveStrength.value = carveOn ? riverOverlayState.carveStrength : 0.0;
      uniforms.uRiverCarveFloor.value    = carveOn ? riverOverlayState.carveFloor : 0.0;
      uniforms.uRiverCarveDepth.value    = carveOn ? riverOverlayState.carveDepthH : 0.0;
      uniforms.uRiverCarveRough.value    = carveOn ? riverOverlayState.carveRough : 0.0;

    function rerollRadius(){ state.radiusSeed = (Math.random()*4294967296)>>>0; state._radiusDirty = true; applyDrivers(); }
    fDrivers.add(state, 'radiusSeed', 0, 4294967295, 1).name('radius seed').listen().onChange(()=>{ state._radiusDirty = true; applyDrivers(); });

    const fBodyDrivers = fDrivers.addFolder('Body drivers → plate relief (Inc.2)'); fBodyDrivers.open();
    const _onDriverDrag = (key) => { _driverTouched.add(key); _driverAbMode = 'override'; riverRerouteDebounced(); };

    const fScarps = fRelief.addFolder('Scarps (F5) ⊞grain'); fScarps.close();   // ⊞grain: fault strike driven by the shared WS4 tectonic grain

    let _preSoloEnables = null;   // enable snapshot captured before the first solo

      if (_preSoloEnables === null) _preSoloEnables = captureEnables();   // capture once, on first solo

      const kit = (ASSOCIATIONS[key] && ASSOCIATIONS[key].isolationKit) || [];
