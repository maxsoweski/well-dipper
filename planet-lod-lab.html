    const planet = new THREE.Mesh(geometry, material);
    scene.add(planet);

    // ─────────────────────────────────────────────────────────────────────────
    // Low-res render target + nearest-upscale blit — FAITHFUL to production.
    //
    // RetroRenderer.js renders scene objects into a low-res buffer
    // (renderWidth = ceil(width / pixelScale), NearestFilter) then nearest-
    // upscales to the screen. The inline Bayer dither in posterize() runs on
    // gl_FragCoord INSIDE that low-res buffer, so on-screen dither cells are
    // pixelScale× bigger than at native resolution. THAT chunkiness is the
    // retro feel. Rendering the lab at full canvas res made its dither ~3× too
    // fine — any A/B/C envelope judgment was at the wrong scale. This restores
    // the true scale so the lab is a valid evaluator.
    // ─────────────────────────────────────────────────────────────────────────
    let sceneTarget = null;
    function rebuildTarget() {
      const w = Math.max(1, Math.ceil(window.innerWidth  / state.pixelScale));
      const h = Math.max(1, Math.ceil(window.innerHeight / state.pixelScale));
      if (sceneTarget) sceneTarget.dispose();
      sceneTarget = new THREE.WebGLRenderTarget(w, h, {
        minFilter: THREE.NearestFilter,
        magFilter: THREE.NearestFilter,
        depthBuffer: true,
      });
      blitMat.uniforms.tDiffuse.value = sceneTarget.texture;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      return { w, h };
    }

    // Fullscreen nearest blit (mirrors RetroRenderer._setupComposite, minimal)
    const blitMat = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null } },
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
      `,
      fragmentShader: /* glsl */ `
        uniform sampler2D tDiffuse;
        varying vec2 vUv;
        void main(){ gl_FragColor = texture2D(tDiffuse, vUv); }
      `,
      depthTest: false, depthWrite: false,
    });
    const blitScene = new THREE.Scene();
    const blitMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blitMat);
    blitMesh.frustumCulled = false;
    blitScene.add(blitMesh);
    const blitCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    // ─────────────────────────────────────────────────────────────────────────

    const $ = (id) => document.getElementById(id);

    // ── Per-layer terrain seeds ──────────────────────────────────────────────
    // A seed maps to a constant 3D offset into the infinite noise field; sampling
    // a different region = different terrain. macro seed shifts octaves 0..2 (the
    // continents), detail seed shifts octaves 3+ (surface texture). Constant
    // offsets don't disturb the analytic gradient, so normals/lighting are safe.
    function seedOffset(seed, out){
      const h = (n) => { const x = Math.sin(n) * 43758.5453; return (x - Math.floor(x)) * 256.0; };
      return out.set(h(seed*12.9898 + 78.233), h(seed*39.346 + 11.135), h(seed*53.711 + 94.673));
    }
    function updateSeedUniforms(){
      seedOffset(state.macroSeed,  uniforms.uMacroOffset.value);
      seedOffset(state.detailSeed, uniforms.uDetailOffset.value);
    }
    updateSeedUniforms();

    // ── 🎲 randomize helpers (GUI-side, Math.random — NOT seeded; the rolls are

    // mirror core.js seededUnitVec3() / seedOffset() so a roll lands in the same
    // ranges the driven values do (unit sphere; per-component 0..256 noise offset). ──
    function randUnitVec3(){
      const z = Math.random() * 2.0 - 1.0;
      const phi = Math.random() * Math.PI * 2.0;
      const r = Math.sqrt(Math.max(0.0, 1.0 - z * z));
      return [r * Math.cos(phi), r * Math.sin(phi), z];
    }
    function randOffset(){ return [Math.random() * 256.0, Math.random() * 256.0, Math.random() * 256.0]; }

    // ▸ Drivers (open) — "types are driver-bundle PRESETS, not shader branches" (spec §2.D).
    // A preset is a physics bundle; deriveUniforms() maps it to semantic uniforms with NO
    // planetType branch — generalizing the aurora precedent in PlanetGenerator.js:435-487.
    // This is the generation-side scaffolding Stage-B features plug into.
    // radiusEarth/massEarth + eccentricity/starMassEarth/orbitRadiusEarth mirror the
    // generator's real output bundle (PhysicsEngine estimateMassEarth + orbital params);
    // deriveUniforms reads them for surfaceGravity (§2 #1) + tidalHeat (§2 #2). Values are
    // illustrative + roughly consistent (rocky M≈R^3.7·0.9; 1 AU = 23455 RE) — lab-tunable,
    // the consumers (Relief F2/F7/F8, Aeolian F15, Cryo P7) land in step 3.
    // composition.volatileFraction + atmosphere.retained/pressure mirror the generator's
    // real planetData (deriveComposition / computeAtmosphere) — deriveUniforms reads them
    // for the liquidStability/liquidSpecies master gate (§2 #3). "Titan (methane seas)"
    // exercises the cold methane species (1); "Frozen (airless)" proves the airless gate→0.
    const DRIVER_PRESETS = {
      'Rocky (Earthlike)': { radiusEarth:1.0, massEarth:0.9, eccentricity:0.017, starMassEarth:332946, orbitRadiusEarth:23455, composition:{ironFraction:0.32,density:5.5,volatileFraction:0.15}, T_eq:288, tidalState:{locked:false}, atmosphere:{color:[0.5,0.6,0.9],retained:true,pressure:1.0,composition:'n2-o2'}, habitability:0.7, surfaceHistory:{erosion:0.4,bombardmentIntensity:0.55,resurfacingRate:0.1} },
      'Lava (hot airless)': { radiusEarth:0.9, massEarth:0.65, eccentricity:0.15, starMassEarth:332946, orbitRadiusEarth:938, composition:{ironFraction:0.7,density:7,volatileFraction:0.02}, T_eq:950, tidalState:{locked:true,lockType:'synchronous'}, atmosphere:null, habitability:0, surfaceHistory:{erosion:0,bombardmentIntensity:0.3,resurfacingRate:0.95} },
      'Ocean (temperate)': { radiusEarth:1.1, massEarth:1.3, eccentricity:0.02, starMassEarth:332946, orbitRadiusEarth:23455, composition:{ironFraction:0.28,density:5,volatileFraction:0.35}, T_eq:295, tidalState:{locked:false}, atmosphere:{color:[0.4,0.6,0.95],retained:true,pressure:1.5,composition:'n2-o2'}, habitability:0.9, surfaceHistory:{erosion:0.6,bombardmentIntensity:0.4,resurfacingRate:0.3} },
      'Titan (methane seas)': { radiusEarth:0.4, massEarth:0.025, eccentricity:0.03, starMassEarth:332946, orbitRadiusEarth:120000, composition:{ironFraction:0.18,density:1.9,volatileFraction:0.4}, T_eq:94, tidalState:{locked:false}, atmosphere:{color:[0.8,0.6,0.3],retained:true,pressure:1.5,composition:'n2-o2'}, habitability:0.05, surfaceHistory:{erosion:0.2,bombardmentIntensity:0.5,resurfacingRate:0.4} },
      'Frozen (airless)': { radiusEarth:0.5, massEarth:0.07, eccentricity:0.005, starMassEarth:332946, orbitRadiusEarth:117275, composition:{ironFraction:0.2,density:2.5,volatileFraction:0.3}, T_eq:60, tidalState:{locked:false}, atmosphere:null, habitability:0.05, surfaceHistory:{erosion:0.1,bombardmentIntensity:0.85,resurfacingRate:0.05} },
      // "Europa (icy moon)" exercises Cryo P7: tidal ENERGY (eccentric close orbit) + VOLATILE-rich
      // (water-ice crust, vf 0.5) + COLD (T_eq 110 K, frozen shell) → derives cryoActivity≈1, the SHARED
      // uCryoActivity gate F9/F10 read (chaos rafts + double ridges render from the preset, no lab knob).
      // The lab models planet-around-STAR self-heating, so the close eccentric orbit stands in for a real
      // moon's planet-sourced tidal flexing (the documented P7 seam) — same convention as "Lava" at orbit 938.
      'Europa (icy moon)': { radiusEarth:0.5, massEarth:0.07, eccentricity:0.1, starMassEarth:332946, orbitRadiusEarth:2500, composition:{ironFraction:0.2,density:2.0,volatileFraction:0.5}, T_eq:110, tidalState:{locked:true,lockType:'synchronous'}, atmosphere:null, habitability:0.05, surfaceHistory:{erosion:0.05,bombardmentIntensity:0.3,resurfacingRate:0.6} },
    };
    const driverUI = { preset: 'Rocky (Earthlike)', qualityTier: 1.0 };
    function applyDrivers(){
      const u = deriveUniforms(DRIVER_PRESETS[driverUI.preset], driverUI.qualityTier);
      state.emissive = u.emissive; state.specStrength = u.specStrength; state.limbStrength = u.limbStrength;
      uniforms.uEmissive.value = u.emissive;
      uniforms.uSpecStrength.value = u.specStrength;
      uniforms.uLimbStrength.value = u.limbStrength;
      // cloudCoverage / auroraIntensity / craterCells / atmosphereModel consumed by Task 7 + Stage C
      if (uniforms.uCloudCoverage)  uniforms.uCloudCoverage.value  = u.cloudCoverage;
      if (uniforms.uAuroraIntensity) uniforms.uAuroraIntensity.value = u.auroraIntensity;
      // §2 #3 master liquid gate → RESERVED→LIVE uniforms (Fluvial owner; Optical/Aeolian/Cryo read in step 3+)
      if (uniforms.uLiquidStability) uniforms.uLiquidStability.value = u.liquidStability;
      if (uniforms.uLiquidSpecies)   uniforms.uLiquidSpecies.value   = u.liquidSpecies;
      // F2 craters (Stage-C step 3) — derived surfacings flow into state (frame loop writes
      // them to uniforms); uVoroCells = the qualityTier 27↔9 cellular knob (registry: Relief wires it).
      state.craterDensity    = u.craterDensity;
      state.craterComplexD   = u.craterComplexD;
      state.craterRelaxation = u.craterRelaxation;
      state.terraceCount     = u.terraceCount;
      uniforms.uVoroCells.value = u.craterCells;
      // F3 ejecta & rays (Stage-C step 3) — derived strength/rampart/ray-brightness flow
      // into state (frame loop → uniforms). Placement reuses the F2 crater uniforms.
      state.ejectaStrength   = u.ejectaStrength;
      state.ejectaRampart    = u.ejectaRampart;
      state.rayBrightness    = u.rayBrightness;
      // F1 mountains (Stage-C step 3) — derived amplitude + orogeny belt strength/strike.
      // orogenyAxis (unit vec2) → an angle the GUI exposes + the frame loop rebuilds.
      state.mountainAmp      = u.mountainAmp;
      state.orogenyStrength  = u.orogenyStrength;
      state.orogenyAngle     = Math.atan2(u.orogenyAxis[1], u.orogenyAxis[0]);
      // F4 canyons (Stage-C step 3) — derived depth + rift count + seeded plane normals.
      // depth/count flow into state (frame loop → uniforms); axes copy straight to the
      // uniform vec3 array (no GUI control — they're a per-planet seed property).
      state.chasmaDepth      = u.chasmaDepth;

    // Mouse orbit + zoom — ports src/camera/CameraController.js to the lab.
    // Left-drag => orbit (yaw/pitch); wheel => zoom (distance). Camera moves,
    // planet quaternion stays identity, so object-space light math is unchanged.
    // ─────────────────────────────────────────────────────────────────────────
    const DRAG_SENS = 0.003;          // matches CameraController.dragSensitivity
    const PITCH_LIMIT = 1.55;         // ~89°, avoid pole flip
    let dragging = false, lastX = 0, lastY = 0;
    canvas.addEventListener('pointerdown', (e) => {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      try { canvas.setPointerCapture(e.pointerId); } catch {}   // keep tracking if drag leaves canvas
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      state.yaw   -= dx * DRAG_SENS;
      state.pitch += dy * DRAG_SENS;
      state.pitch = Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, state.pitch));
    });
    const endDrag = (e) => {
      dragging = false;
      if (e.pointerId != null && canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.ctrlKey) return;   // Ctrl+wheel = browser-zoom intent; block it (preventDefault above) but don't move the camera
      // multiplicative => even feel across the range; clamp surface-skim(1.1)..overview(30)
      const factor = Math.exp(Math.sign(e.deltaY) * 0.12);
      state.distance = Math.max(1.1, Math.min(30, state.distance * factor));
    }, { passive: false });

    function applySettings(o){
      if (!o) return;
      const keys = ['pixelScale','octaves','levels','perturb','distance','yaw','pitch',
                    'macroSeed','detailSeed','octAuto','fwClamp','spinSpeed','normalMode'];
      for (const k of keys) if (o[k] != null) state[k] = o[k];
      if (o.pixelScale != null) rebuildTarget();
      updateSeedUniforms();
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Loop
    // ─────────────────────────────────────────────────────────────────────────
    const hud = $('hud');
    const lightObj = new THREE.Vector3();
    const invQuat = new THREE.Quaternion();
    let t = 0;

    function frame(){
      t += 0.0025;
      planet.rotation.y += state.spinSpeed;   // 0 = stopped; 0.000375 (slider center) = the original rate

      // Camera orbits the origin (yaw/pitch/distance) — mouse-driven, mirrors CameraController.
      const dist = state.distance * R;
      const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
      camera.position.set(
        dist * cp * Math.sin(state.yaw),
        dist * sp,
        dist * cp * Math.cos(state.yaw)
      );
      camera.lookAt(0, 0, 0);

      const lod = lodRampOf(state.distance);
      const oct = state.octAuto ? autoOctaves(lod) : state.octaves;
      // Discrete which-body-is-LOD2 flag, hysteresis-guarded (enter 18 / exit 22) to stop flicker.
      state._lod2Active = lodHysteresis(state.distance, state._lod2Active ?? false);

      // Light dir into object space (sphere rotates; lighting math is object-space)
      invQuat.copy(planet.quaternion).invert();
      lightObj.copy(WORLD_LIGHT).applyQuaternion(invQuat);

      uniforms.uOctaves.value = oct;
      uniforms.uLodRamp.value = lod;
      uniforms.uLevels.value = state.levels;
      uniforms.uPerturb.value = state.perturb;
      uniforms.uNormalMode.value = state.normalMode;
      uniforms.uFwClamp.value = state.fwClamp ? 1 : 0;
      uniforms.uDitherMode.value = state.ditherMode;
      uniforms.uEmissive.value = state.emissive;
      uniforms.uSpecStrength.value = state.specStrength;
      uniforms.uLimbStrength.value = state.limbStrength;
      uniforms.uEmissiveBypass.value = state.emissiveBypass ? 1 : 0;
      uniforms.uSpecBypass.value = state.specBypass ? 1 : 0;
      uniforms.uLimbBypass.value = state.limbBypass ? 1 : 0;
      uniforms.uTime.value = t;   // clouds drift + aurora rays animate (Task 7)
      uniforms.uDebugMode.value = state.debugMode | 0;
      uniforms.uVoroScale.value = state.voroScale;
      // uVoroCells set by applyDrivers (qualityTier) — the debug folder's voroCells
      // still drives the spike viz; craters read the driver-set uVoroCells.
      if (state.debugMode > 0) uniforms.uVoroCells.value = state.voroCells | 0;
      uniforms.uCraterDensity.value    = state.cratersEnabled ? state.craterDensity : 0.0;   // ✓ enable gate (preserves slider value)
      uniforms.uCraterComplexD.value   = state.craterComplexD;
      uniforms.uCraterRelaxation.value = state.craterRelaxation;
      uniforms.uTerraceCount.value     = state.terraceCount;
      uniforms.uCraterScale.value      = state.craterScale;
      uniforms.uCraterAmp.value        = state.craterAmp;
      // F3 ejecta & rays — strength/rampart/ray-brightness driven; amp/lump/count/sharp lab.
      uniforms.uEjectaStrength.value   = state.ejectaEnabled ? state.ejectaStrength : 0.0;   // ✓ enable gate
      uniforms.uEjectaRampart.value    = state.ejectaRampart;
      uniforms.uEjectaAmp.value        = state.ejectaAmp;
      uniforms.uEjectaLump.value       = state.ejectaLump;
      uniforms.uRayBrightness.value    = state.ejectaEnabled ? state.rayBrightness : 0.0;    // ✓ enable gate (rays share toggle)
      uniforms.uRayCount.value         = state.rayCount;
      uniforms.uRaySharp.value         = state.raySharp;
      // F1 mountains — amplitude/orogeny driven; ridge fold + scale lab-tunable.
      uniforms.uMountainAmp.value      = state.mountainsEnabled ? state.mountainAmp : 0.0;   // ✓ enable gate
      uniforms.uRidgeOffset.value      = state.ridgeOffset;
      uniforms.uRidgeGain.value        = state.ridgeGain;
      uniforms.uOrogenyStrength.value  = state.orogenyStrength;
      uniforms.uOrogenyAxis.value.set(Math.cos(state.orogenyAngle), Math.sin(state.orogenyAngle));
      uniforms.uMountainScale.value    = state.mountainScale;
      // F4 canyons — depth/count/width/floor driven+lab; axes set in applyDrivers (seed prop).
      uniforms.uChasmaDepth.value      = state.canyonsEnabled ? state.chasmaDepth : 0.0;   // ✓ enable gate
      uniforms.uChasmaCount.value      = state.chasmaCount | 0;
      uniforms.uChasmaWidth.value      = state.chasmaWidth;
      uniforms.uChasmaFloor.value      = state.chasmaFloor;
      // F5 scarps — strength/style driven; width/freq/warp lab-tunable; axis set in applyDrivers.
      uniforms.uScarpStrength.value    = state.scarpsEnabled ? state.scarpStrength : 0.0;   // ✓ enable gate
      uniforms.uScarpStyle.value       = state.scarpStyle;
      uniforms.uScarpWidth.value       = state.scarpWidth;
      uniforms.uScarpFreq.value        = state.scarpFreq;
      uniforms.uScarpWarp.value        = state.scarpWarp;
      uniforms.uScarpWarpFreq.value    = state.scarpWarpFreq;
      // F6 plateaus — strength driven; scale/offset/levels/softness lab-tunable.
      uniforms.uPlateauStrength.value  = state.plateausEnabled ? state.plateauStrength : 0.0;   // ✓ enable gate
      uniforms.uPlateauScale.value     = state.plateauScale;
      uniforms.uPlateauOffset.value    = state.plateauOffset;
      uniforms.uPlateauLevels.value    = state.plateauLevels;
      uniforms.uPlateauSoftness.value  = state.plateauSoftness;
      uniforms.uTesseraStrength.value  = state.tesseraEnabled ? state.tesseraStrength : 0.0;   // ✓ enable gate
      uniforms.uTesseraFreq.value      = state.tesseraFreq;
      uniforms.uTesseraWarp.value      = state.tesseraWarp;
      uniforms.uTesseraWarpFreq.value  = state.tesseraWarpFreq;
      // F7 edifices — volcanism/height/viscosity driven; scale/amp/caldera lab-tunable.
      uniforms.uVolcanismStrength.value = state.edificesEnabled ? state.volcanismStrength : 0.0;   // ✓ enable gate
      uniforms.uEdificeMaxHeight.value = state.edificeMaxHeight;
      uniforms.uShieldStratoMix.value  = state.shieldStratoMix;
      uniforms.uEdificeScale.value     = state.edificeScale;
      uniforms.uEdificeAmp.value       = state.edificeAmp;
      uniforms.uEdificeCaldera.value   = state.edificeCaldera;
      // F8 lava plains — coverage (SMOOTHS relief, gates region) + activity (emissive cracks)
      // driven; wrinkle/crack/glow lab-tunable. The enable toggle gates BOTH the early-outs
      // (uLavaCoverage zeroes the plains combiner AND the crack emissive's coverage guard).
      uniforms.uLavaCoverage.value = state.lavaEnabled ? state.lavaCoverage : 0.0;   // ✓ enable gate
      uniforms.uLavaActivity.value = state.lavaEnabled ? state.lavaActivity : 0.0;   // ✓ enable gate (cracks dark)
      uniforms.uLavaAxis.value.set(state.lavaAxis[0], state.lavaAxis[1], state.lavaAxis[2]);
      uniforms.uLavaScale.value    = state.lavaScale;
      uniforms.uWrinkleAmp.value   = state.wrinkleAmp;
      uniforms.uWrinkleFreq.value  = state.wrinkleFreq;
      uniforms.uWrinkleWarp.value  = state.wrinkleWarp;
      uniforms.uCrackScale.value   = state.crackScale;
      uniforms.uCrackWidth.value   = state.crackWidth;
      uniforms.uLavaGlowRate.value = state.lavaGlowRate;
      // F9/F10 icy terrain — uCryoActivity is the SHARED seam (lab-knob stub, owner Cryo; gates
      // BOTH combiners' early-out). Per-feature enables zero each feature's OWN amplitude for
      // independent A/B (chaos → jitter+matrixRough to 0; ridges → amp to 0); SHAPE is driven.
      uniforms.uCryoActivity.value     = state.cryoActivity;
      uniforms.uChaosCellScale.value   = state.chaosCellScale;
      uniforms.uChaosRaftJitter.value  = state.chaosEnabled ? state.chaosRaftJitter : 0.0;   // ✓ enable gate
      uniforms.uChaosMatrixRough.value = state.chaosEnabled ? state.chaosMatrixRough : 0.0;  // ✓ enable gate
      uniforms.uChaosMaskScale.value   = state.chaosMaskScale;
      uniforms.uDoubleRidgeFreq.value  = state.doubleRidgeFreq;
      uniforms.uCryoRidgeOffset.value  = state.cryoRidgeOffset;
      uniforms.uCryoRidgeWidth.value   = state.cryoRidgeWidth;
      uniforms.uGroovedBandFreq.value  = state.groovedBandFreq;
      uniforms.uCryoRidgeAmp.value     = state.cryoRidgeEnabled ? state.cryoRidgeAmp : 0.0;   // ✓ enable gate
      uniforms.uCryoRidgeWarp.value    = state.cryoRidgeWarp;
      uniforms.uCryoRidgeAxis0.value.set(state.cryoRidgeAxis0[0], state.cryoRidgeAxis0[1], state.cryoRidgeAxis0[2]);
      uniforms.uCryoRidgeAxis1.value.set(state.cryoRidgeAxis1[0], state.cryoRidgeAxis1[1], state.cryoRidgeAxis1[2]);
      // Cryo step 2 frost-coverage — ✓ enable gate zeroes the BUDGET (clean A/B; shape/tint preserved)
      uniforms.uFrostMaxCoverage.value   = state.frostEnabled ? state.frostMaxCoverage : 0.0;   // ✓ enable gate
      uniforms.uFrostCondensationT.value = state.frostCondensationT;
      uniforms.uFrostLatitudeBias.value  = state.frostLatitudeBias;
      uniforms.uFrostAlbedo.value.setRGB(state.frostAlbedo[0], state.frostAlbedo[1], state.frostAlbedo[2]);
      uniforms.uPlanetTempEq.value       = state.tempEq;
      uniforms.uFrostLocked.value        = state.frostLocked;
      uniforms.uFrostLatChill.value      = state.frostLatChill;
      uniforms.uFrostLapseRate.value     = state.frostLapseRate;
      uniforms.uFrostEdgeSoftness.value  = state.frostEdgeSoftness;
      uniforms.uFrostNoiseAmp.value      = state.frostNoiseAmp;
      uniforms.uFrostNoiseScale.value    = state.frostNoiseScale;
      uniforms.uFrostOffset.value.set(state.frostOffset[0], state.frostOffset[1], state.frostOffset[2]);
      uniforms.uPldStrength.value        = state.frostEnabled ? state.pldStrength : 0.0;   // F22 PLD rides the ✓ enable gate
      uniforms.uPldLevels.value          = state.pldLevels;
      uniforms.uPldSoftness.value        = state.pldSoftness;
      // 🎲 per-feature domain offsets (axes are written directly by the 🎲 handlers / applyDrivers)
      uniforms.uCraterOffset.value.set(state.craterOffset[0], state.craterOffset[1], state.craterOffset[2]);
      uniforms.uMountainDomainOffset.value.set(state.mountainDomainOffset[0], state.mountainDomainOffset[1], state.mountainDomainOffset[2]);
      uniforms.uScarpDomainOffset.value.set(state.scarpDomainOffset[0], state.scarpDomainOffset[1], state.scarpDomainOffset[2]);
      uniforms.uPlateauDomainOffset.value.set(state.plateauDomainOffset[0], state.plateauDomainOffset[1], state.plateauDomainOffset[2]);
      uniforms.uTesseraDomainOffset.value.set(state.tesseraDomainOffset[0], state.tesseraDomainOffset[1], state.tesseraDomainOffset[2]);
      uniforms.uEdificeOffset.value.set(state.edificeOffset[0], state.edificeOffset[1], state.edificeOffset[2]);
      uniforms.uLavaOffset.value.set(state.lavaOffset[0], state.lavaOffset[1], state.lavaOffset[2]);
      uniforms.uChaosOffset.value.set(state.chaosOffset[0], state.chaosOffset[1], state.chaosOffset[2]);
      uniforms.uCryoRidgeOffsetV.value.set(state.cryoRidgeOffsetV[0], state.cryoRidgeOffsetV[1], state.cryoRidgeOffsetV[2]);
      uniforms.uLightDir.value.copy(lightObj);

      hud.textContent =
        `dist/radius : ${state.distance.toFixed(1)}\n` +
        `pixelScale  : ÷${state.pixelScale}  (cell ≈ ${state.pixelScale}px)\n` +
        `lodRamp     : ${lod.toFixed(3)}\n` +
        `lod2 flag   : ${state._lod2Active ? 'ACTIVE' : 'off'}\n` +
        `octaves(eff): ${oct.toFixed(2)}${state.octAuto ? '  (auto)' : '  (manual)'}\n` +
        `posterize   : ${state.levels} levels\n` +
        `normals     : ${state.normalMode === 0 ? 'analytic' : 'finite-diff'}\n` +
        `fwidth clamp: ${state.fwClamp ? 'on' : 'off'}`;

      // Pass 1: planet into low-res buffer (dither runs in here → chunky cells)
      renderer.setRenderTarget(sceneTarget);
      renderer.render(scene, camera);
      // Pass 2: nearest-upscale blit to the screen
      renderer.setRenderTarget(null);
      renderer.render(blitScene, blitCamera);
      requestAnimationFrame(frame);
    }
    rebuildTarget();
    frame();

    window.addEventListener('resize', () => {
      const { w, h } = rebuildTarget();
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ─────────────────────────────────────────────────────────────────────────
    // "?" help overlay — self-documenting so the code needn't be open
    // ─────────────────────────────────────────────────────────────────────────
    $('help').innerHTML = `
      <h2>PLANET LOD LAB — WHAT THIS IS</h2>
      <p>Isolated harness for the <b>LOD2 close-up planet detail</b> feature: when you
      fly close to a planet, getting nearer should add <b>more surface DETAIL</b>
      (finer relief, more noise octaves) — not just a bigger blurry sphere. It also
      A/Bs a new <b>analytic-derivative normal</b> stack against the production
      finite-diff path. Everything renders through the same low-res dithered retro
      pipeline the real game uses, so any envelope judgment here is at the true scale.</p>

      <h3>CONTROLS</h3>
      <dl>
        <dt>macro / detail seed</dt><dd>Re-rolls the terrain by sampling a different region of the noise field. <b>macro</b> reshapes the big continents (octaves 0–2); <b>detail</b> varies the fine surface texture (octaves 3+) while the continents hold. ◀▶ step ±1, rnd jumps to a random seed. Both seeds are saved by Copy settings, so a planet you like is reproducible.</dd>
        <dt>mouse: drag / scroll</dt><dd>Drag to orbit the planet (yaw + pitch, clamped ±89°); scroll wheel to zoom — distance 1.1 = surface-skimming (fills the screen), 30 = overview. Distance drives lodRamp. Ports src/camera/CameraController.js.</dd>
        <dt>pixelScale (÷)</dt><dd>Renders the planet into a low-res buffer (¼, ⅓…) then nearest-upscales. Matches production RetroRenderer (÷3). Higher = chunkier dither cells. This is the faithful retro lever — the inline Bayer runs inside this buffer.</dd>
        <dt>octaves</dt><dd>Manual FBM octave count (used only when "Octaves: MANUAL"). More octaves = finer relief.</dd>
        <dt>posterize lv</dt><dd>Number of brightness bands the dither quantizes to. Fewer = harder retro banding.</dd>
        <dt>perturb</dt><dd>Relief strength — how much the surface noise bends the shading normal.</dd>
        <dt>Normals: ANALYTIC / FINITE-DIFF</dt><dd>A/B the new one-eval analytic-gradient normals vs the production 3-tap finite-difference path, at the same distance. Analytic should carry relief across the whole lit face; finite-diff goes flat in direct light (relief only near the terminator).</dd>
        <dt>Octaves: AUTO / MANUAL</dt><dd>AUTO = octaves ramp with distance: mix(4,9,lodRamp). MANUAL hands the octave slider control.</dd>
        <dt>fwidth clamp</dt><dd>Fades octaves that have shrunk below ~1 screen pixel to their mean, killing dither shimmer/aliasing on the far side. Off = see the raw shimmer.</dd>
        <dt>spin speed (rad/frame)</dt><dd>Auto-rotates the planet so you can watch the terminator sweep. 0 = stopped (default — drag to rotate it yourself); the slider center (0.000375 rad/frame) is the original auto-rate.</dd>
        <dt>Copy settings</dt><dd>Writes the live state (pixelScale, octaves, levels, perturb, toggles, yaw/pitch/distance) to the clipboard as JSON. Paste it back in chat so the next agent can reproduce the look.</dd>
        <dt>Reset</dt><dd>Restores all defaults (distance 20, ÷3, analytic, auto octaves, clamp on, spin speed 0).</dd>
      </dl>

      <h3>HUD READOUTS (top-left)</h3>
      <dl>
        <dt>dist/radius</dt><dd>Current approach distance in radii.</dd>
        <dt>pixelScale</dt><dd>The buffer divisor and the resulting on-screen dither-cell size in CSS px.</dd>
        <dt>lodRamp</dt><dd>0→1 detail ramp: <code>smoothstep(20,6,approach)</code>. 1 = closest/most detail.</dd>
        <dt>octaves(eff)</dt><dd>Effective octave count actually fed to the FBM this frame (auto or manual).</dd>
        <dt>posterize</dt><dd>Active brightness-band count.</dd>
        <dt>normals</dt><dd>Which normal path is live (analytic | finite-diff).</dd>
        <dt>fwidth clamp</dt><dd>Whether the sub-pixel octave fade is on.</dd>
      </dl>
    `;
    $('helpBtn').addEventListener('click', () => $('help').classList.toggle('open'));

    // Expose for chrome-devtools verification (set state, read a frame)
    window._lab = { state, uniforms, planet, camera, lodRampOf, autoOctaves, rebuildTarget,
                    settingsBlob, applySettings, driverUI, applyDrivers,
                    setPreset(name){ if (DRIVER_PRESETS[name]) { driverUI.preset = name; applyDrivers(); } return state._derived; },
                    setQuality(q){ driverUI.qualityTier = q; applyDrivers(); return state._derived; },
                    get sceneTarget(){ return sceneTarget; } };
  </script>
</body>
</html>
