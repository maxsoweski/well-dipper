<!--
  PLANET LOD LAB — Foundation (analytic-derivative noise + octave ramp)
  =====================================================================
  Isolated harness for the LOD2 close-up planet detail feature.
  Research: research/RESEARCH_high-lod-planet-shaders-2026-06-05.md

  SCOPE (this session = foundation only, per Max 2026-06-06):
    - Single rocky sphere.
    - Shared VERBATIM from src/objects/Planet.js (so envelope eval is honest):
        snoise(), bayerDither(), posterize(color, levels, fragCoord, 0.4),
        single-star diffuse + ambient(0.035) lighting, and the production
        computeHeight()/perturbNormalFromNoise() finite-diff path (the thing
        we're replacing) for the regression toggle.
    - NEW analytic stack: IQ noised() (value + analytic gradient in one eval),
        variable-octave fbmd() driven by octaves = mix(4,9,lodRamp),
        fractional trailing-octave weight, fwidth frequency clamp.
    - Controls: approach distance -> lodRamp, normal mode (analytic|finite-diff),
        octave auto/manual, posterizer levels 2..16, perturb strength,
        fwidth clamp on/off, spin.

  DEFERRED (later session): lava/gas types, A/B/C envelope toggle, emissive
    bypass, craters/erosion combiners. Foundation must read as "getting close
    = more DETAIL, not resolution" and analytic normals must be a clean,
    pop-free replacement for the finite-diff path.

  Served via the project's Vite dev server (bare `three` import, like the
  other *-lab.html files). Max runs the server; verify via chrome-devtools.
-->

<body>
  <canvas id="canvas"></canvas>
  <div id="hud"></div>

  <script type="module">
    import * as THREE from 'three';
    import GUI from 'lil-gui';
    import { smoothstep, lodRampOf, autoOctaves, lodHysteresis, deriveUniforms } from './planet-lod-lab-core.js';

    // ─────────────────────────────────────────────────────────────────────────
    // Renderer / scene / camera
    // ─────────────────────────────────────────────────────────────────────────
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x05060a);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 5000);

    const R = 1.0;                                  // body radius (object space)
    const WORLD_LIGHT = new THREE.Vector3(0.6, 0.35, 0.7).normalize();

    // ─────────────────────────────────────────────────────────────────────────
    // Shader — sections mirror src/objects/Planet.js where marked VERBATIM
    // ─────────────────────────────────────────────────────────────────────────
    const vertexShader = /* glsl */ `
      varying vec3 vPos;            // object-space position (noise domain — precision-safe)
      varying vec3 vObjN;           // object-space geometric normal
      // ── Canonical shared varying (integration-index §1) — vSubstellarAngle ──
      // Angle (rad) from the substellar point: 0 at the sub-star point, π at the
      // antistellar point. Computed ONCE here so Bands (thermal), Clouds (F31f
      // pupil/ring), Cryo (nightside cap), Optical (limb/terminator) all read the
      // SAME value instead of each recomputing acos(dot(...)). Object-space light.
      varying float vSubstellarAngle;
      uniform vec3 uLightDir;       // object-space substellar direction (same uniform the frag reads)
      void main() {
        vPos = position;
        vObjN = normalize(position);
        vSubstellarAngle = acos(clamp(dot(normalize(position), normalize(uLightDir)), -1.0, 1.0));
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const fragmentShader = /* glsl */ `
      precision highp float;
      varying vec3 vPos;
      varying vec3 vObjN;
      varying float vSubstellarAngle;   // canonical shared varying (index §1) — see vertex shader

      uniform float uNoiseScale;
      uniform float uOctaves;       // effective octave count
      uniform float uLodRamp;       // 0 (far) .. 1 (closest) — one scalar drives all complexity
      uniform float uLevels;        // posterize levels
      uniform float uPerturb;       // relief strength
      uniform int   uNormalMode;    // 0 = analytic, 1 = finite-diff (production)
      uniform int   uFwClamp;       // 1 = fwidth octave clamp on
      uniform int   uDitherMode;    // 0 = Bayer, 1 = IGN
      uniform float uEmissive;      // emissive glow strength
      uniform float uSpecStrength;  // specular glint
      uniform float uLimbStrength;  // limb/atmosphere rim glow
      uniform int   uEmissiveBypass;
      uniform int   uSpecBypass;
      uniform int   uLimbBypass;
      uniform float uCloudCoverage;   // 0..1 weather-layer density (Task 7)
      uniform float uAuroraIntensity; // 0..1 night-side ring strength (Task 7)
      uniform float uTime;            // animation clock (clouds drift, aurora rays)
      uniform vec3  uLightDir;      // object-space light dir
      uniform vec3  uBaseColor;
      uniform vec3  uMacroOffset;   // macro seed -> noise-domain offset (octaves 0..2)
      uniform vec3  uDetailOffset;  // detail seed -> noise-domain offset (octaves 3+)
      // ── voronoi3d spike debug (index §5 risk #1 seam gate) ──
      uniform int   uDebugMode;     // 0 off, 1 F1, 2 F2-F1 border, 3 cell-id color, 4 voronoi relief
      uniform float uVoroScale;     // cell density (vPos * scale)
      uniform int   uVoroCells;     // 27 (desktop) | 9 (mobile) — shared cellular knob (qualityTier)

      // ── F2 craters (Stage-C step 3, Relief) — first voronoi3d consumer ──
      uniform float uCraterDensity;    // 0..1 fraction of cells that host a crater (surface age)
      uniform float uCraterComplexD;   // simple→complex transition diameter (g⁻¹, icy-switched)
      uniform float uCraterRelaxation; // 0..1 icy/warm palimpsest flattening
      uniform float uTerraceCount;     // inner-wall terrace ring count
      uniform float uCraterScale;      // crater cell density (vPos * scale)
      uniform float uCraterAmp;        // overall crater relief amplitude

      // ── snoise — VERBATIM from Planet.js (used by the finite-diff regression path) ──
      vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
      vec4 mod289(vec4 x){ return x - floor(x*(1.0/289.0))*289.0; }
      vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
      vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314*r; }
      float snoise(vec3 v){
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute(permute(permute(
          i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }

      // ── bayerDither + posterize — VERBATIM from Planet.js ──
      float bayerDither(vec2 coord){
        vec2 p = mod(floor(coord), 4.0);
        float t = 0.0;
        if (p.y < 0.5)      { t = (p.x<0.5)?0.0 :(p.x<1.5)?8.0 :(p.x<2.5)?2.0 :10.0; }
        else if (p.y < 1.5) { t = (p.x<0.5)?12.0:(p.x<1.5)?4.0 :(p.x<2.5)?14.0:6.0; }
        else if (p.y < 2.5) { t = (p.x<0.5)?3.0 :(p.x<1.5)?11.0:(p.x<2.5)?1.0 :9.0; }
        else                { t = (p.x<0.5)?15.0:(p.x<1.5)?7.0 :(p.x<2.5)?13.0:5.0; }
        return t / 16.0;
      }
      // Interleaved Gradient Noise (Jimenez 2014) — finer, less grid-patterned than
      // Bayer; needed when posterize levels are pushed high (spec §2.C dither toggle).
      float ignDither(vec2 coord){
        return fract(52.9829189 * fract(dot(coord, vec2(0.06711056, 0.00583715))));
      }
      float ditherVal(vec2 coord, int mode){
        return (mode == 1) ? ignDither(coord) : bayerDither(coord);
      }
      vec3 posterize(vec3 color, float levels, vec2 fragCoord, float edgeWidth, int mode){
        float dither = ditherVal(fragCoord, mode) - 0.5;
        vec3 dithered = color + dither * edgeWidth / levels;
        return floor(dithered * levels + 0.5) / levels;
      }

      // ── computeHeight + perturbNormalFromNoise — VERBATIM (the path we replace) ──
      float computeHeight(vec3 pos){
        float h  = snoise(pos * uNoiseScale * 0.3 + uMacroOffset)  * 0.5;
        h += snoise(pos * uNoiseScale       + uMacroOffset)  * 0.35;
        h += snoise(pos * uNoiseScale * 2.0 + uDetailOffset) * 0.2;
        h += snoise(pos * uNoiseScale * 4.0 + uDetailOffset) * 0.1;
        return h;
      }
      vec3 perturbFiniteDiff(vec3 N, vec3 pos, float strength){
        vec3 up = abs(N.y) < 0.99 ? vec3(0.0,1.0,0.0) : vec3(1.0,0.0,0.0);
        vec3 T = normalize(cross(up, N));
        vec3 B = cross(N, T);
        float eps = 0.01;
        float h0 = computeHeight(pos);
        float hT = computeHeight(pos + T*eps);
        float hB = computeHeight(pos + B*eps);
        float dT = (hT - h0)/eps;
        float dB = (hB - h0)/eps;
        float scale = strength * 0.025;
        vec3 perturbed = normalize(N - T*dT*scale - B*dB*scale);
        float dev = dot(perturbed, N);
        if (dev < 0.5) perturbed = normalize(mix(perturbed, N, 0.5));
        return perturbed;
      }

      // ── NEW: IQ analytic-derivative gradient noise — value in .x, gradient in .yzw ──
      // https://iquilezles.org/articles/gradientnoise/
      vec3 hash3(vec3 p){
        p = vec3( dot(p, vec3(127.1, 311.7,  74.7)),
                  dot(p, vec3(269.5, 183.3, 246.1)),
                  dot(p, vec3(113.5, 271.9, 124.6)) );
        return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
      }
      vec4 noised(vec3 x){
        vec3 p = floor(x);
        vec3 w = fract(x);
        vec3 u  = w*w*w*(w*(w*6.0-15.0)+10.0);      // quintic fade
        vec3 du = 30.0*w*w*(w*(w-2.0)+1.0);
        vec3 ga = hash3(p+vec3(0.0,0.0,0.0));
        vec3 gb = hash3(p+vec3(1.0,0.0,0.0));
        vec3 gc = hash3(p+vec3(0.0,1.0,0.0));
        vec3 gd = hash3(p+vec3(1.0,1.0,0.0));
        vec3 ge = hash3(p+vec3(0.0,0.0,1.0));
        vec3 gf = hash3(p+vec3(1.0,0.0,1.0));
        vec3 gg = hash3(p+vec3(0.0,1.0,1.0));
        vec3 gh = hash3(p+vec3(1.0,1.0,1.0));
        float va = dot(ga, w-vec3(0.0,0.0,0.0));
        float vb = dot(gb, w-vec3(1.0,0.0,0.0));
        float vc = dot(gc, w-vec3(0.0,1.0,0.0));
        float vd = dot(gd, w-vec3(1.0,1.0,0.0));
        float ve = dot(ge, w-vec3(0.0,0.0,1.0));
        float vf = dot(gf, w-vec3(1.0,0.0,1.0));
        float vg = dot(gg, w-vec3(0.0,1.0,1.0));
        float vh = dot(gh, w-vec3(1.0,1.0,1.0));
        float v = va
          + u.x*(vb-va) + u.y*(vc-va) + u.z*(ve-va)
          + u.x*u.y*(va-vb-vc+vd) + u.y*u.z*(va-vc-ve+vg) + u.z*u.x*(va-vb-ve+vf)
          + u.x*u.y*u.z*(-va+vb+vc-vd+ve-vf-vg+vh);
        vec3 d = ga
          + u.x*(gb-ga) + u.y*(gc-ga) + u.z*(ge-ga)
          + u.x*u.y*(ga-gb-gc+gd) + u.y*u.z*(ga-gc-ge+gg) + u.z*u.x*(ga-gb-ge+gf)
          + u.x*u.y*u.z*(-ga+gb+gc-gd+ge-gf-gg+gh)
          + du * ( vec3(vb-va, vc-va, ve-va)
                 + u.yzx*vec3(va-vb-vc+vd, va-vc-ve+vg, va-vb-ve+vf)
                 + u.zxy*vec3(va-vb-ve+vf, va-vb-vc+vd, va-vc-ve+vg)
                 + u.yzx*u.zxy*(-va+vb+vc-vd+ve-vf-vg+vh) );
        return vec4(v, d);
      }

      // ── voronoi3d — KEYSTONE shared primitive (integration-index §1) ──
      // 3D-domain cellular noise sampled on vPos: inherently seam-free on the
      // sphere (no UV seam, no pole pinch) — the reason to pay for 27 cells.
      // Transcribed from the CPU oracle in planet-lod-lab-core.js (same hash).
      // hash33 returns [0,1)^3 cell-jitter — DISTINCT from the signed hash3 above.
      vec3 hash33(vec3 p){
        p = vec3( dot(p, vec3(127.1, 311.7,  74.7)),
                  dot(p, vec3(269.5, 183.3, 246.1)),
                  dot(p, vec3(113.5, 271.9, 124.6)) );
        return fract(sin(p) * 43758.5453123);
      }
      // returns vec2(F1, F2); cellId + grad(=∂F1/∂p, the relief-normal term) via out.
      // cells: 27 = full 3×3×3 (seam-free desktop) ; <27 = center-slab 9 (lossy mobile).
      vec2 voronoi3d(vec3 p, int cells, out vec3 cellId, out vec3 grad){
        vec3 ip = floor(p);
        vec3 fp = fract(p);
        float f1 = 1e9, f2 = 1e9;
        vec3 nCell = ip, nR = vec3(0.0);
        for (int gz=-1; gz<=1; gz++){
          if (cells < 27 && gz != 0) continue;     // 9-cell: center slab only
          for (int gy=-1; gy<=1; gy++){
            for (int gx=-1; gx<=1; gx++){
              vec3 g = vec3(float(gx), float(gy), float(gz));
              vec3 c = g + hash33(ip + g);          // jittered center, rel to ip cell
              vec3 r = c - fp;                       // fragment -> center
              float d = length(r);
              if (d < f1){ f2 = f1; f1 = d; nCell = ip + g; nR = r; }
              else if (d < f2){ f2 = d; }
            }
          }
        }
        cellId = nCell;
        grad = (f1 > 1e-6) ? (-nR / f1) : vec3(0.0); // = normalize(p - center)
        return vec2(f1, f2);
      }

      // ── emissiveBlackbody — shared incandescence color ramp (integration-index §1) ──
      // ONE curve, two consumers: BANDS thermal (F32/F33) + EXOTIC magma (F41).
      // Returns CHROMATICITY only (peak channel ≈1); caller scales brightness
      // (uThermalStrength × starFacing). Transcribed from the CPU mirror in
      // planet-lod-lab-core.js — same stops, same chained-mix smoothstep weights
      // (a stylized Planckian-locus ramp anchored to real blackbody sRGB, not a
      // spectral integration). Emissive-bypass term, so it's added AFTER posterize.
      vec3 emissiveBlackbody(float tempK){
        vec3 c = vec3(1.0, 0.18, 0.05);                                         // 800K deep dull red (floor)
        c = mix(c, vec3(1.0, 0.42, 0.10), smoothstep( 800.0, 1500.0, tempK));   // -> orange
        c = mix(c, vec3(1.0, 0.66, 0.32), smoothstep(1500.0, 2500.0, tempK));   // -> amber/yellow
        c = mix(c, vec3(1.0, 0.85, 0.70), smoothstep(2500.0, 4000.0, tempK));   // -> warm white
        c = mix(c, vec3(1.0, 0.98, 0.96), smoothstep(4000.0, 6500.0, tempK));   // -> white (ceiling)
        return c;
      }

      // ── NEW: variable-octave analytic FBM. Returns vec4(height, gradient.xyz). ──
      // octaves = mix(4,9,lodRamp); fractional trailing-octave weight = pop-free ramp;
      // fwidth clamp fades sub-pixel octaves to their mean (kills dither shimmer).
      vec4 fbmd(vec3 pos, float octaves, float fwBase){
        float freq = uNoiseScale * 0.3;     // matches computeHeight's largest feature scale
        float amp  = 0.5;
        float h = 0.0;
        vec3 grad = vec3(0.0);
        for (int i = 0; i < 12; i++){
          if (float(i) >= octaves) break;
          float w = clamp(octaves - float(i), 0.0, 1.0);    // trailing-octave fade
          if (uFwClamp == 1){
            float screenF = fwBase * freq;                  // per-octave screen-space freq
            w *= 1.0 - smoothstep(0.4, 0.8, screenF);
          }
          // macro seed drives the big-feature octaves (0..2), detail seed the rest.
          // A constant offset leaves the analytic gradient untouched (chain rule).
          vec3 off = (i < 3) ? uMacroOffset : uDetailOffset;
          vec4 n = noised(pos * freq + off);
          h    += amp * w * n.x;
          grad += amp * w * freq * n.yzw;                   // chain rule for d/dpos
          amp  *= 0.5;
          freq *= 2.0;
        }
        return vec4(h, grad);
      }

      vec3 perturbAnalytic(vec3 N, vec3 grad, float strength){
        vec3 gTan = grad - dot(grad, N) * N;                // tangent-plane gradient
        vec3 perturbed = normalize(N - gTan * strength * 0.6);
        float dev = dot(perturbed, N);
        if (dev < 0.5) perturbed = normalize(mix(perturbed, N, 0.5));
        return perturbed;
      }

      // ── F2 craters (Stage-C step 3, Relief) — transcribed from craterProfile()
      // in planet-lod-lab-core.js (same constants, vitest-pinned analytic dhdr).
      // r = dist(fragment,center)/craterRadius. Returns vec2(height, dh/dr).
      vec2 craterProfile(float r, float morphology, float relaxation, float terraceCount){
        float h = 0.0, dhdr = 0.0;
        if (r < 1.0){
          h    += 0.2 * (r*r - 1.0);                        // parabolic cavity (depth/diam ≈0.2)
          dhdr += 0.2 * 2.0 * r;
          float u = clamp(r/0.4, 0.0, 1.0);                 // central peak: s = 1 − smoothstep(0,0.4,r)
          float s = 1.0 - (u*u*(3.0-2.0*u));
          float dsdr = -(6.0*u*(1.0-u)) * (1.0/0.4);        // d/dr; auto-0 once clamped (u=1)
          h    += morphology * 0.14 * s;
          dhdr += morphology * 0.14 * dsdr;
          float tw = 0.02 * morphology;                     // terraces: cos rings on the inner wall
          float w  = 6.28318530718 * terraceCount;
          h    += tw * cos(w*r);
          dhdr += tw * (-w) * sin(w*r);
        }
        float rs = (r - 1.0)/0.18;                          // rim: gaussian peak at r≈1
        float rg = exp(-(rs*rs));
        h    += 0.05 * rg;
        dhdr += 0.05 * rg * (-2.0*(r-1.0)/(0.18*0.18));
        float k = 1.0 - relaxation;                         // relaxation → palimpsest
        return vec2(h*k, dhdr*k);
      }

      // The crater combiner — first consumer of the voronoi3d keystone (index §1).
      // Per cell: a hash gates whether it hosts a crater (uCraterDensity fraction)
      // and hashes its radius; morphology = smoothstep on the g⁻¹ transition diameter
      // (NO type branch). Accumulates the crater height delta + its chain-rule gradient.
      // uCraterDensity≤0 ⇒ early-out, so the Stage-A base render is untouched.
      void craterCombiner(vec3 pos, inout float h, inout vec3 grad){
        if (uCraterDensity <= 0.0) return;
        vec3 cellId, voroGrad;
        vec2 ff = voronoi3d(pos * uCraterScale, uVoroCells, cellId, voroGrad);
        vec3 ch = hash33(cellId);                                   // per-cell hash: host gate + radius
        float host = step(1.0 - uCraterDensity, ch.x);             // uCraterDensity fraction of cells crater
        float craterRadius = mix(0.18, 0.55, ch.y);                // hashed size (cell units)
        float diameter = 2.0 * craterRadius;
        float morphology = smoothstep(uCraterComplexD*0.6, uCraterComplexD, diameter);
        float r = ff.x / craterRadius;
        vec2 prof = craterProfile(r, morphology, uCraterRelaxation, uTerraceCount);
        float amp = uCraterAmp * host;
        h    += amp * prof.x;
        // d(h)/d(vPos) = dh/dr · (1/craterRadius) · d(f1)/d(vPos);  d(f1)/d(vPos) = voroGrad·uCraterScale
        grad += amp * prof.y * (1.0/craterRadius) * voroGrad * uCraterScale;
      }

      void main(){
        vec3 N = normalize(vObjN);

        // ── voronoi3d seam-gate debug (index §5 risk #1) — early-return viz ──
        if (uDebugMode > 0){
          vec3 vCell, vGrad;
          vec2 ff = voronoi3d(vPos * uVoroScale, uVoroCells, vCell, vGrad);
          vec3 dbg;
          if (uDebugMode == 1){
            dbg = vec3(ff.x);                                        // F1 grayscale — cell bowls
          } else if (uDebugMode == 2){
            dbg = vec3(1.0 - smoothstep(0.0, 0.06, ff.y - ff.x));    // F2-F1 crack mask (borders)
          } else if (uDebugMode == 3){
            dbg = hash33(vCell);                                     // flat per-cell color — SEAM TEST
          } else if (uDebugMode == 4){
            vec3 pn = perturbAnalytic(N, vGrad, 0.5);               // voronoi grad as lit relief
            dbg = uBaseColor * (max(dot(pn, uLightDir), 0.0) + 0.05);
          } else if (uDebugMode == 5){
            // emissiveBlackbody ramp swatch — pole(500K)→pole(4000K) gradient.
            // Confirms the GLSL transcription matches the CPU mirror: bottom
            // deep-red, climbing through orange/amber to warm-white on top.
            float tempK = mix(500.0, 4000.0, clamp(N.y * 0.5 + 0.5, 0.0, 1.0));
            dbg = emissiveBlackbody(tempK);
          } else {
            // mode 6: vSubstellarAngle varying — 0 (white, substellar) → π (black,
            // antistellar). Confirms the shared varying is computed correctly:
            // a bright sub-star spot fading to a dark antistellar hemisphere.
            dbg = vec3(1.0 - vSubstellarAngle / 3.14159265);
          }
          gl_FragColor = vec4(dbg, 1.0);
          return;
        }

        // ════════════════════════════════════════════════════════════════════
        // §3 PIPELINE ORDER (integration-index) — the compositing contract.
        // Each Stage-C domain inserts at its labeled stage; the foundation wires
        // stages 1 / 6 / 8 / 9 + the ★ emissive channel, and leaves stages 2-5/7
        // as placeholders the domains fill from their per-domain docs. The one
        // hard invariant already honored: ★ emissive terms are added AFTER the
        // posterize split so they don't band into gray steps (Stage-A §2.C).
        // ════════════════════════════════════════════════════════════════════

        // ── Stage 1: noised() height/derivative base (Stage-A foundation) ──
        vec3 shadeN;
        // canonical shared accumulator (index §1): Relief writes tectonic graben;
        // Fluvial incised gorges + Cryo chasma ADD IN. Stages 2/3/4 consume it.
        float canyonHeight = 0.0;
        if (uNormalMode == 1){
          // Production finite-diff path (regression reference)
          shadeN = perturbFiniteDiff(N, vPos, uPerturb);
        } else {
          // New analytic path — relief amplitude grows with approach (lodRamp), so
          // "one scalar drives all complexity" (spec §2.B): octaves AND detail depth.
          float fwBase = max(max(fwidth(vPos.x), fwidth(vPos.y)), fwidth(vPos.z));
          vec4 hd = fbmd(vPos, uOctaves, fwBase);
          float h = hd.x;
          vec3 grad = hd.yzw;
          // ── Stage 2: RELIEF combiner — craters (voronoi3d consumer, F2) ──
          // Adds the crater height delta + its chain-rule gradient onto the FBM base;
          // perturbAnalytic then bends the normal so rims/bowls/central-peaks light
          // correctly. (Mountains F1 / scarps F4-F5 / canyonHeight land in later commits.)
          craterCombiner(vPos, h, grad);
          float reliefAmp = uPerturb * mix(0.7, 1.0, uLodRamp);
          shadeN = perturbAnalytic(N, grad, reliefAmp);
        }

        // ── Stage 2 (cont.): mountains / scarps; writes canyonHeight   [domain: Relief]
        // ── Stage 3: CRYO — frost-mask + sublimation pits; reads uCryoActivity; adds into canyonHeight [domain: Cryo]
        // ── Stage 4: FLUVIAL incision — channels/karst carve, add into canyonHeight; uLiquidMask cut at seaLevel [domain: Fluvial]
        // ── Stage 5: AEOLIAN — dunes (anisotropic relief mod); dust mantle SMOOTHS relief (runs AFTER stage 2) [domain: Aeolian]
        //    (stages 2-5 reshape shadeN / height / canyonHeight; placeholders until their domains land.)

        // ── Envelope composite-split (spec §2.C) — each term is the A/B/C surface.
        // A bypassed term skips the quantizer => smooth glow over the posterized base.
        float diff = max(dot(shadeN, uLightDir), 0.0);
        float ambient = 0.035;
        vec2 fc = gl_FragCoord.xy;
        // View vector — planet sits at origin, identity quaternion, so world==object space
        vec3 V = normalize(cameraPosition - vPos);

        // ── Stage 6: surface albedo / material (relief + cryo frost tint + liquid material) ──
        vec3 surface = posterize(min(uBaseColor * (diff + ambient), vec3(1.0)), uLevels, fc, 0.4, uDitherMode);

        // ── Stage 7: EXOTIC overlay — base-type + overlay-layer composite; consumes the FULL natural-base
        //    lit color + landMask; renders LAST among surface terms, before the envelope split. [domain: Exotic]
        //    (placeholder; maturity→0 must reveal the bare stage-6 base — the overlay-correctness test.)

        // ── Stage 8: CLOUDS & HAZE — cloud-as-relief deck + haze muting (muting runs BEFORE final posterize);
        //    AEOLIAN F40 storm veil wins the upper slot when both active. [domains: Clouds, Aeolian]
        // Clouds (analytic-FBM weather layer — animated via uTime; off plain snoise, onto noised() — Q7).
        vec4 cw = fbmd(vPos * 1.7 + vec3(uTime * 0.02, 0.0, 0.0), 5.0, 0.0);
        float cloud = smoothstep(0.15, 0.5, cw.x) * uCloudCoverage * (diff + 0.05);
        vec3 cloudC = vec3(cloud);
        cloudC = posterize(cloudC, uLevels, fc, 0.4, uDitherMode);

        // ── Stage 9: OPTICAL — limb/terminator scattering (additive-tint ONLY; must not double-darken). [domain: Optical]
        // Limb / atmosphere rim glow (fresnel against the geometric normal, sun-weighted).
        float limb = pow(1.0 - max(dot(N, V), 0.0), 3.0) * uLimbStrength * (diff + 0.15);
        vec3 limbC = uBaseColor * limb;
        limbC = (uLimbBypass == 1) ? limbC : posterize(limbC, uLevels, fc, 0.4, uDitherMode);

        // ════════ posterize(surface) split — ★ EMISSIVE channel: all terms below BYPASS the quantizer ════════
        // Owners: thermal Bands F32/F33 (emissiveBlackbody), magma Exotic F41 (emissiveBlackbody),
        // city lights F48/49, bioluminescence F46, aurora Optical F37, sunglint Optical F36.

        // ★ Emissive glow (lava/hot stand-in for F41/F32) — Lambert-independent (visible on the dark side).
        vec3 emissive = uBaseColor * uEmissive;
        emissive = (uEmissiveBypass == 1) ? emissive : posterize(emissive, uLevels, fc, 0.4, uDitherMode);

        // ★ Specular glint (sunglint F36 stand-in) — Blinn-Phong, only on the lit side.
        vec3 H = normalize(uLightDir + V);
        float spec = pow(max(dot(shadeN, H), 0.0), 48.0) * uSpecStrength * step(0.0001, diff);
        vec3 specC = vec3(spec);
        specC = (uSpecBypass == 1) ? specC : posterize(specC, uLevels, fc, 0.4, uDitherMode);

        // ★ Aurora (Optical F37 stand-in) — night-side polar ring; rays from analytic noised(); skips quantizer.
        float lat = N.y;                                       // -1..1 latitude proxy (object-space normal)
        float ringMask = exp(-pow((abs(lat) - 0.7) / 0.12, 2.0));
        float nightMask = smoothstep(0.1, -0.1, diff);         // visible in darkness/twilight
        float rays = 0.5 + 0.5 * noised(N * 8.0 + vec3(uTime * 0.1)).x;
        float aurora = ringMask * nightMask * rays * uAuroraIntensity;
        vec3 auroraC = vec3(0.3, 0.9, 0.5) * aurora * 0.6;

        gl_FragColor = vec4(min(surface + emissive + specC + limbC + cloudC + auroraC, vec3(1.0)), 1.0);
      }
    `;

    const uniforms = {
      uNoiseScale: { value: 4.0 },
      uOctaves:    { value: 4.0 },
      uLodRamp:    { value: 0.0 },
      uLevels:     { value: 6.0 },
      uPerturb:    { value: 0.55 },
      uNormalMode: { value: 0 },
      uFwClamp:    { value: 1 },
      // ── Envelope composite-split (spec §2.C) — the A/B/C tunable surface ──
      uDitherMode:     { value: 0 },     // 0 = Bayer, 1 = IGN/triangular
      uEmissive:       { value: 0.0 },   // emissive glow strength (lava/hot bodies)
      uSpecStrength:   { value: 0.0 },   // specular glint (ocean/ice)
      uLimbStrength:   { value: 0.0 },   // limb/atmosphere rim glow
      uEmissiveBypass: { value: 0 },     // 1 = term skips the quantizer (smooth glow)
      uSpecBypass:     { value: 0 },
      uLimbBypass:     { value: 0 },
      uCloudCoverage:  { value: 0.0 },   // weather-layer density (driven by deriveUniforms)
      uAuroraIntensity:{ value: 0.0 },   // night-side ring strength (driven by deriveUniforms)
      uTime:           { value: 0.0 },   // animation clock (driven from frame())
      uLightDir:     { value: new THREE.Vector3().copy(WORLD_LIGHT) },
      uBaseColor:    { value: new THREE.Color(0.46, 0.40, 0.34) },  // rocky tone
      uMacroOffset:  { value: new THREE.Vector3() },                // set from macroSeed
      uDetailOffset: { value: new THREE.Vector3() },                // set from detailSeed
      // ── voronoi3d spike debug (risk #1 seam gate) ──
      uDebugMode:    { value: 0 },                                  // 0 off, 1 F1, 2 border, 3 cell-color, 4 relief, 5 blackbody, 6 substellar
      uVoroScale:    { value: 5.0 },                                // cell density
      uVoroCells:    { value: 27 },                                 // 27 desktop | 9 mobile (shared cellular knob, set by qualityTier)
      // ── F2 craters (Stage-C step 3, Relief) — first voronoi3d consumer ──
      uCraterDensity:    { value: 0.0 },   // cell-fill fraction (driven by deriveUniforms surface age)
      uCraterComplexD:   { value: 0.6 },   // simple→complex transition diameter (g⁻¹, driven)
      uCraterRelaxation: { value: 0.0 },   // icy/warm palimpsest flatten (driven)
      uTerraceCount:     { value: 4.0 },   // inner-wall terrace rings
      uCraterScale:      { value: 6.0 },   // crater cell density (lab-tunable)
      uCraterAmp:        { value: 0.9 },   // overall crater relief amplitude (lab-tunable)
      // ── Canonical shared registry (integration-index §1) — RESERVED NAMES ──
      // The cross-domain shared semantic uniforms. Declared here (the central
      // registry) at default-off so the 8 Stage-C domains read ONE agreed name
      // instead of inventing their own. The OWNER domain wires its derivation
      // (step 2, generation-side surfacings) + GLSL declaration when it lands;
      // until then they sit at default. Full contract: research/stage-c/
      // REGISTRY-canonical-uniforms.md. (vSubstellarAngle = varying, above;
      // emissiveBlackbody/voronoi3d = shader helpers; latBias/storm arrays =
      // per-domain, declared by their owner — see the registry doc.)
      uLiquidStability: { value: 0.0 },   // 0..1 liquid on/off gate    — owner Fluvial; read by Aeolian/Cryo/Optical
      uLiquidMask:      { value: 0.0 },   // liquid-body coverage mask   — owner Fluvial; read by Optical (sunglint F36)
      uLiquidSpecies:   { value: 0 },     // enum 0=water 1=methane/ethane — owner Fluvial; read by Optical (glint IOR/tint)
      uCryoActivity:    { value: 0.0 },   // 0..1 icy-resurfacing activity — owner Cryo; read by Relief (F9/F10 chaos/ridged)
    };

    const geometry = new THREE.SphereGeometry(R, 256, 256);  // 256 for surface-skimming silhouette
    const material = new THREE.ShaderMaterial({ vertexShader, fragmentShader, uniforms });
    const planet = new THREE.Mesh(geometry, material);
    scene.add(planet);

    // ─────────────────────────────────────────────────────────────────────────
    // Low-res render target + nearest-upscale blit — FAITHFUL to production.
    //
    // RetroRenderer.js renders scene objects into a low-res buffer
    // (renderWidth = ceil(width / pixelScale), NearestFilter) then nearest-
    // upscales to the screen. The inline Bayer dither in posterize() runs on
    // gl_FragCoord INSIDE that low-res buffer, so on-screen dither cells are
    // pixelScale× bigger than at native resolution. THAT chunkiness is the
    // retro feel. Rendering the lab at full canvas res made its dither ~3× too
    // fine — any A/B/C envelope judgment was at the wrong scale. This restores
    // the true scale so the lab is a valid evaluator.
    // ─────────────────────────────────────────────────────────────────────────
    let sceneTarget = null;
    function rebuildTarget() {
      const w = Math.max(1, Math.ceil(window.innerWidth  / state.pixelScale));
      const h = Math.max(1, Math.ceil(window.innerHeight / state.pixelScale));
      if (sceneTarget) sceneTarget.dispose();
      sceneTarget = new THREE.WebGLRenderTarget(w, h, {
        minFilter: THREE.NearestFilter,
        magFilter: THREE.NearestFilter,
        depthBuffer: true,
      });
      blitMat.uniforms.tDiffuse.value = sceneTarget.texture;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      return { w, h };
    }

    // Fullscreen nearest blit (mirrors RetroRenderer._setupComposite, minimal)
    const blitMat = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null } },
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
      `,
      fragmentShader: /* glsl */ `
        uniform sampler2D tDiffuse;
        varying vec2 vUv;
        void main(){ gl_FragColor = texture2D(tDiffuse, vUv); }
      `,
      depthTest: false, depthWrite: false,
    });
    const blitScene = new THREE.Scene();
    const blitMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blitMat);
    blitMesh.frustumCulled = false;
    blitScene.add(blitMesh);
    const blitCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    // ─────────────────────────────────────────────────────────────────────────
    // State + controls
    // ─────────────────────────────────────────────────────────────────────────
    const state = {
      distance: 20.0,       // camera distance in radii (mouse-wheel driven) -> drives lodRamp
      yaw: 0.337,           // orbit yaw   (pointer-drag) — initial ≈ the old fixed CAM_DIR view
      pitch: 0.205,         // orbit pitch (pointer-drag), clamped to ±89°
      macroSeed: 1,         // big-feature noise band seed (octaves 0..2 — the continents)
      detailSeed: 1,        // fine-detail noise band seed (octaves 3+ — surface texture)
      pixelScale: 3,        // low-res buffer divisor (matches production RetroRenderer)
      octaves: 4.0,         // manual octave value (used when octAuto = false)
      levels: 6,
      perturb: 0.55,
      normalMode: 0,        // 0 analytic, 1 finite-diff
      octAuto: true,
      fwClamp: true,
      spin: false,
      // ── Envelope (spec §2.C) — the A/B/C tunable surface; values stay OPEN (§4) ──
      ditherMode: 0,        // 0 Bayer, 1 IGN/triangular
      emissive: 0.0,        // lava/hot glow
      specStrength: 0.0,    // ocean/ice specular glint
      limbStrength: 0.0,    // atmosphere rim glow
      emissiveBypass: false,
      specBypass: false,
      limbBypass: false,
      // ── voronoi3d spike debug (risk #1 seam gate; removed once foundation lands) ──
      debugMode: 0,         // 0 off, 1 F1, 2 F2-F1 border, 3 cell-id color (seam test), 4 lit relief
      voroScale: 5.0,
      voroCells: 27,        // 27 desktop | 9 mobile
      // ── F2 craters (Stage-C step 3, Relief) — derived (density/complexD/relaxation/
      // terraceCount, set by applyDrivers from the preset) + lab-tunable (scale/amp) ──
      craterDensity: 0.0,
      craterComplexD: 0.6,
      craterRelaxation: 0.0,
      terraceCount: 4.0,
      craterScale: 6.0,
      craterAmp: 0.9,
    };

    const $ = (id) => document.getElementById(id);

    // ── Per-layer terrain seeds ──────────────────────────────────────────────
    // A seed maps to a constant 3D offset into the infinite noise field; sampling
    // a different region = different terrain. macro seed shifts octaves 0..2 (the
    // continents), detail seed shifts octaves 3+ (surface texture). Constant
    // offsets don't disturb the analytic gradient, so normals/lighting are safe.
    function seedOffset(seed, out){
      const h = (n) => { const x = Math.sin(n) * 43758.5453; return (x - Math.floor(x)) * 256.0; };
      return out.set(h(seed*12.9898 + 78.233), h(seed*39.346 + 11.135), h(seed*53.711 + 94.673));
    }
    function updateSeedUniforms(){
      seedOffset(state.macroSeed,  uniforms.uMacroOffset.value);
      seedOffset(state.detailSeed, uniforms.uDetailOffset.value);
    }
    updateSeedUniforms();

    // ─────────────────────────────────────────────────────────────────────────
    // lil-gui control panel — folders mirror the driver-bundle model (spec §3).
    // Every control binds a `state` key; the frame loop writes state -> uniforms.
    // Mouse-wheel/drag mutate state.distance/yaw/pitch directly; .listen() keeps
    // the GUI display synced. A "type" is a preset (Task 6), never a shader branch.
    // ─────────────────────────────────────────────────────────────────────────
    const gui = new GUI({ title: 'PLANET LOD LAB — foundation' });

    // ▸ View & LOD (always open)
    const fView = gui.addFolder('View & LOD'); fView.open();
    fView.add(state, 'distance', 1.1, 30, 0.1).name('distance (radii)').listen();
    fView.add(state, 'octaves', 1, 9, 0.1).name('octaves (manual)').listen();
    fView.add(state, 'octAuto').name('octaves AUTO (lodRamp)');
    fView.add(state, 'fwClamp').name('fwidth clamp');
    fView.add(state, 'pixelScale', 1, 6, 1).name('pixelScale ÷').onChange(() => rebuildTarget());
    fView.add(state, 'normalMode', { ANALYTIC: 0, 'FINITE-DIFF': 1 }).name('normals');

    // ▸ Lab — harness mechanics, NOT planet features (spin is how you inspect, not what a planet is)
    const fLab = gui.addFolder('Lab'); fLab.close();
    fLab.add(state, 'spin').name('spin (slow auto-rotate)');

    // ▸ Debug — voronoi3d seam-gate spike (index §5 risk #1). Temporary: this folder
    // exists to prove the KEYSTONE primitive is seam-free before any cellular feature
    // builds on it. Mode 3 (per-cell color) is the seam test — a seam shows as a line.
    const fDebug = gui.addFolder('Debug — voronoi3d spike'); fDebug.open();
    fDebug.add(state, 'debugMode', { OFF: 0, 'F1 (cells)': 1, 'F2-F1 (borders)': 2, 'cell-id color (SEAM TEST)': 3, 'lit relief': 4, 'blackbody ramp': 5, 'substellar angle': 6 }).name('voronoi / bb / sub debug');
    fDebug.add(state, 'voroScale', 1, 20, 0.5).name('cell density');
    fDebug.add(state, 'voroCells', { '27 (desktop)': 27, '9 (mobile)': 9 }).name('cell count');

    // ▸ Envelope (open) — the A/B/C decision surface (spec §2.C). Values stay OPEN (§4):
    // this folder delivers the *controls*; settling per-type values is Max's playtesting.
    const fEnv = gui.addFolder('Envelope'); fEnv.open();
    fEnv.add(state, 'levels', 6, 16, 1).name('posterize levels');
    fEnv.add(state, 'ditherMode', { Bayer: 0, 'IGN/triangular': 1 }).name('dither mode');
    fEnv.add(state, 'emissive', 0, 1, 0.01).name('emissive (lava)');
    fEnv.add(state, 'specStrength', 0, 1, 0.01).name('specular (ocean/ice)');
    fEnv.add(state, 'limbStrength', 0, 1, 0.01).name('limb glow');
    fEnv.add(state, 'emissiveBypass').name('emissive bypass quantizer');
    fEnv.add(state, 'specBypass').name('spec bypass quantizer');
    fEnv.add(state, 'limbBypass').name('limb bypass quantizer');

    // ▸ Drivers (open) — "types are driver-bundle PRESETS, not shader branches" (spec §2.D).
    // A preset is a physics bundle; deriveUniforms() maps it to semantic uniforms with NO
    // planetType branch — generalizing the aurora precedent in PlanetGenerator.js:435-487.
    // This is the generation-side scaffolding Stage-B features plug into.
    // radiusEarth/massEarth + eccentricity/starMassEarth/orbitRadiusEarth mirror the
    // generator's real output bundle (PhysicsEngine estimateMassEarth + orbital params);
    // deriveUniforms reads them for surfaceGravity (§2 #1) + tidalHeat (§2 #2). Values are
    // illustrative + roughly consistent (rocky M≈R^3.7·0.9; 1 AU = 23455 RE) — lab-tunable,
    // the consumers (Relief F2/F7/F8, Aeolian F15, Cryo P7) land in step 3.
    // composition.volatileFraction + atmosphere.retained/pressure mirror the generator's
    // real planetData (deriveComposition / computeAtmosphere) — deriveUniforms reads them
    // for the liquidStability/liquidSpecies master gate (§2 #3). "Titan (methane seas)"
    // exercises the cold methane species (1); "Frozen (airless)" proves the airless gate→0.
    const DRIVER_PRESETS = {
      'Rocky (Earthlike)': { radiusEarth:1.0, massEarth:0.9, eccentricity:0.017, starMassEarth:332946, orbitRadiusEarth:23455, composition:{ironFraction:0.32,density:5.5,volatileFraction:0.15}, T_eq:288, tidalState:{locked:false}, atmosphere:{color:[0.5,0.6,0.9],retained:true,pressure:1.0,composition:'n2-o2'}, habitability:0.7, surfaceHistory:{erosion:0.4,bombardmentIntensity:0.55,resurfacingRate:0.1} },
      'Lava (hot airless)': { radiusEarth:0.9, massEarth:0.65, eccentricity:0.15, starMassEarth:332946, orbitRadiusEarth:938, composition:{ironFraction:0.7,density:7,volatileFraction:0.02}, T_eq:950, tidalState:{locked:true,lockType:'synchronous'}, atmosphere:null, habitability:0, surfaceHistory:{erosion:0,bombardmentIntensity:0.3,resurfacingRate:0.95} },
      'Ocean (temperate)': { radiusEarth:1.1, massEarth:1.3, eccentricity:0.02, starMassEarth:332946, orbitRadiusEarth:23455, composition:{ironFraction:0.28,density:5,volatileFraction:0.35}, T_eq:295, tidalState:{locked:false}, atmosphere:{color:[0.4,0.6,0.95],retained:true,pressure:1.5,composition:'n2-o2'}, habitability:0.9, surfaceHistory:{erosion:0.6,bombardmentIntensity:0.4,resurfacingRate:0.3} },
      'Titan (methane seas)': { radiusEarth:0.4, massEarth:0.025, eccentricity:0.03, starMassEarth:332946, orbitRadiusEarth:120000, composition:{ironFraction:0.18,density:1.9,volatileFraction:0.4}, T_eq:94, tidalState:{locked:false}, atmosphere:{color:[0.8,0.6,0.3],retained:true,pressure:1.5,composition:'n2-o2'}, habitability:0.05, surfaceHistory:{erosion:0.2,bombardmentIntensity:0.5,resurfacingRate:0.4} },
      'Frozen (airless)': { radiusEarth:0.5, massEarth:0.07, eccentricity:0.005, starMassEarth:332946, orbitRadiusEarth:117275, composition:{ironFraction:0.2,density:2.5,volatileFraction:0.3}, T_eq:60, tidalState:{locked:false}, atmosphere:null, habitability:0.05, surfaceHistory:{erosion:0.1,bombardmentIntensity:0.85,resurfacingRate:0.05} },
    };
    const driverUI = { preset: 'Rocky (Earthlike)', qualityTier: 1.0 };
    function applyDrivers(){
      const u = deriveUniforms(DRIVER_PRESETS[driverUI.preset], driverUI.qualityTier);
      state.emissive = u.emissive; state.specStrength = u.specStrength; state.limbStrength = u.limbStrength;
      uniforms.uEmissive.value = u.emissive;
      uniforms.uSpecStrength.value = u.specStrength;
      uniforms.uLimbStrength.value = u.limbStrength;
      // cloudCoverage / auroraIntensity / craterCells / atmosphereModel consumed by Task 7 + Stage C
      if (uniforms.uCloudCoverage)  uniforms.uCloudCoverage.value  = u.cloudCoverage;
      if (uniforms.uAuroraIntensity) uniforms.uAuroraIntensity.value = u.auroraIntensity;
      // §2 #3 master liquid gate → RESERVED→LIVE uniforms (Fluvial owner; Optical/Aeolian/Cryo read in step 3+)
      if (uniforms.uLiquidStability) uniforms.uLiquidStability.value = u.liquidStability;
      if (uniforms.uLiquidSpecies)   uniforms.uLiquidSpecies.value   = u.liquidSpecies;
      // F2 craters (Stage-C step 3) — derived surfacings flow into state (frame loop writes
      // them to uniforms); uVoroCells = the qualityTier 27↔9 cellular knob (registry: Relief wires it).
      state.craterDensity    = u.craterDensity;
      state.craterComplexD   = u.craterComplexD;
      state.craterRelaxation = u.craterRelaxation;
      state.terraceCount     = u.terraceCount;
      uniforms.uVoroCells.value = u.craterCells;
      state._derived = u;
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }
    const fDrivers = gui.addFolder('Drivers'); fDrivers.open();
    fDrivers.add(driverUI, 'preset', Object.keys(DRIVER_PRESETS)).name('type preset').onChange(applyDrivers);
    fDrivers.add(driverUI, 'qualityTier', 0, 1, 0.01).name('qualityTier').onChange(applyDrivers);

    // ▸ Surface — Relief
    const fRelief = gui.addFolder('Surface — Relief'); fRelief.open();
    fRelief.add(state, 'perturb', 0, 1.5, 0.01).name('perturb (relief)');
    // ▸ Craters (F2) — the derived fields (density/complexD/relaxation) come from the
    // driver preset (.listen() syncs them on preset change); scale/amp are lab knobs.
    const fCraters = fRelief.addFolder('Craters (F2)'); fCraters.open();
    fCraters.add(state, 'craterDensity', 0, 1, 0.01).name('density (age)').listen();
    fCraters.add(state, 'craterComplexD', 0.05, 2.0, 0.01).name('complexD (g⁻¹)').listen();
    fCraters.add(state, 'craterRelaxation', 0, 1, 0.01).name('relaxation').listen();
    fCraters.add(state, 'terraceCount', 2, 6, 1).name('terrace rings').listen();
    fCraters.add(state, 'craterScale', 1, 20, 0.5).name('cell density');
    fCraters.add(state, 'craterAmp', 0, 2, 0.01).name('amplitude');

    // ▸ Seeds — macro shifts continents (octaves 0-2), detail shifts texture (3+)
    const fSeeds = gui.addFolder('Seeds'); fSeeds.close();
    fSeeds.add(state, 'macroSeed', 0, 10000, 1).name('macro seed').listen().onChange(updateSeedUniforms);
    fSeeds.add(state, 'detailSeed', 0, 10000, 1).name('detail seed').listen().onChange(updateSeedUniforms);
    fSeeds.add({ newPlanet(){ state.macroSeed = (Math.random()*10000)|0; state.detailSeed = (Math.random()*10000)|0; updateSeedUniforms(); } }, 'newPlanet').name('New planet (re-roll both)');

    // ▸ Presets — lil-gui save/load round-trips the whole panel as JSON
    const fPresets = gui.addFolder('Presets'); fPresets.close();
    fPresets.add({ copy(){ const j = JSON.stringify(gui.save()); window._lab._lastCopied = j; navigator.clipboard?.writeText(j).catch(()=>{}); } }, 'copy').name('Copy settings (JSON)');
    fPresets.add({ reset(){ gui.reset(); rebuildTarget(); updateSeedUniforms(); } }, 'reset').name('Reset to defaults');

    applyDrivers();   // load the default driver bundle (Rocky) into the envelope uniforms

    // ─────────────────────────────────────────────────────────────────────────
    // Mouse orbit + zoom — ports src/camera/CameraController.js to the lab.
    // Left-drag => orbit (yaw/pitch); wheel => zoom (distance). Camera moves,
    // planet quaternion stays identity, so object-space light math is unchanged.
    // ─────────────────────────────────────────────────────────────────────────
    const DRAG_SENS = 0.003;          // matches CameraController.dragSensitivity
    const PITCH_LIMIT = 1.55;         // ~89°, avoid pole flip
    let dragging = false, lastX = 0, lastY = 0;
    canvas.addEventListener('pointerdown', (e) => {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      try { canvas.setPointerCapture(e.pointerId); } catch {}   // keep tracking if drag leaves canvas
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      state.yaw   -= dx * DRAG_SENS;
      state.pitch += dy * DRAG_SENS;
      state.pitch = Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, state.pitch));
    });
    const endDrag = (e) => {
      dragging = false;
      if (e.pointerId != null && canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.ctrlKey) return;   // Ctrl+wheel = browser-zoom intent; block it (preventDefault above) but don't move the camera
      // multiplicative => even feel across the range; clamp surface-skim(1.1)..overview(30)
      const factor = Math.exp(Math.sign(e.deltaY) * 0.12);
      state.distance = Math.max(1.1, Math.min(30, state.distance * factor));
    }, { passive: false });

    // ─────────────────────────────────────────────────────────────────────────
    // Copy / apply settings — serialize the live look so Max can paste it back
    // in chat and the next agent can reproduce "the settings he likes".
    // ─────────────────────────────────────────────────────────────────────────
    function settingsBlob(){
      return {
        pixelScale: state.pixelScale, octaves: state.octaves, octAuto: state.octAuto,
        levels: state.levels, perturb: state.perturb, normalMode: state.normalMode,
        fwClamp: state.fwClamp, spin: state.spin,
        macroSeed: state.macroSeed, detailSeed: state.detailSeed,
        yaw: +state.yaw.toFixed(4), pitch: +state.pitch.toFixed(4), distance: +state.distance.toFixed(2),
      };
    }
    // Programmatic state apply (used by chrome-devtools verification + Copy-paste round-trip).
    // Sets state keys directly, refreshes derived uniforms, then syncs the lil-gui display.
    function applySettings(o){
      if (!o) return;
      const keys = ['pixelScale','octaves','levels','perturb','distance','yaw','pitch',
                    'macroSeed','detailSeed','octAuto','fwClamp','spin','normalMode'];
      for (const k of keys) if (o[k] != null) state[k] = o[k];
      if (o.pixelScale != null) rebuildTarget();
      updateSeedUniforms();
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Loop
    // ─────────────────────────────────────────────────────────────────────────
    const hud = $('hud');
    const lightObj = new THREE.Vector3();
    const invQuat = new THREE.Quaternion();
    let t = 0;

    function frame(){
      t += 0.0025;
      if (state.spin) planet.rotation.y += 0.000375;   // 4x slower than the original 0.0015

      // Camera orbits the origin (yaw/pitch/distance) — mouse-driven, mirrors CameraController.
      const dist = state.distance * R;
      const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
      camera.position.set(
        dist * cp * Math.sin(state.yaw),
        dist * sp,
        dist * cp * Math.cos(state.yaw)
      );
      camera.lookAt(0, 0, 0);

      const lod = lodRampOf(state.distance);
      const oct = state.octAuto ? autoOctaves(lod) : state.octaves;
      // Discrete which-body-is-LOD2 flag, hysteresis-guarded (enter 18 / exit 22) to stop flicker.
      state._lod2Active = lodHysteresis(state.distance, state._lod2Active ?? false);

      // Light dir into object space (sphere rotates; lighting math is object-space)
      invQuat.copy(planet.quaternion).invert();
      lightObj.copy(WORLD_LIGHT).applyQuaternion(invQuat);

      uniforms.uOctaves.value = oct;
      uniforms.uLodRamp.value = lod;
      uniforms.uLevels.value = state.levels;
      uniforms.uPerturb.value = state.perturb;
      uniforms.uNormalMode.value = state.normalMode;
      uniforms.uFwClamp.value = state.fwClamp ? 1 : 0;
      uniforms.uDitherMode.value = state.ditherMode;
      uniforms.uEmissive.value = state.emissive;
      uniforms.uSpecStrength.value = state.specStrength;
      uniforms.uLimbStrength.value = state.limbStrength;
      uniforms.uEmissiveBypass.value = state.emissiveBypass ? 1 : 0;
      uniforms.uSpecBypass.value = state.specBypass ? 1 : 0;
      uniforms.uLimbBypass.value = state.limbBypass ? 1 : 0;
      uniforms.uTime.value = t;   // clouds drift + aurora rays animate (Task 7)
      uniforms.uDebugMode.value = state.debugMode | 0;
      uniforms.uVoroScale.value = state.voroScale;
      // uVoroCells set by applyDrivers (qualityTier) — the debug folder's voroCells
      // still drives the spike viz; craters read the driver-set uVoroCells.
      if (state.debugMode > 0) uniforms.uVoroCells.value = state.voroCells | 0;
      uniforms.uCraterDensity.value    = state.craterDensity;
      uniforms.uCraterComplexD.value   = state.craterComplexD;
      uniforms.uCraterRelaxation.value = state.craterRelaxation;
      uniforms.uTerraceCount.value     = state.terraceCount;
      uniforms.uCraterScale.value      = state.craterScale;
      uniforms.uCraterAmp.value        = state.craterAmp;
      uniforms.uLightDir.value.copy(lightObj);

      hud.textContent =
        `dist/radius : ${state.distance.toFixed(1)}\n` +
        `pixelScale  : ÷${state.pixelScale}  (cell ≈ ${state.pixelScale}px)\n` +
        `lodRamp     : ${lod.toFixed(3)}\n` +
        `lod2 flag   : ${state._lod2Active ? 'ACTIVE' : 'off'}\n` +
        `octaves(eff): ${oct.toFixed(2)}${state.octAuto ? '  (auto)' : '  (manual)'}\n` +
        `posterize   : ${state.levels} levels\n` +
        `normals     : ${state.normalMode === 0 ? 'analytic' : 'finite-diff'}\n` +
        `fwidth clamp: ${state.fwClamp ? 'on' : 'off'}`;

      // Pass 1: planet into low-res buffer (dither runs in here → chunky cells)
      renderer.setRenderTarget(sceneTarget);
      renderer.render(scene, camera);
      // Pass 2: nearest-upscale blit to the screen
      renderer.setRenderTarget(null);
      renderer.render(blitScene, blitCamera);
      requestAnimationFrame(frame);
    }
    rebuildTarget();
    frame();

    window.addEventListener('resize', () => {
      const { w, h } = rebuildTarget();
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ─────────────────────────────────────────────────────────────────────────
    // "?" help overlay — self-documenting so the code needn't be open
    // ─────────────────────────────────────────────────────────────────────────
    $('help').innerHTML = `
      <h2>PLANET LOD LAB — WHAT THIS IS</h2>
      <p>Isolated harness for the <b>LOD2 close-up planet detail</b> feature: when you
      fly close to a planet, getting nearer should add <b>more surface DETAIL</b>
      (finer relief, more noise octaves) — not just a bigger blurry sphere. It also
      A/Bs a new <b>analytic-derivative normal</b> stack against the production
      finite-diff path. Everything renders through the same low-res dithered retro
      pipeline the real game uses, so any envelope judgment here is at the true scale.</p>

      <h3>CONTROLS</h3>
      <dl>
        <dt>macro / detail seed</dt><dd>Re-rolls the terrain by sampling a different region of the noise field. <b>macro</b> reshapes the big continents (octaves 0–2); <b>detail</b> varies the fine surface texture (octaves 3+) while the continents hold. ◀▶ step ±1, rnd jumps to a random seed. Both seeds are saved by Copy settings, so a planet you like is reproducible.</dd>
        <dt>mouse: drag / scroll</dt><dd>Drag to orbit the planet (yaw + pitch, clamped ±89°); scroll wheel to zoom — distance 1.1 = surface-skimming (fills the screen), 30 = overview. Distance drives lodRamp. Ports src/camera/CameraController.js.</dd>
        <dt>pixelScale (÷)</dt><dd>Renders the planet into a low-res buffer (¼, ⅓…) then nearest-upscales. Matches production RetroRenderer (÷3). Higher = chunkier dither cells. This is the faithful retro lever — the inline Bayer runs inside this buffer.</dd>
        <dt>octaves</dt><dd>Manual FBM octave count (used only when "Octaves: MANUAL"). More octaves = finer relief.</dd>
        <dt>posterize lv</dt><dd>Number of brightness bands the dither quantizes to. Fewer = harder retro banding.</dd>
        <dt>perturb</dt><dd>Relief strength — how much the surface noise bends the shading normal.</dd>
        <dt>Normals: ANALYTIC / FINITE-DIFF</dt><dd>A/B the new one-eval analytic-gradient normals vs the production 3-tap finite-difference path, at the same distance. Analytic should carry relief across the whole lit face; finite-diff goes flat in direct light (relief only near the terminator).</dd>
        <dt>Octaves: AUTO / MANUAL</dt><dd>AUTO = octaves ramp with distance: mix(4,9,lodRamp). MANUAL hands the octave slider control.</dd>
        <dt>fwidth clamp</dt><dd>Fades octaves that have shrunk below ~1 screen pixel to their mean, killing dither shimmer/aliasing on the far side. Off = see the raw shimmer.</dd>
        <dt>Spin</dt><dd>Auto-rotates the planet so you can watch the terminator sweep. Default OFF — drag to rotate it yourself.</dd>
        <dt>Copy settings</dt><dd>Writes the live state (pixelScale, octaves, levels, perturb, toggles, yaw/pitch/distance) to the clipboard as JSON. Paste it back in chat so the next agent can reproduce the look.</dd>
        <dt>Reset</dt><dd>Restores all defaults (distance 20, ÷3, analytic, auto octaves, clamp on, spin off).</dd>
      </dl>

      <h3>HUD READOUTS (top-left)</h3>
      <dl>
        <dt>dist/radius</dt><dd>Current approach distance in radii.</dd>
        <dt>pixelScale</dt><dd>The buffer divisor and the resulting on-screen dither-cell size in CSS px.</dd>
        <dt>lodRamp</dt><dd>0→1 detail ramp: <code>smoothstep(20,6,approach)</code>. 1 = closest/most detail.</dd>
        <dt>octaves(eff)</dt><dd>Effective octave count actually fed to the FBM this frame (auto or manual).</dd>
        <dt>posterize</dt><dd>Active brightness-band count.</dd>
        <dt>normals</dt><dd>Which normal path is live (analytic | finite-diff).</dd>
        <dt>fwidth clamp</dt><dd>Whether the sub-pixel octave fade is on.</dd>
      </dl>
    `;
    $('helpBtn').addEventListener('click', () => $('help').classList.toggle('open'));

    // Expose for chrome-devtools verification (set state, read a frame)
    window._lab = { state, uniforms, planet, camera, lodRampOf, autoOctaves, rebuildTarget,
                    settingsBlob, applySettings, driverUI, applyDrivers,
                    setPreset(name){ if (DRIVER_PRESETS[name]) { driverUI.preset = name; applyDrivers(); } return state._derived; },
                    setQuality(q){ driverUI.qualityTier = q; applyDrivers(); return state._derived; },
                    get sceneTarget(){ return sceneTarget; } };
  </script>
</body>
</html>
