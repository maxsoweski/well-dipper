    }

    // ── Render-delta sweep (Phase 2.5 Task 8) ───────────────────────────────
    // For the CURRENT preset, measure each feature's MARGINAL pixel contribution
    // in context: ON = {feature} ∪ isolationKit, OFF = isolationKit only.
    //
    // ROTATION is frozen (so the planet doesn't move between ON/OFF), but uTime is
    // NOT — many features animate (clouds drift, aurora rays, storms, lightning),
    // and a single frozen instant misses transients (e.g. lightning is OFF most of
    // the time). So we sample several uTime values across an animation cycle and
    // take the UNION of pixels that changed in ANY sample: a pixel counts if ON vs
    // OFF differ by >12/255 summed-abs RGB at any sampled instant. delta = that
    // union as a fraction of the frame. ON and OFF are always read at the SAME
    // uTime within a sample, so animation never contaminates the diff. An inert
    // feature still changes exactly 0 pixels (deterministic) → noise floor = 0.
    // Returns { preset, deltas:{feature:frac}, degenerate:{feature:'black'|'blown'|null} }.
    function _readTargetPixels(){
      const w = sceneTarget.width, h = sceneTarget.height;
      const buf = new Uint8Array(w * h * 4);
      renderer.readRenderTargetPixels(sceneTarget, 0, 0, w, h, buf);
      return buf;
    }
    function _degenerateOf(a){   // coarse mechanical-failure check on the ON frame
      let black = 0, blown = 0; const n = a.length / 4;
      for (let i = 0; i < a.length; i += 4){
        if (a[i]===0   && a[i+1]===0   && a[i+2]===0)   black++;
        if (a[i]===255 && a[i+1]===255 && a[i+2]===255) blown++;
      }
      if (black / n > 0.999) return 'black';   // whole frame black → planet itself vanished
      if (blown / n > 0.5)   return 'blown';   // >half the frame pure white → overflow
      return null;
    }
    // Sample points = VIEWS × TIMES. Two camera VIEWS (yaw + 0 and + π) cover BOTH
    // hemispheres — night-side-only features (aurora, cityLights, lightning,
    // nightsideThermal) live on the side away from the light and are invisible from
    // a single day-lit view. TIMES span ~a full clouds/aurora cycle (fract(uTime*0.04)
    // ⇒ period 25) so animated features register. A pixel counts if ON vs OFF differ
    // at ANY (view,time) sample → captures angle- and time-dependent contributions.
    //
    // BASELINE = the preset's NATURAL relevant feature set (relevantFeatureSet()), NOT
    // a bare solo. We answer the PLAYER-VISIBLE question — "does toggling this feature
    // change the planet the player actually sees on this preset?" — so:
    //   ON  = naturalSet ∪ {feature}   OFF = naturalSet \ {feature}.
    // A surface feature hidden under a gas giant's atmosphere yields ~0 delta (correctly
    // "doesn't render"); a feature that punches through where it shouldn't yields a real
    // false-render. (A bare solo+kit baseline instead strips the preset's own atmosphere,
    // exposing terrain the player never sees — measuring capability, not visibility.)
    const _SWEEP_VIEWS = [0, Math.PI];
    const _SWEEP_TIMES = [0, 12, 24];
    // Delta = changedPixels / frameTotal, so a feature's reading scales with the planet's
    // on-screen coverage (∝ 1/distance²). The capture distance MUST be pinned or the whole
    // matrix floats: the committed .sweep-raw.json baseline was measured at distance ≈ 2.6
    // (calibrated 2026-06-15 — reproduces every Rocky baseline value within ±1.4%), but
    // renderDeltaSweep historically never controlled state.distance, so a fresh sweep at the
    // default distance 20 read ~64–100× smaller and silently demoted solid renders to faint.
    // Pinning here makes the offline report AND the live Ask-4 badges capture at one scale.
    const SWEEP_DISTANCE = 2.6;
    async function renderDeltaSweep({ settleFrames = 2, perPixelThresh = 12 } = {}){
      const allKeys = Object.keys(FEATURES);
      const restore = captureEnables();              // operator's prior enables — restored at end
      const prevFreeze = _sweepFreeze, baseT = t, baseYaw = state.yaw, baseDist = state.distance;
      _sweepFreeze = true;                           // freeze auto-spin; we drive t + yaw by hand below
      state.distance = SWEEP_DISTANCE;               // pin coverage scale (see SWEEP_DISTANCE note above)
      const nextFrame = () => new Promise(r => requestAnimationFrame(r));
      const settle = async n => { for (let i = 0; i < n; i++) await nextFrame(); };
      const N = sceneTarget.width * sceneTarget.height;
      const naturalSet = relevantFeatureSet().set;   // the preset's natural feature union (the player's planet)
      const deltas = {}, degenerate = {};
      for (const key of allKeys){
        const onSet  = new Set(naturalSet); onSet.add(key);          // natural planet WITH the feature
        const offSet = new Set(naturalSet); offSet.delete(key);      // natural planet WITHOUT the feature
        const everChanged = new Uint8Array(N);                       // per-pixel: changed in ANY sample
        let degen = null, first = true;
        for (const vyaw of _SWEEP_VIEWS) for (const dt of _SWEEP_TIMES){
          state.yaw = baseYaw + vyaw;                                // camera hemisphere
          t = baseT + dt;                                            // fixed instant (frame() won't advance it)
          applyEnableSet(onSet);  await settle(settleFrames); const on  = _readTargetPixels();
          applyEnableSet(offSet); await settle(settleFrames); const off = _readTargetPixels();
          for (let i = 0, px = 0; i < on.length; i += 4, px++){
            const dd = Math.abs(on[i]-off[i]) + Math.abs(on[i+1]-off[i+1]) + Math.abs(on[i+2]-off[i+2]);
            if (dd > perPixelThresh) everChanged[px] = 1;
          }
          if (first){ degen = _degenerateOf(on); first = false; }    // degeneracy judged at the first sample
        }
        let c = 0; for (let i = 0; i < N; i++) if (everChanged[i]) c++;
        deltas[key] = c / N;
        degenerate[key] = degen;
      }
      t = baseT; state.yaw = baseYaw; state.distance = baseDist;     // restore clock + camera + zoom
      for (const k of allKeys) state[FEATURES[k].enableKey] = restore[k];   // restore enables
      syncDisplays();
      _sweepFreeze = prevFreeze;
      return { preset: driverUI.preset, deltas, degenerate };
    }
    // The relevant feature set = UNION of featuresOf() over every archetype whose
    // presets include the current Drivers preset (Frozen maps to two → union).
    function relevantFeatureSet(){
      const archs = Object.keys(ARCHETYPES).filter(a => ARCHETYPES[a].presets.includes(driverUI.preset));
      const set = new Set();
      for (const a of archs) for (const k of featuresOf(a)) set.add(k);
      return { set, archs };
    }

    // ── Live render-audit (Ask 4) ─────────────────────────────────────────────
    // Runs the existing in-page sweep for the CURRENT preset, classifies all 47
    // features via the existing pure auditor + statusOf, and stores the result on
    // state.audit. A SECOND in-GUI consumer of renderDeltaSweep() — current-preset
    // only, on demand. Does NOT touch the offline pipeline.
    //
    // _auditing brackets the ENTIRE sweep: the sweep mutates state[*Enabled] ~6×
    // per feature and calls syncDisplays(), which the two global gui.onChange
    // staleness hooks (Task 6) listen on. Without this guard the audit would mark
    // ITSELF stale mid-run. Set before the sweep, cleared in finally (after the
    // sweep's own restore), so any control change DURING the sweep is ignored and
    // any control change AFTER it correctly stales. This is the single load-bearing
    // detail of the staleness mechanism.
    let _auditing = false;
    async function runAudit(){
      const preset = driverUI.preset;
      _auditing = true;
      let sweep;
      try {
        sweep = await renderDeltaSweep();           // { preset, deltas, degenerate } for the CURRENT preset
      } finally {
        _auditing = false;                          // cleared even if the sweep throws
      }
      // expected side: ASSOCIATIONS[f].rendersOn -> should-render-on-this-preset
      const keys = Object.keys(FEATURES);
      const manifest = {};
      for (const f of keys) manifest[f] = { rendersOn: (ASSOCIATIONS[f] && ASSOCIATIONS[f].rendersOn) || [] };
      const expected = expectedMatrix(manifest, [preset]);
      // actual side: wrap the sweep's per-feature fraction into the auditor's shape
      const actualDeltas = {};
      for (const f of keys) actualDeltas[f] = { [preset]: sweep.deltas[f] ?? 0 };
      // auditRenderMatrix is called for parity with the report (its falseRenders/
      // deadRenders sets must agree with statusOf); pass eps EXPLICITLY — the auditor
      // default is 0.01, NOT 1e-4 (footgun). We do not consume its return directly
      // for the badge (statusOf is the per-feature source), but the explicit-eps call
      // keeps the cross-check invariant honest.
      auditRenderMatrix(expected, actualDeltas, { eps: AUDIT_EPS });   // parity call; eps explicit (spec lock #5)
      const results = {};
      for (const f of keys) {
        const should = expected[f][preset];
        const delta = sweep.deltas[f] ?? 0;
        const degenerate = sweep.degenerate[f] ?? null;
        results[f] = { status: statusOf(should, delta, degenerate), delta };
      }
      state.audit = { preset, fresh: true, results };
      return state.audit;
    }

    function applyArchetypeFilter(){
      const { set, archs } = relevantFeatureSet();
      filterUI.archetypeLabel = archs.map(a => ARCHETYPES[a].label).join(' + ') || '(none)';
      let nIrrelevant = 0;
      for (const { key, folder, parentEl } of FEATURE_LAYOUT) {
        const relevant = !filterUI.filter || set.has(key);
        if (relevant) {
          parentEl.appendChild(folder.domElement);          // back to its category, in declaration order
        } else {
          fNotRelevant.$children.appendChild(folder.domElement);
          nIrrelevant++;
        }
      }
      // lil-gui renders the disclosure arrow as a CSS pseudo-element, so setting
      // textContent is safe (doesn't clobber it).
      fNotRelevant.$title.textContent = `Not relevant to this world (${nIrrelevant})`;
      fNotRelevant.domElement.style.display = (filterUI.filter && nIrrelevant > 0) ? '' : 'none';
      syncDisplays();
      refreshAllCardStates();   // relevance/enable may have changed → update card State lines
      if (typeof refreshArchetypeInfo === 'function') refreshArchetypeInfo();   // re-derive AFTER archetypeLabel set (spec lock #9)
    }
    // ── Archetype info view (Ask 3) ───────────────────────────────────────────
    // A read-only, fully-derived explanation of WHY each feature is in this world's
    // roster. Returns the innerHTML for a plain <div> (NOT a lil-gui controller),
    // so it never perturbs syncDisplays(), the enable controllers, or the
    // reparenting relevance filter (applyArchetypeFilter() moves FEATURE folders;
    // this block lives on the World folder and is untouched by that loop).
    //
    // Header  : preset → N archetypes · M relevant features (DE-DUPED) · K enabled
    // Per arch: <label> (rosterCount) — like <bodies> ; then inline wrapping chips
    //           ● Enabled  ○ Off, each chip marked "shared" if ≥2 of THIS world's
    //           current archetypes list it (explains the M-vs-roster-sum gap).
    function archetypeInfoHtml(){
      const { set, archs } = relevantFeatureSet();          // set = de-duped keys; archs = current archetype keys
      const N = archs.length;
      const M = set.size;                                    // de-duplicated total (spec lock #1)
      let K = 0;                                             // enabled among the M relevant features only (spec lock #1)
      for (const key of set) if (state[FEATURES[key].enableKey]) K++;

      // Per-relevant-feature: how many of THIS world's current archetypes list it.
      // ≥2 → "shared" marker on its chip in each roster (spec lock #5).
      const archMembership = {};                             // key -> count among `archs`
      for (const a of archs) for (const k of featuresOf(a)) archMembership[k] = (archMembership[k] || 0) + 1;

      const presetName = driverUI.preset;
      const parts = [];
      parts.push(`<div class="ai-header">${escapeHtml(presetName)} &rarr; `
        + `${N} archetype${N === 1 ? '' : 's'} &middot; ${M} relevant feature${M === 1 ? '' : 's'} `
        + `&middot; ${K} enabled</div>`);

      if (N === 0) {
        parts.push(`<div class="ai-note">No archetype maps to this preset.</div>`);
        return parts.join('');
      }

      for (const a of archs) {
        const meta = ARCHETYPES[a];
        const roster = featuresOf(a);                        // NOT de-duped across archetypes (spec lock #2)
        parts.push(`<div class="ai-arch">`
          + `<span class="ai-arch-h">${escapeHtml(meta.label)} (${roster.length})</span>`   // per-arch count (lock #4)
          + (meta.bodies && meta.bodies.length
              ? ` <span class="ai-bodies">like ${escapeHtml(meta.bodies.join(', '))}</span>` : '')
          + `</div>`);
        const chips = roster.map(key => {
          const enabled = !!state[FEATURES[key].enableKey];
          const dot = enabled
            ? '<span class="ai-on">&#9679;</span>'           // ●
            : '<span class="ai-off">&#9675;</span>';         // ○
          const shared = (archMembership[key] || 0) >= 2;    // shared among THIS world's archetypes (lock #5)
          // short chip label: strip the trailing "(F#)" tag from FEATURES[key].label
          const name = FEATURES[key].label.replace(/\s*\(F[^)]*\)\s*$/, '');
          return `<span class="ai-chip${shared ? ' ai-shared' : ''}">`
            + `${dot} ${escapeHtml(name)}${shared ? '&middot;' : ''}</span>`;   // trailing ˙-style marker
        }).join('');
        parts.push(`<div class="ai-roster">${chips}</div>`);
      }

      parts.push(`<div class="ai-note">Header counts unique features (M=${M}); `
        + `per-archetype rosters list a feature under every archetype it belongs to, so `
        + `shared&middot; features are double-listed. K counts only enabled features relevant to this world.</div>`);
      return parts.join('');
    }
    // One 🔆 solo button per feature folder (appended below its existing controls).
    // Non-destructive: honors the current soloMode and restores prior enables on unsolo.
    for (const [key, folder] of Object.entries(featureFolders)) {
      folder.add({ solo(){ soloFeature(key); } }, 'solo').name('🔆 solo (isolate)');
    }
    // Header controls live in the top World folder: preset picker first, then
    // the derived archetype label directly beneath it, then filter/solo.
    fWorld.add(driverUI, 'preset', Object.keys(DRIVER_PRESETS)).name('preset').onChange(applyDrivers);
    const archCtrl = fWorld.add(filterUI, 'archetypeLabel').name('archetype').disable();
    // ── Archetype info block: plain DOM injected directly under the archetype field
    //    row, toggled by an ⓘ on that row (mirrors relocateEnableToTitle's injection).
    const archInfoEl = document.createElement('div');
    archInfoEl.className = 'archetype-info';                 // collapsed by default (CSS display:none)
    // Insert as the next sibling of the archetype controller's row, INSIDE the World
    // folder body, so it sits visually beneath the label it explains.
    archCtrl.domElement.insertAdjacentElement('afterend', archInfoEl);
    const archInfoBtn = document.createElement('span');
    archInfoBtn.className = 'title-info';
    archInfoBtn.textContent = 'ⓘ';
    archInfoBtn.title = 'why are these features relevant to this world?';
    archInfoBtn.addEventListener('click', e => {
      e.stopPropagation();                                  // don't disturb the disabled controller
      const opening = !archInfoEl.classList.contains('open');
      if (opening) archInfoEl.innerHTML = archetypeInfoHtml();   // build fresh on open (cheap)
      archInfoEl.classList.toggle('open');
    });
    // Append the ⓘ into the controller's NAME cell (the field's left label), after
    // the "archetype" text — the disabled widget cell stays untouched.
    (archCtrl.$name || archCtrl.domElement).appendChild(archInfoBtn);
    // Keep a single live re-render entry point used by the preset/toggle hooks below.
    function refreshArchetypeInfo(){
      if (archInfoEl.classList.contains('open')) archInfoEl.innerHTML = archetypeInfoHtml();
    }
    fWorld.add(filterUI, 'filter').name('filter to relevant').onChange(applyArchetypeFilter);
    // soloMode dropdown: context = solo + its isolationKit (dependents emerge); bare = solo alone.
    fWorld.add(filterUI, 'soloMode', ['context', 'bare']).name('solo mode').onChange(setSoloMode);
    fWorld.add({ enableAll(){ _preSoloEnables = null; _soloKey = null; setFeatureEnables(null); } }, 'enableAll').name('enable all');
    fWorld.add({ clearSolo(){ unsolo(); } }, 'clearSolo').name('clear solo (restore)');

    // ── Audit this world (Ask 4) ──────────────────────────────────────────────
    // Runs renderDeltaSweep() for the CURRENT preset, classifies every feature,
    // writes state.audit, then re-renders all badges + this summary. The sweep
    // restores auto-spin/camera/enables itself; the only UI obligation is to
    // disable the button + show "Auditing…" while it runs.
    const auditBtnProxy = { audit(){ runAuditFromButton(); } };
    const auditCtrl = fWorld.add(auditBtnProxy, 'audit').name('Audit this world');
    // Plain-DOM summary line injected directly under the button row.
    const auditSummaryEl = document.createElement('div');
    auditSummaryEl.className = 'audit-summary';
    auditCtrl.domElement.insertAdjacentElement('afterend', auditSummaryEl);

    function renderAuditSummary(){
      const a = state.audit;
      if (!a) { auditSummaryEl.classList.remove('stale'); auditSummaryEl.textContent = 'Audit: (not run)'; return; }
      const stale = !a.fresh || a.preset !== driverUI.preset;   // preset mismatch is stale (spec)
      let nFalse = 0, mDead = 0, dDegen = 0;
      for (const k of Object.keys(a.results)) {
        const s = a.results[k].status;
        if (s === '🔴F' || s === '⚠️F') nFalse++;
        else if (s === '⚠️D') mDead++;
        else if (s === '⬛') dDegen++;
      }
      auditSummaryEl.classList.toggle('stale', stale);
      const freshTag = stale ? '⚠ stale — re-audit' : '✓ fresh';
      auditSummaryEl.innerHTML = `Audit: <span class="as-false">${nFalse} false</span> &middot; `
        + `<span class="as-dead">${mDead} dead</span>`
        + (dDegen ? ` &middot; ${dDegen} degenerate` : '')
        + ` &middot; ${freshTag}`;
    }

    async function runAuditFromButton(){
      auditCtrl.disable();
      const origName = 'Audit this world';
      auditCtrl.name('Auditing…');
      try {
        await runAudit();
      } finally {
        auditCtrl.name(origName);
        auditCtrl.enable();
      }
      renderAllAuditBadges();      // defined in Task 5
      renderAuditSummary();
    }
    renderAuditSummary();          // initial "(not run)"

    // ── Auto-stale on any control change (Ask 4) ──────────────────────────────
    // lil-gui bubbles EVERY controller change to the parent GUI's onChange, so two
    // top-level hooks (guiLeft + guiRight) cover all ~47 toggles + every slider with
    // no per-controller wiring. Conservative: ANY change stales (spec lock #4 — the
    // view/camera-knob exemption is deferred/YAGNI). The _auditing guard early-returns
    // while the audit's own sweep is mutating enables, so the audit can't self-stale.
    function staleAudit(){
      if (_auditing) return;                 // the sweep's own churn — ignore (LOAD-BEARING)
      if (!state.audit) return;              // nothing to stale yet
      if (state.audit.fresh) {               // only act on the fresh->stale transition
        state.audit.fresh = false;
        renderAllAuditBadges();              // dim badges
        renderAuditSummary();                // "⚠ stale — re-audit"
      }
    }
    guiLeft.onChange(staleAudit);
    guiRight.onChange(staleAudit);

    // ▸ Seeds — macro shifts continents (octaves 0-2), detail shifts texture (3+)
    const fSeeds = guiLeft.addFolder('Seeds'); fSeeds.close();
    fSeeds.add(state, 'macroSeed', 0, 10000, 1).name('macro seed').listen().onChange(() => { updateSeedUniforms(); rebakeE5Bands(); });
    fSeeds.add(state, 'detailSeed', 0, 10000, 1).name('detail seed').listen().onChange(updateSeedUniforms);
    fSeeds.add({ newPlanet(){ state.macroSeed = (Math.random()*10000)|0; state.detailSeed = (Math.random()*10000)|0; updateSeedUniforms(); rebakeE5Bands(); } }, 'newPlanet').name('New planet (re-roll both)');

    // ▸ Presets — lil-gui save/load round-trips the whole panel as JSON
    const fPresets = guiLeft.addFolder('Presets'); fPresets.close();
    fPresets.add({ copy(){ const j = JSON.stringify(saveAll()); window._lab._lastCopied = j; navigator.clipboard?.writeText(j).catch(()=>{}); } }, 'copy').name('Copy settings (JSON)');
    fPresets.add({ reset(){ resetAll(); rebuildTarget(); updateSeedUniforms(); } }, 'reset').name('Reset to defaults');

    // ▸ F51 Rings — standalone toggle (NOT a FEATURES key — a ring is a separate mesh,
    // not a surface province, so it gets a plain checkbox, not the 🔆-solo plumbing).
    // The checkbox binds to a thin PROXY whose accessor mirrors state.ringsEnabled —
    // NOT `add(state,'ringsEnabled')` directly — because tests/planet-archetypes.test.js
    // scrapes the literal `.add(state, '<x>Enabled')` form as a "panel feature folder"
    // and asserts a matching FEATURES entry (orphan-folder guard). A ring is deliberately
    // NOT a FEATURES province, so binding through the proxy keeps state.ringsEnabled as the
    // source of truth (the §6.5 / :9223 verification key) while staying off that guard.
    const fRings = guiLeft.addFolder('Rings (F51)'); fRings.close();
    const ringsProxy = {
      get show(){ return state.ringsEnabled; },
      set show(v){ state.ringsEnabled = v; },
    };
    fRings.add(ringsProxy, 'show').name('show rings').listen();
    // F51 rings-v2 cloud tuning sliders. 4 LIVE (write the uniform on change) + 2 REBAKE.
    // The .onChange closures read the MODULE-SCOPE `ringCloud` at call time, so after a
    // rebake swaps in a new Points the live sliders still target the CURRENT cloud.
    fRings.add(state, 'ringPointScale', 50, 800, 10).name('point scale')
      .onChange(v => ringCloud.material.uniforms.uPointScale.value = v);
    fRings.add(state, 'ringDResolve', 1, 12, 0.5).name('LOD resolve dist')
      .onChange(v => ringCloud.material.uniforms.uDResolve.value = v);
    fRings.add(state, 'ringDCull', 6, 30, 0.5).name('LOD cull dist')
      .onChange(v => ringCloud.material.uniforms.uDCull.value = v);
    fRings.add(state, 'ringSizeClamp', 4, 80, 1).name('size clamp (px)')
      .onChange(v => ringCloud.material.uniforms.uSizeClamp.value = v);
    // REBAKE — count + thickness are baked attributes (dispose + rebuild). thickness max
    // capped at 0.06 to keep the ring physically thin (real rings are razor-thin).
    fRings.add(state, 'ringCount', 20000, 1000000, 20000).name('count (rebake)')
      .onChange(() => rebakeRingCloud());
    fRings.add(state, 'ringThickness', 0.002, 0.06, 0.002).name('thickness (rebake)')
      .onChange(() => rebakeRingCloud());

    applyDrivers();   // load the default driver bundle (Rocky) into the envelope uniforms

    // ─────────────────────────────────────────────────────────────────────────
    // Mouse orbit + zoom — ports src/camera/CameraController.js to the lab.
    // Left-drag => orbit (yaw/pitch); wheel => zoom (distance). Camera moves,
    // planet quaternion stays identity, so object-space light math is unchanged.
    // ─────────────────────────────────────────────────────────────────────────
    const DRAG_SENS = 0.003;          // matches CameraController.dragSensitivity
    const PITCH_LIMIT = 1.55;         // ~89°, avoid pole flip
    let dragging = false, lastX = 0, lastY = 0;
    canvas.addEventListener('pointerdown', (e) => {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      try { canvas.setPointerCapture(e.pointerId); } catch {}   // keep tracking if drag leaves canvas
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      state.yaw   -= dx * DRAG_SENS;
      state.pitch += dy * DRAG_SENS;
      state.pitch = Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, state.pitch));
    });
    const endDrag = (e) => {
      dragging = false;
      if (e.pointerId != null && canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.ctrlKey) return;   // Ctrl+wheel = browser-zoom intent; block it (preventDefault above) but don't move the camera
      // multiplicative => even feel across the range; clamp surface-skim(1.1)..overview(30)
      const factor = Math.exp(Math.sign(e.deltaY) * 0.12);
      state.distance = Math.max(1.1, Math.min(30, state.distance * factor));
    }, { passive: false });

    // ─────────────────────────────────────────────────────────────────────────
    // Copy / apply settings — serialize the live look so Max can paste it back
    // in chat and the next agent can reproduce "the settings he likes".
    // ─────────────────────────────────────────────────────────────────────────
    function settingsBlob(){
      return {
        pixelScale: state.pixelScale, octaves: state.octaves, octAuto: state.octAuto,
        levels: state.levels, perturb: state.perturb, normalMode: state.normalMode,
        fwClamp: state.fwClamp, spinSpeed: state.spinSpeed,
        macroSeed: state.macroSeed, detailSeed: state.detailSeed,
        yaw: +state.yaw.toFixed(4), pitch: +state.pitch.toFixed(4), distance: +state.distance.toFixed(2),
        lightAzimuthDeg: +state.lightAzimuthDeg.toFixed(2), lightElevationDeg: +state.lightElevationDeg.toFixed(2),
      };
    }
    // Programmatic state apply (used by chrome-devtools verification + Copy-paste round-trip).
    // Sets state keys directly, refreshes derived uniforms, then syncs the lil-gui display.
    function applySettings(o){
      if (!o) return;
      const keys = ['pixelScale','octaves','levels','perturb','distance','yaw','pitch',
                    'macroSeed','detailSeed','octAuto','fwClamp','spinSpeed','normalMode',
                    'lightAzimuthDeg','lightElevationDeg'];
      for (const k of keys) if (o[k] != null) state[k] = o[k];
      if (o.lightAzimuthDeg != null || o.lightElevationDeg != null) applyLightDir();
      if (o.pixelScale != null) rebuildTarget();
      updateSeedUniforms();
      syncDisplays();
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Loop
    // ─────────────────────────────────────────────────────────────────────────
    const hud = $('hud');
    const lightObj = new THREE.Vector3();
    const invQuat = new THREE.Quaternion();
    // F32/F33 — preallocated thermal-direction scratch (no per-frame allocations):
    // the object-space spin axis (+y; the planet spins about its local y) and the
    // rotated copy of lightObj the writer feeds uThermalDir.
    const SPIN_AXIS = new THREE.Vector3(0, 1, 0);
    const thermalObj = new THREE.Vector3();
    let t = 0;

    // Render-delta sweep freeze (Phase 2.5): when true, t + rotation stop advancing
    // so the A/B sweep isolates a feature's pixel contribution — only the enable
    // toggle changes the output, never animation or spin.
    let _sweepFreeze = false;
    function frame(){
      if (!_sweepFreeze) {
      t += 0.0025;
      planet.rotation.y += state.spinSpeed;   // 0 = stopped; 0.000375 (slider center) = the original rate
      }

      // Camera orbits the origin (yaw/pitch/distance) — mouse-driven, mirrors CameraController.
      const dist = state.distance * R;
      const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
      camera.position.set(
        dist * cp * Math.sin(state.yaw),
        dist * sp,
        dist * cp * Math.cos(state.yaw)
      );
      camera.lookAt(0, 0, 0);

      const lod = lodRampOf(state.distance);
      const oct = state.octAuto ? autoOctaves(lod) : state.octaves;
      // Discrete which-body-is-LOD2 flag, hysteresis-guarded (enter 18 / exit 22) to stop flicker.
      state._lod2Active = lodHysteresis(state.distance, state._lod2Active ?? false);

      // Light dir into object space (sphere rotates; lighting math is object-space)
      invQuat.copy(planet.quaternion).invert();
      lightObj.copy(WORLD_LIGHT).applyQuaternion(invQuat);

      uniforms.uOctaves.value = oct;
      uniforms.uLodRamp.value = lod;
      uniforms.uLevels.value = state.levels;
      // ── AC3/AC4 scale factors (computed once per frame from the live radius + gravity) ──
      // _animRate ∝ 1/radius — big worlds animate slower (lava breathing, churn, storm drift,
      // city flash). _g is the stashed surface gravity used by reliefNorm() per relief feature.
      const _RE = state.planetRadiusEarth, _gNow = state.surfaceGravity ?? 1.0;
      const _animRate = animationRateFactor(_RE);
      // AC3 global relief (perturb): the planet-wide displacement scale also tracks radius+gravity.
      uniforms.uPerturb.value = state.perturb * reliefNorm(state.mountainHeightKm, _RE, _gNow);
      uniforms.uNormalMode.value = state.normalMode;
      uniforms.uFwClamp.value = state.fwClamp ? 1 : 0;
      uniforms.uDitherMode.value = state.ditherMode;
      uniforms.uEmissive.value = state.emissive;
      // F36 sunglint — sunglintEnabled gates strength→0 (the Stage-9 spec block is
      // gated on uSpecStrength > 0, so one gate skips the whole bypass-channel term:
      // specC = vec3(0) exactly — the F36 regression contract); no-sea presets derive
      // strength 0, so the same contract holds with the enable on. Cox-Munk roughness
      // folds into BOTH writes HERE, CPU-side (card §6.5 step 4), so the lab slider
      // stays live without re-running applyDrivers: rough seas BROADEN the lobe
      // (exponent x mix(1, 0.25, r)) AND dim it (strength x mix(1, 0.45, r)).
      uniforms.uSpecStrength.value = state.sunglintEnabled
        ? state.specStrength * (1.0 - 0.55 * state.glintRoughness) : 0.0;   // ✓ enable gate
      uniforms.uGlintExp.value = state.glintBaseExp * (1.0 - 0.75 * state.glintRoughness);
      uniforms.uGlintTint.value.setRGB(state.glintTint[0], state.glintTint[1], state.glintTint[2]);
      // F34 limb glow — limbEnabled gates strength→0 (the Stage-9 rim multiplies by
      // uLimbStrength, so one gate zeroes the whole additive term and restores
      // byte-identical pre-F34 output) AND hides the F31e haze shell; airless
      // presets derive strength 0, so the same contract holds with the enable on.
      uniforms.uLimbStrength.value = state.limbEnabled ? state.limbStrength : 0.0;   // ✓ enable gate
      uniforms.uLimbExponent.value = state.limbExponent;
      uniforms.uLimbColor.value.setRGB(state.limbColor[0], state.limbColor[1], state.limbColor[2]);
      hazeShellUniforms.uShellColor.value.setRGB(state.limbColor[0], state.limbColor[1], state.limbColor[2]);
      hazeShellUniforms.uShellIntensity.value = state.limbHazeShell;
      hazeShell.visible = !!(state.limbEnabled && state.limbStrength > 0 && state.limbHazeShell > 0);

      // F51 rings — tilt the annulus with the body (axial tilt = planet spin axis),
      // feed object-space light (same lightObj the planet uses — ring shares the
      // planet's object space since it copies the quaternion), toggle visibility.
      ring.quaternion.copy(planet.quaternion);
      ringUniforms.lightDir.value.copy(lightObj);
      ring.visible = !!state.ringsEnabled;
      // F51 rings-v2 — near-tier particle cloud, same toggle/frame as the impostor.
      // Lab has no delta-time in scope; use a fixed +0.016 step for the twinkle.
      ringCloud.visible = !!state.ringsEnabled;

                    },
                    // V2-1 Slice D (AC7) — the live SHADOW probe for the E1 regime selector. Sibling of
                    // magmaProbe/stagnantLidProbe: returns the FULL computeE1 tuple for the CURRENT body
                    // {compositionClass, geodynamicRegime, label, L, Φ, V, n, m_hp, e1Seed, positionWithinRegime,
                    // (effectiveL on a seeded-'stagnant' pick)}. Prefers state._lastE1 (set at the route seam,
                    // right after the bodyDrivers bundle is built); if a route has not landed yet it recomputes
                    // ARM'S-LENGTH from state._lastBodyDrivers.condition + state.macroSeed (SAME inputs, SAME
                    // result — computeE1 is pure). DATA-ONLY: reading this never touches the render (E1 is shadow).
                    // AC7 (working-Claude): step ≥6 presets, poll state._lastBodyDrivers object identity after
                    // setPreset (route lands ~500ms later), then read e1Probe(); regime/label match the AC3 oracle.
                    e1Probe(){
                      if (state._lastE1) return state._lastE1;
                      const bd = state._lastBodyDrivers;
                      if (bd && bd.condition) return computeE1(bd.condition, state.macroSeed, _e1WeightOverride ? { weights: _e1WeightOverride } : {});
                      return null;
                    },
                    // V2-1 Slice D (AC5) — lab-only seeded-regime WEIGHT override (console/_lab API ONLY; no
                    // dat.GUI binding ⇒ no planet-archetypes.js taxonomy registration, AC-0 check 3). Mirrors
                    // _driverAbMode: replaces the FROZEN E1_REGIME_WEIGHTS base used for the in-band temperate-wet
                    // seeded pick, then re-routes so state._lastE1 refreshes. SHADOW: the override changes ONLY the
                    // E1 tuple (probe) — the render is untouched. Pass {mobile, episodic, stagnant} (un-normalized
                    // OK — computeE1 renormalizes); e1RegimeWeightsReset() restores the frozen default.
                    // Usage on :9223: _lab.e1RegimeWeights({mobile:0.1,episodic:0.1,stagnant:0.8}); _lab.e1Probe();
                    e1RegimeWeights(w){
                      if (w && typeof w === 'object') {
                        _e1WeightOverride = { mobile: +w.mobile || 0, episodic: +w.episodic || 0, stagnant: +w.stagnant || 0 };
                        ensureNetworkRouted('lab-e1RegimeWeights');
                      }
                      return _e1WeightOverride;   // null ⇒ frozen E1_REGIME_WEIGHTS in effect
                    },
                    e1RegimeWeightsReset(){ _e1WeightOverride = null; ensureNetworkRouted('lab-e1RegimeWeightsReset'); return 'reset (frozen E1_REGIME_WEIGHTS)'; },
                    // WS4 T12 — carve-EPOCH toggle for epoch-carve-visible. Off (default) = epoch 1, the
                    // uncut authored relief; on = epoch 2, drainage carved into THAT SAME substrate. It gates
                    // sampleRoutedHeight (above): ON folds perNodeIncision via applyIncision onto the routed
                    // substrate, so the per-direction readback at channel dirs DECREASES while off-channel
                    // dirs hold — the NUMERIC drop the AC requires (the cosmetic Stage-6 carveFloorCol
                    // darkening leaves height unchanged and would FAIL this readback). Usage on :9223:
                    //   _lab.setCarveEpoch(false); const off = _lab.sampleRoutedHeight(channelDirs);
                    //   _lab.setCarveEpoch(true);  const on  = _lab.sampleRoutedHeight(channelDirs);
                    //   // assert on[k] < off[k] at channel dirs, on[k] === off[k] off-channel.
                    _carveEpochOn: false,
                    setCarveEpoch(on){ this._carveEpochOn = on !== false; return this._carveEpochOn; },
                    get carveEpoch(){ return this._carveEpochOn; },
                    // WS4 T18 — UAT bundle: a DETERMINISTIC seed control so Max's :9223 walkthrough can
                    // reproduce "a couple of seeds" (plan T18) — the SAME worlds every run. The GUI
                    // "New planet" button uses Math.random and cannot land on a specific world; setSeed
                    // takes an INTEGER macroSeed (+ optional detailSeed, default = macroSeed) and threads
                    // it through the EXISTING seeded updateSeedUniforms() path: it writes uMacroOffset
                    // (which feeds BOTH the renderer AND the grain bake — D9), then the debounced
                    // route() re-routes the network + re-bakes the grain cube, exactly like a GUI reroll.
                    // No Math.random / Date.now: the integer seed is the only entropy, so same seed →
                    // same world (the reproducibility the UAT bundle promises). Usage on :9223:
                    //   _lab.setSeed(1234); _lab.grainStrength(1); _lab.setCarveEpoch(true);  // world A
                    //   _lab.setSeed(5678);                                                   // world B
                    setSeed(macro, detail){
                      state.macroSeed = (macro >>> 0);
                      state.detailSeed = (detail !== undefined ? detail : macro) >>> 0;
                      updateSeedUniforms();
                      return { macroSeed: state.macroSeed, detailSeed: state.detailSeed };
                    },
                    // Sun-direction control (lab lighting). setLightDir(azDeg, elDeg) rotates the world
                    // light; convention matches camera yaw/pitch (az from +z→+x, el above the xz-plane).
                    // Handy for features the seed-placed sun misses — e.g. the substellar magma basin,
                    // which by default faces AWAY from the sun (renders on the night side). sunToCamera()
                    // snaps the sun to the current view so whatever you're looking at is lit. Returns the
                    // world-space light dir. The GUI sliders (View & LOD) mirror these via .listen().
                    setLightDir(azDeg, elDeg){
                      if (azDeg !== undefined) state.lightAzimuthDeg = +azDeg;
                      if (elDeg !== undefined) state.lightElevationDeg = +elDeg;
                      applyLightDir();
                      return [WORLD_LIGHT.x, WORLD_LIGHT.y, WORLD_LIGHT.z];
                    },
                    sunToCamera(){
                      let azd = THREE.MathUtils.radToDeg(state.yaw) % 360; if (azd > 180) azd -= 360; if (azd < -180) azd += 360;
                      state.lightAzimuthDeg = azd;
                      state.lightElevationDeg = THREE.MathUtils.radToDeg(state.pitch);
                      applyLightDir();
                      return [WORLD_LIGHT.x, WORLD_LIGHT.y, WORLD_LIGHT.z];
                    },
                    get lightDir(){ return [WORLD_LIGHT.x, WORLD_LIGHT.y, WORLD_LIGHT.z]; },
                    // Option B river-LOD STEP 2 — bake the fine-tributary patch at the CURRENT camera + set strength.
                    // Usage: window._lab.bakeTributaryPatch({ angularDeg: 8, strength: 1 }) — bakes at the current
                    // camera direction, raises the patch strength, and returns { center,u,v,angular,segmentCount }.
                    bakeTributaryPatch(opts){
                      if (opts && opts.angularDeg !== undefined) riverOverlayState.patchAngularDeg = opts.angularDeg;
                      if (opts && opts.channelMinOrder !== undefined) riverOverlayState.patchChannelMinOrder = opts.channelMinOrder;
                      const info = bakeTributaryPatch();
                      if (opts && opts.strength !== undefined){ riverOverlayState.patchStrength = opts.strength; uniforms.uRiverCarvePatchStrength.value = opts.strength; tributaryPatch.fineRibbon.visible = opts.strength > 0; }
                      return { info, strength: uniforms.uRiverCarvePatchStrength.value };
                    },
                    get tributaryPatch(){ return tributaryPatch; },
                    deriveTributaryGridRes(){ return deriveTributaryGridRes(); },   // §3.2 gridRes probe
                    get sceneTarget(){ return sceneTarget; },
                    // ── WS4 T12-probe — the live read-out surfaces the live ACs bind to ──
                    // Built because _lab exposed state/uniforms/riverStats/sceneTarget but NO per-direction
                    // height read-back and NO per-feature strike read-out — so the live ACs would have
                    // degraded to "does the screenshot LOOK aligned/cut?", which passes on a zonal banded
                    // field that merely looks aligned, or on the cosmetic floor-darkening (Stage 6
                    // carveFloorCol) with no real height drop. These give epoch-carve-visible a NUMERIC
                    // height read-back and one-shared-grain a per-feature strike read-out.
                    //
                    // (1) sampleRoutedHeight(dirs): the ROUTED-substrate height (the ROUTER_MAIN field the
                    // carve is computed over — planet-lod-rivers.js createHeightSampler/route) at each
                    // requested world direction. NOT a rendered-chain sample (honest per plan D5c — the
                    // full rendered-chain readback is the deferred T12b). dirs = array of [x,y,z] (or
                    // THREE.Vector3). Returns a Float64Array, one height per dir, via NEAREST-mesh-node
                    // lookup (max dot product of the normalized dir with each mesh vertex). epoch-carve-
                    // visible reads channel-node dirs carve-off vs carve-on: ON must DECREASE the height.
                    sampleRoutedHeight(dirs){
                      const ov = riverOverlay;
                      const authored = ov && ov.height;   // last sampler.read() routed substrate (epoch 1, ROUTER_MAIN)
                      const mesh = ov && ov.mesh;         // { verts:[[x,y,z],…], N }
                      if (!authored || !mesh || !mesh.verts) return null;   // overlay not yet routed
                      // WS4 T12 — carve-epoch gate. epoch 1 (carve OFF) = the AUTHORED routed substrate as
                      // read. epoch 2 (carve ON) = authored + perNodeIncision folded onto a FRESH array via
                      // applyIncision (the SAME Δ≤0 law the unit ws4-carve-subtractive / ws4-epoch proved
                      // strictly subtractive). So the readback at channel dirs DROPS when the epoch is on,
                      // off-channel dirs hold — the NUMERIC gate epoch-carve-visible binds to (NOT the
                      // cosmetic Stage-6 carveFloorCol darkening, which leaves height unchanged). Honest per
                      // plan D5c: this is the ROUTER_MAIN field the carve is computed over, NOT a rendered-
                      // chain sample (that is the deferred T12b). No rng / no wall-clock entropy —
                      // applyIncision/perNodeIncision are pure, so the readback is deterministic.
                      let h = authored;
                      if (this._carveEpochOn && ov.routed){
                        const incision = perNodeIncision({ mesh, routed: ov.routed, authored, params: ov.params });
                        h = applyIncision(authored, incision);   // fresh array — epoch 1 (authored) untouched
                      }
                      const verts = mesh.verts, N = verts.length;
                      const list = Array.isArray(dirs) ? dirs : [dirs];
                      const out = new Float64Array(list.length);
                      for (let k = 0; k < list.length; k++) {
                        const d = list[k];
                        let dx = d.x !== undefined ? d.x : d[0];
                        let dy = d.y !== undefined ? d.y : d[1];
                        let dz = d.z !== undefined ? d.z : d[2];
                        const dl = Math.hypot(dx, dy, dz) || 1; dx /= dl; dy /= dl; dz /= dl;
                        let best = -2, bi = 0;            // pick the mesh node the direction points AT
                        for (let i = 0; i < N; i++) {
                          const v = verts[i];
                          const dot = v[0] * dx + v[1] * dy + v[2] * dz;
                          if (dot > best) { best = dot; bi = i; }
                        }
                        out[k] = h[bi];
                      }
                      return out;
                    },
                    // (2) probeStrike(featureKey, dir): one grained feature's EFFECTIVE sampled strike at a
                    // world direction — re-deriving the SHARED field via the pure bakeTectonicGrain (the
                    // same deriver + same neutral DEFAULT_GRAIN_DRIVERS + same state.macroSeed the overlay
                    // baked into the cube, so it is byte-identical to the cube, no rng) and blending the
                    // feature's OWN axis toward that shared strike EXACTLY like the branch-guarded shader
                    // combiner: strength>0 ? normalize(mix(uXxxAxis, sharedStrike, strength)) : uXxxAxis.
                    // So at strength 0 it returns the feature's pre-WS4 axis (features DECORRELATED), at
                    // strength 1 the shared strike (all six IDENTICAL) — the exact distinction one-shared-
                    // grain needs ("all read the cube" vs "all happen to point similar"). Orogeny is the
                    // vec2 xz special case (plan D7): its shared endpoint is the strike projected onto xz.
                    probeStrike(featureKey, dir){
                      const shared = this._sharedStrikeAt(dir);          // vec3 world strike from the field
                      if (!shared) return null;
                      const s = uniforms.uTectonicGrainStrength.value;
                      const u = uniforms;
                      const axMap = {
                        orogeny: () => new THREE.Vector3(u.uOrogenyAxis.value.x, 0, u.uOrogenyAxis.value.y), // vec2 xz
                        scarp:   () => u.uScarpAxis.value.clone(),
                        chasma:  () => u.uChasmaAxis.value[0].clone(),
                        tessera: () => u.uTesseraAxis.value[0].clone(),
                        lava:    () => u.uLavaAxis.value.clone(),
                        cryo:    () => u.uCryoRidgeAxis0.value.clone(),
                      };
                      const mk = axMap[featureKey];
                      if (!mk) return null;
                      const axis = mk().normalize();
                      if (!(s > 0)) return axis;                          // BRANCH: strength 0 ⇒ own axis verbatim
                      if (featureKey === 'orogeny') {
                        // vec2 special case: project the shared strike onto the xz-plane, mix in 2D, lift back.
                        const g = new THREE.Vector2(shared.x, shared.z); if (g.lengthSq() > 1e-12) g.normalize();
                        const a2 = new THREE.Vector2(axis.x, axis.z);
                        const m2 = a2.lerp(g, s); if (m2.lengthSq() > 1e-12) m2.normalize();
                        return new THREE.Vector3(m2.x, 0, m2.y);
                      }
                      const mixed = axis.lerp(shared.clone(), s);
                      if (mixed.lengthSq() > 1e-12) mixed.normalize();
                      return mixed;
                    },
                    // grainProbe(): the whole read-out one-shared-grain asserts over — the live strength +
                    // every grained feature's effective strike at a probe direction (default +X), plus the
                    // raw shared strike. Set strength=1, perturb the cube (reroll/re-bake), confirm ALL SIX
                    // strikes move together; at strength=0 NONE move (each is its own pre-WS4 axis). Re-
                    // derives the shared field with the overlay's mesh + the SAME drivers/macroSeed the bake
                    // used (D9: state.macroSeed feeds both uMacroOffset and the grain bake).
                    grainProbe(dir){
                      const probeDir = dir || [1, 0, 0];
                      const shared = this._sharedStrikeAt(probeDir);
                      if (!shared) return null;
                      const sv = (v) => v ? [v.x, v.y, v.z] : null;
                      return {
                        strength: uniforms.uTectonicGrainStrength.value,
                        macroSeed: state.macroSeed,
                        dir: (probeDir.x !== undefined) ? [probeDir.x, probeDir.y, probeDir.z] : probeDir.slice(),
                        sharedStrike: sv(shared),
                        // all six grained features (orogeny / chasma / scarp / tessera / lava / cryo): a
                        // missing or independent one fails one-shared-grain.
                        orogeny: sv(this.probeStrike('orogeny', probeDir)),
                        chasma:  sv(this.probeStrike('chasma',  probeDir)),
                        scarp:   sv(this.probeStrike('scarp',   probeDir)),
                        tessera: sv(this.probeStrike('tessera', probeDir)),
                        lava:    sv(this.probeStrike('lava',    probeDir)),
                        cryo:    sv(this.probeStrike('cryo',    probeDir)),
                      };
                    },
                    // Internal: the shared per-node world strike at a direction, re-derived from the field
                    // the cube holds (bakeTectonicGrain — pure, macroSeed-only entropy, no Math.random /
                    // Date.now), via the SAME nearest-mesh-node lookup as sampleRoutedHeight.
                    _sharedStrikeAt(dir){
                      const ov = riverOverlay;
                      const mesh = ov && ov.mesh;
                      if (!mesh || !mesh.verts) return null;
                      const grain = bakeTectonicGrain({ mesh, drivers: DEFAULT_GRAIN_DRIVERS, macroSeed: state.macroSeed });
                      const verts = mesh.verts, N = verts.length;
                      let dx = dir.x !== undefined ? dir.x : dir[0];
                      let dy = dir.y !== undefined ? dir.y : dir[1];
                      let dz = dir.z !== undefined ? dir.z : dir[2];
                      const dl = Math.hypot(dx, dy, dz) || 1; dx /= dl; dy /= dl; dz /= dl;
                      let best = -2, bi = 0;
                      for (let i = 0; i < N; i++) {
                        const v = verts[i];
                        const dot = v[0] * dx + v[1] * dy + v[2] * dz;
                        if (dot > best) { best = dot; bi = i; }
                      }
                      return new THREE.Vector3(grain.strikeWorldX[bi], grain.strikeWorldY[bi], grain.strikeWorldZ[bi]);
                    },
                    // AC2 parity probe — the baked RELIEF height at a direction, re-derived from the SAME pure
                    // field the cube holds. Mirrors _sharedStrikeAt: rebuild the carrier route() baked
                    // (makeSphereField → writeGrainSphere → writeHeightSphere) with the SAME inputs route()
                    // uses (mesh, DEFAULT_GRAIN_DRIVERS, heightSeed='e6:'+macroSeed — see rivers.js:1097-1100),
                    // then nearest-mesh-node lookup (max dot, identical to sampleRoutedHeight). Pure: no
                    // Math.random / Date.now (writeHeightSphere's only entropy is the seed). Returns the scalar
                    // height the relief cube's R channel should hold at that direction — the cube-sample == data
                    // assertion the AC2 strength-1 parity check reads.
                    _bakedReliefAt(dir){
                      const ov = riverOverlay;
                      const mesh = ov && ov.mesh;
                      if (!mesh || !mesh.verts) return null;
                      const heightSeed = 'e6:' + (state.macroSeed | 0);
                      const carrier = makeSphereField(mesh);
                      writeGrainSphere(carrier, DEFAULT_GRAIN_DRIVERS);                                   // precondition: grain before height
                      writeHeightSphere(carrier, {}, DEFAULT_GRAIN_DRIVERS, { name: 'tectonic-build' }, heightSeed);
                      const verts = mesh.verts, N = verts.length;
                      let dx = dir.x !== undefined ? dir.x : dir[0];
                      let dy = dir.y !== undefined ? dir.y : dir[1];
                      let dz = dir.z !== undefined ? dir.z : dir[2];
                      const dl = Math.hypot(dx, dy, dz) || 1; dx /= dl; dy /= dl; dz /= dl;
                      let best = -2, bi = 0;
                      for (let i = 0; i < N; i++) {
                        const v = verts[i];
                        const dot = v[0] * dx + v[1] * dy + v[2] * dz;
                        if (dot > best) { best = dot; bi = i; }
                      }
                      return carrier.height[bi];
                    } };

    // ── HOT-RELOAD SCENARIO PERSISTENCE (2026-06-10) ──
    // Vite full-reloads this page on ANY edit to it, silently resetting preset/solo/
    // distance mid-verification (Phase-4a cost: A/B diffs measured against a reset page).
    // sessionStorage is per-tab: it survives reloads in the SAME tab (the failure mode)
    // but a fresh tab still boots to defaults. Opt out / clear: load with ?fresh=1.
    // saveAll()/gui.load round-trips every GUI-bound value (enables, knobs, preset,
    // distance); gui.load fires onChange handlers, so preset re-applies drivers and
    // pixelScale rebuilds the target — same side effects as hand-setting them.
    const SCENARIO_KEY = 'lodlab-scenario';
    const saveScenario = () => {
      try { sessionStorage.setItem(SCENARIO_KEY, JSON.stringify(saveAll())); } catch (e) {}
    };
    window.addEventListener('pagehide', saveScenario);       // fires on Vite reload
    window.addEventListener('beforeunload', saveScenario);   // belt-and-braces
    (function restoreScenario(){
      if (new URLSearchParams(location.search).has('fresh')) {
        sessionStorage.removeItem(SCENARIO_KEY); return;
      }
      let o = null;
      try { o = JSON.parse(sessionStorage.getItem(SCENARIO_KEY)); } catch (e) {}
      if (!o) return;
      try {
        // saveAll() merges both panels' controllers/folders; lil-gui load() ignores
        // entries it doesn't own, so feeding the merged blob to each panel restores both.
        guiLeft.load(o); guiRight.load(o);
        updateSeedUniforms(); syncDisplays();
        console.log('[lodlab] scenario restored from sessionStorage (use ?fresh=1 for defaults)');
      } catch (e) { console.warn('[lodlab] scenario restore failed — defaults kept', e); }
    })();
  </script>
