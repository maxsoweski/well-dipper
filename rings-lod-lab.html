<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RINGS LOD LAB — F51 harness scaffold</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #05060a; }
    #canvas { display: block; width: 100vw; height: 100vh; }

    #hud {
      position: fixed; top: 10px; left: 12px;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #b7c4d6; white-space: pre; pointer-events: none;
      text-shadow: 0 1px 2px #000;
    }

    #panel {
      position: fixed; top: 10px; right: 12px; width: 230px;
      background: rgba(10, 14, 22, 0.82);
      border: 1px solid #243043; border-radius: 6px;
      padding: 10px 12px; color: #cdd7e6;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #panel h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.04em; color: #8fb0ff; }
    #panel label { display: block; margin: 8px 0 2px; color: #9fb0c6; }
    #panel .val { color: #e8eefc; }
    #panel input[type=range] { width: 100%; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud"></div>
  <div id="panel">
    <h2>RINGS LOD LAB — scaffold</h2>
    <label>distance <span class="val" id="vDistance"></span></label>
    <input type="range" id="sDistance" min="1.1" max="30" step="0.1" />
    <label>pitch (0 face-on … 1.5 edge-on) <span class="val" id="vPitch"></span></label>
    <input type="range" id="sPitch" min="0" max="1.5" step="0.01" />
    <label>pixelScale ÷ <span class="val" id="vPixelScale"></span></label>
    <input type="range" id="sPixelScale" min="1" max="6" step="1" />
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { generateRingPhysics } from './src/generation/PhysicsEngine.js';   // F51 rings — CPU-side physics chain
    import { bakeRingCloud, makeRingCloudPoints } from './ring-particle-cloud.js';   // F51 Task 5 — near-tier LOD particle cloud

    // ─────────────────────────────────────────────────────────────────────────
    // Renderer / scene / camera  (house pattern — planet-lod-lab.html L116-126)
    // ─────────────────────────────────────────────────────────────────────────
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x05060a);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05060a);
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 5000);

    const R = 1.0;                                  // planet radius (object space)
    const WORLD_LIGHT = new THREE.Vector3(0.6, 0.35, 0.7).normalize();

    // ─────────────────────────────────────────────────────────────────────────
    // Planet — plain sphere to occlude/shadow the ring against. No real lighting.
    // ─────────────────────────────────────────────────────────────────────────
    const planet = new THREE.Mesh(
      new THREE.SphereGeometry(R, 128, 128),
      new THREE.MeshBasicMaterial({ color: 0x335577 })
    );
    scene.add(planet);

    // ─────────────────────────────────────────────────────────────────────────
    // Starfield backdrop — ~2000 random points on a large far sphere, so
    // dither-translucency of the ring against stars is checkable in later tasks.
    // ─────────────────────────────────────────────────────────────────────────
    const STAR_COUNT = 2000;
    const STAR_RADIUS = 2000;                       // well inside camera.far (5000)
    const starPositions = new Float32Array(STAR_COUNT * 3);
    for (let i = 0; i < STAR_COUNT; i++) {
      // uniform-ish point on a sphere shell
      const u = Math.random() * 2 - 1;              // cos(theta)
      const phi = Math.random() * Math.PI * 2;
      const s = Math.sqrt(1 - u * u);
      starPositions[i * 3 + 0] = STAR_RADIUS * s * Math.cos(phi);
      starPositions[i * 3 + 1] = STAR_RADIUS * u;
      starPositions[i * 3 + 2] = STAR_RADIUS * s * Math.sin(phi);
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMat = new THREE.PointsMaterial({
      color: 0xffffff, size: 2, sizeAttenuation: false, depthWrite: false,
    });
    const starfield = new THREE.Points(starGeo, starMat);
    starfield.frustumCulled = false;
    scene.add(starfield);

    // ─────────────────────────────────────────────────────────────────────────
    // F51 RINGS — v1 impostor annulus (flat-shader far tier).
    // Ported VERBATIM from planet-lod-lab.html L4456-4695. In production this
    // mesh is toggled (state.ringsEnabled); in this harness it is the always-on
    // FAR tier (ring.visible = true). Task 5 adds the particle cloud on top.
    //
    // Builds the production _createRing() envelope (Planet.js:1105-1235) — RingGeometry
    // in the equatorial plane, planet-shadow cylinder test, Bayer dither-discard alpha,
    // 6-level posterize — but SWAPS the fake-sine band body for the dead RingRenderer.js
    // physics-driven ringlet/gap loop (RingRenderer.js:208-235), fed CPU-side by
    // generateRingPhysics() with a synthetic params bundle (one inner moon → outer-edge
    // clip + a 2:1 Cassini-class gap). Adds the ONE new term §4 wants: an fwidth(t)
    // band-limit clamp so fine ringlets fade to their mean at grazing angles instead of
    // moiréing against the 4×4 Bayer grid. All identifiers prefixed uRing*/ring* — NO
    // GLSL reserved words (esp. NOT `partition`, the acute trap for ring code).
    // ─────────────────────────────────────────────────────────────────────────
    const RING_MAX_RINGLETS = 16;
    const RING_MAX_GAPS = 8;
    const RING_COMPOSITION_COLORS = {   // RingRenderer.js:28-33
      ice:   [0.85, 0.92, 0.98],
      rock:  [0.35, 0.32, 0.30],
      dust:  [0.55, 0.45, 0.35],
      mixed: [0.60, 0.58, 0.55],
    };

    // Synthetic params bundle (§6.5 host-preset step): origin 'roche', a density pair,
    // an ageGyr, and ONE synthetic inner moon (orbit = 9 planet radii) that both clips
    // the outer edge and carves a 2:1 resonance gap inside the annulus. planetRadiusEarth=1
    // so the physics' radii-in-planet-radii equal lab object-space units (lab R = 1.0).
    function makeRingPhysics() {
      return generateRingPhysics({
        origin: 'roche',
        planetDensity: 5500,
        planetRadiusEarth: 1,
        ageGyr: 0.3,                     // young → dense disk (ageFactor near 1)
        axialTilt: 0,
        // Inner moon at 9 R_p: clips outer edge to ~8.2 R_p AND lands a 2:1 (Cassini-class,
        // dominant) gap at ~5.7 R_p plus a finer 3:1 gap at ~4.3 R_p INSIDE the annulus →
        // generateRingPhysics partitions the disk into 3 discrete ringlets (UAT: 3-5 bands +
        // one dominant gap). (Icy Roche limit ~4.15 R_p pushes the disk out, so the moon must
        // sit far enough that its resonances fall above that inner edge.)
        moons: [{ orbitRadiusEarth: 9.0, radiusEarth: 1 }],
        rngFloat1: 0.3, rngFloat2: 0.5, rngFloat3: 0.6, rngFloat4: 0.2, rngFloat5: 0.5,
      });
    }
    const ringPhysics = makeRingPhysics();

    // Flatten ringlets[]/gaps[] into the Float32Array layout RingRenderer builds
    // (RingRenderer.js:69-101). Lab R = 1.0, so multiply by R (= identity) for clarity.
    const ringletInnerR  = new Float32Array(RING_MAX_RINGLETS);
    const ringletOuterR  = new Float32Array(RING_MAX_RINGLETS);
    const ringletOpacity = new Float32Array(RING_MAX_RINGLETS);
    const ringletColors  = new Float32Array(RING_MAX_RINGLETS * 3);
    let ringletCount = 0;
    for (let i = 0; i < ringPhysics.ringlets.length && ringletCount < RING_MAX_RINGLETS; i++) {
      const rl = ringPhysics.ringlets[i];
      if (rl.outerR - rl.innerR < 0.001) continue;
      const j = ringletCount;
      ringletInnerR[j]  = R * rl.innerR;
      ringletOuterR[j]  = R * rl.outerR;
      // PRESENTATIONAL OPACITY LIFT + ALTERNATING CONTRAST (UAT item 2): physics opacities
      // (~0.45/0.52/0.58) sit close together × density ~0.64 → effective ~0.29-0.37, which
      // reads as a smooth radial gradient rather than discrete ringlets after the 6-level
      // posterize. We (a) lift the base so the dense bands read solidly, and (b) push adjacent
      // ringlets apart in density (odd brighter / even dimmer) so the band BOUNDARIES register
      // as discrete light/dark steps. Physics ORDERING is preserved (this only amplifies).
      const baseOp = rl.opacity * (ringPhysics.density ?? 1.0);
      const altContrast = (j % 2 === 0) ? 1.15 : 0.78;   // discrete light/dark banding
      ringletOpacity[j] = Math.min(1.0, baseOp * 1.6 * altContrast);
      const c = RING_COMPOSITION_COLORS[rl.composition] || RING_COMPOSITION_COLORS.mixed;
      ringletColors[j*3] = c[0]; ringletColors[j*3+1] = c[1]; ringletColors[j*3+2] = c[2];
      ringletCount++;
    }
    const ringGapCenters = new Float32Array(RING_MAX_GAPS);
    const ringGapWidths  = new Float32Array(RING_MAX_GAPS);
    let ringGapCount = 0;
    // PRESENTATIONAL GAP-WIDTH BOOST (UAT item 3): the physics gap widths (~0.035 R_p
    // for the dominant 2:1, ~0.02 for the finer 3:1) are physically faithful but
    // sub-Bayer-cell at this stylized scale, so the dominant Cassini-analog clearing
    // never registers against the 4×4 dither. We widen the clearings for read WITHOUT
    // touching the upstream physics: the WIDEST physics gap is the dominant one (2:1
    // resonance carves the most), so it gets the larger boost → ONE commanding gap,
    // thinner ones stay subordinate. Half-falloff in R_p; visible clearing ≈ 2×.
    const ringGapsSorted = ringPhysics.gaps
      .map((g, idx) => ({ ...g, idx }))
      .sort((a, b) => b.width - a.width);   // widest (dominant) first
    for (let k = 0; k < ringGapsSorted.length && ringGapCount < RING_MAX_GAPS; k++) {
      const g = ringGapsSorted[k];
      ringGapCenters[ringGapCount] = R * g.radius;
      // Dominant gap (k===0) → ~0.34 R_p half-width (commanding Cassini clearing);
      // subordinate gaps → ~0.12 R_p (crisp but clearly thinner, appear up close).
      const boostHalfWidth = (k === 0) ? 0.34 : 0.12;
      ringGapWidths[ringGapCount] = R * boostHalfWidth;
      ringGapCount++;
    }

    const ringInnerR = R * ringPhysics.innerRadius;
    const ringOuterR = R * ringPhysics.outerRadius;

    const ringUniforms = {
      ringColor1:   { value: new THREE.Vector3(...ringPhysics.color1) },
      ringColor2:   { value: new THREE.Vector3(...ringPhysics.color2) },
      ringOpacity:  { value: 1.0 },
      innerRadius:  { value: ringInnerR },
      outerRadius:  { value: ringOuterR },
      lightDir:     { value: new THREE.Vector3().copy(WORLD_LIGHT) },   // object-space, written per-frame
      planetRadius: { value: R },
      uRingletCount:   { value: ringletCount },
      uRingletInnerR:  { value: ringletInnerR },
      uRingletOuterR:  { value: ringletOuterR },
      uRingletOpacity: { value: ringletOpacity },
      uRingletColors:  { value: ringletColors },
      uGapCount:    { value: ringGapCount },
      uGapCenters:  { value: ringGapCenters },
      uGapWidths:   { value: ringGapWidths },
      uRingMeanDensity: { value: ringPhysics.density ?? 0.5 },   // disk-wide baseline for the fwidth band-limit fade
    };

    const ringMat = new THREE.ShaderMaterial({
      side: THREE.DoubleSide,
      transparent: true,
      depthWrite: false,
      uniforms: ringUniforms,
      vertexShader: /* glsl */ `
        #include <common>
        #include <logdepthbuf_pars_vertex>
        varying vec3 vPos;
        varying vec3 vRelWorldPos;
        void main() {
          vPos = position;
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vec3 planetCenter = (modelMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
          vRelWorldPos = worldPos.xyz - planetCenter;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          #include <logdepthbuf_vertex>
        }
      `,
      fragmentShader: /* glsl */ `
        #include <logdepthbuf_pars_fragment>
        uniform vec3 ringColor1;
        uniform vec3 ringColor2;
        uniform float ringOpacity;
        uniform float innerRadius;
        uniform float outerRadius;
        uniform vec3 lightDir;
        uniform float planetRadius;

        const int RING_MAX_RINGLETS = ${RING_MAX_RINGLETS};
        uniform int uRingletCount;
        uniform float uRingletInnerR[${RING_MAX_RINGLETS}];
        uniform float uRingletOuterR[${RING_MAX_RINGLETS}];
        uniform float uRingletOpacity[${RING_MAX_RINGLETS}];
        uniform float uRingletColors[${RING_MAX_RINGLETS * 3}];

        const int RING_MAX_GAPS = ${RING_MAX_GAPS};
        uniform int uGapCount;
        uniform float uGapCenters[${RING_MAX_GAPS}];
        uniform float uGapWidths[${RING_MAX_GAPS}];
        uniform float uRingMeanDensity;

        varying vec3 vPos;
        varying vec3 vRelWorldPos;

        float bayerDither(vec2 coord) {
          vec2 p = mod(floor(coord), 4.0);
          float t = 0.0;
          if (p.y < 0.5) {
            t = (p.x < 0.5) ? 0.0 : (p.x < 1.5) ? 8.0 : (p.x < 2.5) ? 2.0 : 10.0;
          } else if (p.y < 1.5) {
            t = (p.x < 0.5) ? 12.0 : (p.x < 1.5) ? 4.0 : (p.x < 2.5) ? 14.0 : 6.0;
          } else if (p.y < 2.5) {
            t = (p.x < 0.5) ? 3.0 : (p.x < 1.5) ? 11.0 : (p.x < 2.5) ? 1.0 : 9.0;
          } else {
            t = (p.x < 0.5) ? 15.0 : (p.x < 1.5) ? 7.0 : (p.x < 2.5) ? 13.0 : 5.0;
          }
          return t / 16.0;
        }

        vec3 posterize(vec3 color, float levels, vec2 fragCoord, float edgeWidth) {
          float dither = bayerDither(fragCoord) - 0.5;
          vec3 dithered = color + dither * edgeWidth / levels;
          return floor(dithered * levels + 0.5) / levels;
        }

        void main() {
          #include <logdepthbuf_fragment>
          float dist = length(vPos.xz);
          float ringT = (dist - innerRadius) / (outerRadius - innerRadius);

          // ── Band-limit clamp (§4, the one new term) ──────────────────────────
          // The radial sampling rate in normalized-t units; at grazing angles a single
          // pixel spans many ringlets, so fwidth(ringT) blows up and we cross-fade fine
          // bands toward their mean instead of moiréing against the 4×4 Bayer grid.
          float ringBandLimit = clamp(fwidth(ringT) * 8.0, 0.0, 1.0);

          // ── Physics-driven ringlet/gap body (resurrected RingRenderer.js:208-235) ──
          float density = 0.0;
          vec3 color = ringColor1;   // fallback
          for (int i = 0; i < RING_MAX_RINGLETS; i++) {
            if (i >= uRingletCount) break;
            if (dist >= uRingletInnerR[i] && dist <= uRingletOuterR[i]) {
              float rlT = (dist - uRingletInnerR[i]) / max(0.001, uRingletOuterR[i] - uRingletInnerR[i]);
              float edgeFade = smoothstep(0.0, 0.08, rlT) * (1.0 - smoothstep(0.92, 1.0, rlT));
              density = max(density, uRingletOpacity[i] * edgeFade);
              int ci = i * 3;
              color = vec3(uRingletColors[ci], uRingletColors[ci + 1], uRingletColors[ci + 2]);
            }
          }
          // Resonance / shepherd gaps (smoothstep clearing)
          for (int i = 0; i < RING_MAX_GAPS; i++) {
            if (i >= uGapCount) break;
            float gapDist = abs(dist - uGapCenters[i]);
            density *= smoothstep(0.0, uGapWidths[i], gapDist);
          }
          // Fade the per-ringlet density toward the disk-wide baseline as bands become
          // sub-pixel (grazing); preserves the dominant gap, kills the fine-band shimmer.
          density = mix(density, uRingMeanDensity, ringBandLimit);

          float alpha = density * ringOpacity;

          // Fade at inner and outer edges
          alpha *= smoothstep(0.0, 0.08, ringT) * (1.0 - smoothstep(0.92, 1.0, ringT));

          // Planet shadow on ring — analytic cylinder test (Planet.js:1214-1223)
          float shadowDist = length(cross(vRelWorldPos, lightDir));
          float behindPlanet = step(dot(vRelWorldPos, lightDir), 0.0);
          float inShadow = behindPlanet * (1.0 - smoothstep(planetRadius * 0.9, planetRadius * 1.1, shadowDist));
          float ringLight = 1.0 - inShadow;
          color *= ringLight;
          alpha *= mix(0.15, 1.0, ringLight);   // shadow drops alpha so stars show through

          if (bayerDither(gl_FragCoord.xy) > alpha) discard;

          color = posterize(color, 6.0, gl_FragCoord.xy, 0.4);
          gl_FragColor = vec4(color, 1.0);
        }
      `,
    });
    const ringGeo = new THREE.RingGeometry(ringInnerR, ringOuterR, 64);
    ringGeo.rotateX(Math.PI / 2);   // XY → XZ equatorial plane
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.visible = true;   // HARNESS: always-on far tier (production toggles via state.ringsEnabled)
    scene.add(ring);

    // ─────────────────────────────────────────────────────────────────────────
    // F51 Task 5 — NEAR-TIER particle cloud, layered on top of the impostor.
    // Baked from the SAME ringPhysics the impostor draws → it inherits the banded
    // ringlet/gap structure, so the cloud↔impostor seam stays invisible. Per-particle
    // the shader sizes + fades by camera distance (full near dResolve, zero beyond
    // dCull) → on approach the impostor resolves into a field of glinting particles;
    // far away the cloud fades to nothing, leaving the flat impostor alone (no pop).
    //
    // ORIENTATION: the baker writes x = r·cos θ, z = r·sin θ, y = thickness → particles
    // are ALREADY in the XZ equatorial plane, the SAME plane the impostor lies in
    // (RingGeometry .rotateX(π/2)). So the cloud is added with NO rotation and NO extra
    // transform — both centered on the planet at the origin, same frame.
    // `let` (not const) so the rebake helper can dispose + swap them live.
    // ─────────────────────────────────────────────────────────────────────────
    // Tuned at the Task-5 visual gate (:9223): thickness is the richness lever —
    // 0.02 read as a thin sparse sheet; ~0.14 gives the field real 3D depth/parallax
    // on a close flyby. count is secondary (80k→250k barely moved it); 160k is ample.
    // dResolve/dCull/pointScale/sizeClamp left at plan defaults for Max to fine-tune in UAT.
    let ringBaked = bakeRingCloud(ringPhysics, {
      count: 160000, R: R, thickness: 0.14,
    });
    let ringCloud = makeRingCloudPoints(ringBaked, {
      pointScale: 300, dResolve: 4.0, dCull: 14.0, planetRadius: R,
      lightDir: [WORLD_LIGHT.x, WORLD_LIGHT.y, WORLD_LIGHT.z],
    });
    ringCloud.visible = true;
    scene.add(ringCloud);   // centered on planet (origin), same XZ plane as the impostor — NOT rotated

    // ─────────────────────────────────────────────────────────────────────────
    // State + controls (plain DOM sliders)
    // ─────────────────────────────────────────────────────────────────────────
    const state = {
      distance: 12.0,     // camera distance in radii
      pitch: 0.3,         // 0 = face-on (top-down on ring plane), ~1.5 = edge-on
      pixelScale: 3,      // low-res buffer divisor (matches production RetroRenderer)
    };

    function bindSlider(id, key, valId) {
      const slider = document.getElementById(id);
      const valEl = document.getElementById(valId);
      slider.value = state[key];
      const sync = () => {
        state[key] = parseFloat(slider.value);
        valEl.textContent = state[key].toFixed(key === 'pixelScale' ? 0 : 2);
        if (key === 'pixelScale') rebuildTarget();
      };
      slider.addEventListener('input', sync);
      sync();
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Low-res render target + nearest-upscale blit — FAITHFUL to production.
    // Ported from planet-lod-lab.html L4709-4743 + render loop L7483-7499.
    // Renders the scene into a low-res NearestFilter buffer, then nearest-
    // upscales to the screen. (Later tasks add the ring impostor whose dither
    // cells must be judged at this true on-screen scale.)
    // ─────────────────────────────────────────────────────────────────────────
    let sceneTarget = null;
    function rebuildTarget() {
      const w = Math.max(1, Math.ceil(window.innerWidth  / state.pixelScale));
      const h = Math.max(1, Math.ceil(window.innerHeight / state.pixelScale));
      if (sceneTarget) sceneTarget.dispose();
      sceneTarget = new THREE.WebGLRenderTarget(w, h, {
        minFilter: THREE.NearestFilter,
        magFilter: THREE.NearestFilter,
        depthBuffer: true,
      });
      blitMat.uniforms.tDiffuse.value = sceneTarget.texture;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      return { w, h };
    }

    // Fullscreen nearest blit (mirrors RetroRenderer._setupComposite, minimal)
    const blitMat = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null } },
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
      `,
      fragmentShader: /* glsl */ `
        uniform sampler2D tDiffuse;
        varying vec2 vUv;
        void main(){ gl_FragColor = texture2D(tDiffuse, vUv); }
      `,
      depthTest: false, depthWrite: false,
    });
    const blitScene = new THREE.Scene();
    const blitMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blitMat);
    blitMesh.frustumCulled = false;
    blitScene.add(blitMesh);
    const blitCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    // ─────────────────────────────────────────────────────────────────────────
    // Camera positioning convention:
    //   pitch = 0    → camera high on +Y, looking straight down the ring plane
    //                  (ring face-on / top-down).
    //   pitch ≈ 1.5  → camera near the XZ plane, looking edge-on at the ring.
    //   y = distance * cos(pitch)  (full height at pitch 0)
    //   z = distance * sin(pitch)  (in-plane offset at pitch 1.5)
    // Ring plane is the XZ plane (planet at origin); this gives a clean
    // face-on→edge-on sweep as pitch goes 0 → 1.5.
    // ─────────────────────────────────────────────────────────────────────────
    function updateCamera() {
      const d = state.distance;
      const p = state.pitch;
      camera.position.set(0, d * Math.cos(p), d * Math.sin(p));
      camera.up.set(0, 1, 0);
      camera.lookAt(0, 0, 0);
    }

    const hud = document.getElementById('hud');
    function updateHud() {
      hud.textContent =
        `dist/radius : ${state.distance.toFixed(1)}\n` +
        `pitch       : ${state.pitch.toFixed(2)}  (0 face-on … 1.5 edge-on)\n` +
        `pixelScale  : ÷${state.pixelScale}  (cell ≈ ${state.pixelScale}px)`;
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Render loop — Pass 1: scene → low-res buffer; Pass 2: nearest blit → screen
    // ─────────────────────────────────────────────────────────────────────────
    let lastT = performance.now();
    function frame() {
      const now = performance.now();
      // Clamp dt so a long stall (tab backgrounded, first frame) doesn't spike the
      // twinkle phase. 0.1s ceiling ≈ 10fps floor — plenty for a per-frame phase advance.
      const dt = Math.min((now - lastT) / 1000, 0.1);
      lastT = now;

      updateCamera();
      updateHud();

      // F51 — per-frame object-space light dir (mirror planet-lod-lab.html L7039).
      // The harness ring is un-rotated (planet at origin, no quaternion), so object
      // space == world space → WORLD_LIGHT (already normalized) writes directly.
      ringUniforms.lightDir.value.copy(WORLD_LIGHT);

      // F51 Task 5 — advance the cloud's twinkle phase. References the module-scope
      // `ringCloud` (closure binding, NOT a captured local), so after rebake() swaps
      // in a new Points the write lands on the CURRENT cloud's material.
      ringCloud.material.uniforms.uTime.value += dt;

      renderer.setRenderTarget(sceneTarget);
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
      renderer.render(blitScene, blitCamera);

      requestAnimationFrame(frame);
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Wire up controls, build the target, start the loop
    // ─────────────────────────────────────────────────────────────────────────
    bindSlider('sDistance', 'distance', 'vDistance');
    bindSlider('sPitch', 'pitch', 'vPitch');
    bindSlider('sPixelScale', 'pixelScale', 'vPixelScale');

    rebuildTarget();
    frame();

    window.addEventListener('resize', () => {
      rebuildTarget();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Expose for chrome-devtools evaluate_script (drive state, read a frame)
    window._rlab = { state, camera, scene, THREE, planet, starfield, rebuildTarget, ring, ringUniforms, ringPhysics };

    // F51 Task 5 — live cloud tuning controls (no page reload needed). Getters return
    // the CURRENT cloud/baked even after a rebake swap. The coordinator drives these
    // from chrome-devtools on :9223 for the Step 4/5 visual gate + tuning sweep.
    window._rlab.ring = {
      get cloud() { return ringCloud; },
      get impostor() { return ring; },
      get baked() { return ringBaked; },
      setLOD(dResolve, dCull) {
        ringCloud.material.uniforms.uDResolve.value = dResolve;
        ringCloud.material.uniforms.uDCull.value = dCull;
      },
      setPointScale(s) { ringCloud.material.uniforms.uPointScale.value = s; },
      setSizeClamp(s) { ringCloud.material.uniforms.uSizeClamp.value = s; },
      setCloudVisible(v) { ringCloud.visible = !!v; },
      setImpostorVisible(v) { ring.visible = !!v; },
      // EXTRA: re-bake the cloud with new count/thickness/sizeMin/sizeMax and swap it in
      // live. Lets the coordinator sweep particle DENSITY/THICKNESS/SIZE for the Step 5
      // decision gate (does ~80k STATIC points resolve as individuals at d≈4?) without a
      // reload. Carries the live LOD/size uniform values across the swap. Returns new count.
      rebake(opts = {}) {
        const merged = Object.assign({ count: ringBaked.count, R: R, thickness: 0.14 }, opts);
        const oldLOD = {
          dResolve: ringCloud.material.uniforms.uDResolve.value,
          dCull: ringCloud.material.uniforms.uDCull.value,
          pointScale: ringCloud.material.uniforms.uPointScale.value,
          sizeClamp: ringCloud.material.uniforms.uSizeClamp.value,
        };
        scene.remove(ringCloud);
        ringCloud.geometry.dispose();
        ringCloud.material.dispose();
        ringBaked = bakeRingCloud(ringPhysics, merged);
        ringCloud = makeRingCloudPoints(ringBaked, {
          pointScale: oldLOD.pointScale, dResolve: oldLOD.dResolve, dCull: oldLOD.dCull,
          planetRadius: R, lightDir: [WORLD_LIGHT.x, WORLD_LIGHT.y, WORLD_LIGHT.z], sizeClamp: oldLOD.sizeClamp,
        });
        ringCloud.visible = true;
        scene.add(ringCloud);
        return ringBaked.count;
      },
    };
  </script>
</body>
</html>
