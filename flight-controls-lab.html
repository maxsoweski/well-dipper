<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Controls Lab — SupercruiseModel + HeadMount test bed</title>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #000;
      color: #0f0;
      font-family: 'DotGothic16', monospace;
      overflow: hidden;
    }
    canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }

    /* center reticle, mirrors the in-game HUD cross so we can eyeball drift */
    #reticle {
      position: fixed; top: 50%; left: 50%;
      width: 22px; height: 22px;
      margin: -11px 0 0 -11px;
      pointer-events: none; z-index: 15;
    }
    #reticle::before, #reticle::after {
      content: ''; position: absolute; background: rgba(0,255,0,0.55);
    }
    #reticle::before { left: 50%; top: 0; width: 1px; height: 100%; margin-left: -0.5px; }
    #reticle::after  { top: 50%; left: 0; height: 1px; width: 100%; margin-top: -0.5px; }

    #hud {
      position: fixed; top: 12px; left: 12px;
      font-size: 13px; line-height: 1.6;
      text-shadow: 0 0 8px #000, 0 0 16px #000;
      pointer-events: none; z-index: 10;
      white-space: pre;
    }
    #fps {
      position: fixed; top: 12px; right: 12px;
      font-size: 14px; color: #0f0;
      text-shadow: 0 0 8px #000;
      z-index: 10;
    }

    #panel {
      position: fixed; bottom: 12px; left: 12px;
      background: rgba(0, 0, 0, 0.72);
      border: 1px solid rgba(0, 255, 0, 0.35);
      padding: 10px 12px;
      font-size: 12px; line-height: 1.9;
      z-index: 10;
      max-width: 380px;
      border-radius: 3px;
    }
    #panel .group { margin-bottom: 8px; }
    #panel .group-title {
      color: #0a0; font-size: 10px; letter-spacing: 0.05em;
      margin-bottom: 3px;
    }
    #panel label { display: block; cursor: pointer; white-space: nowrap; }
    #panel input[type=range] { width: 170px; vertical-align: middle; }
    #panel .btn {
      background: rgba(0, 255, 0, 0.08);
      border: 1px solid rgba(0, 255, 0, 0.5);
      color: #0f0;
      font-family: inherit; font-size: 11px;
      padding: 4px 8px; cursor: pointer;
      margin: 2px 3px 2px 0;
    }
    #panel .btn:hover { background: rgba(0, 255, 0, 0.2); }
    #panel .hint { font-size: 10px; color: #0a0; margin-top: 4px; }
    #status {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px; z-index: 20;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="reticle"></div>
  <div id="hud"></div>
  <div id="fps">FPS: --</div>
  <div id="status">LOADING…</div>

  <div id="panel" style="display:none;">
    <div class="group">
      <div class="group-title">FLIGHT MODEL TUNING (model.tuning — live)</div>
      <label>ETA_K: <input type="range" id="ETA_K" min="2" max="10" step="0.1" value="6.0"> <span id="ETA_KVal">6.0</span></label>
      <label>ACCEL_TAU: <input type="range" id="ACCEL_TAU" min="0.2" max="2.0" step="0.05" value="1.4"> <span id="ACCEL_TAUVal">1.40</span></label>
      <label>CAP_MIN_FRAC: <input type="range" id="CAP_MIN_FRAC" min="0.0" max="1.0" step="0.05" value="0.5"> <span id="CAP_MIN_FRACVal">0.50</span></label>
      <label>THROTTLE_RATE: <input type="range" id="THROTTLE_RATE" min="0.1" max="2.0" step="0.05" value="0.6"> <span id="THROTTLE_RATEVal">0.60</span></label>
    </div>
    <div class="group">
      <button class="btn" id="btnFly">Fly from rest (6s)</button>
      <button class="btn" id="btnReset">Reset</button>
    </div>
    <div class="hint">W/S = throttle &nbsp; drag = virtual joystick (turn)<br>_lab.flyFromRest({seconds}) in console for the verdict</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { SupercruiseModel } from './src/flight/SupercruiseModel.js';
    import { HeadMount } from './src/flight/HeadMount.js';
    import { earthRadiiToScene } from './src/core/ScaleConstants.js';

    const canvas = document.getElementById('canvas');
    const hudEl = document.getElementById('hud');
    const fpsEl = document.getElementById('fps');
    const statusEl = document.getElementById('status');
    const panelEl = document.getElementById('panel');

    // ── Renderer / scene / camera ──
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000);

    const scene = new THREE.Scene();
    // near plane tiny because a real Earth (0.0426u) is small and we start close-ish.
    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 1e-5, 100);

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // ── Real-scale reference planet (Earth = 1 Earth-radius) at origin ──
    const PLANET_RADIUS = earthRadiiToScene(1); // ≈ 0.0426 scene units
    const ENTRY_DIST = PLANET_RADIUS * 6;       // natural manual-entry distance (main.js:4250)

    const planetGeo = new THREE.SphereGeometry(PLANET_RADIUS, 48, 32);
    // lit + textured-ish so growth is visually obvious (procedural lat/long grid)
    const tex = (() => {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 256;
      const g = c.getContext('2d');
      g.fillStyle = '#1d4e6e'; g.fillRect(0, 0, 512, 256);
      g.fillStyle = '#2f7a3a';
      for (let i = 0; i < 60; i++) {
        const x = Math.random() * 512, y = Math.random() * 256, r = 8 + Math.random() * 40;
        g.beginPath(); g.ellipse(x, y, r, r * 0.6, 0, 0, Math.PI * 2); g.fill();
      }
      g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 1;
      for (let lat = 0; lat <= 256; lat += 16) { g.beginPath(); g.moveTo(0, lat); g.lineTo(512, lat); g.stroke(); }
      for (let lon = 0; lon <= 512; lon += 16) { g.beginPath(); g.moveTo(lon, 0); g.lineTo(lon, 256); g.stroke(); }
      const t = new THREE.CanvasTexture(c);
      return t;
    })();
    const planetMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95, metalness: 0.0 });
    const planet = new THREE.Mesh(planetGeo, planetMat);
    scene.add(planet);

    scene.add(new THREE.AmbientLight(0x335577, 0.6));
    const sun = new THREE.DirectionalLight(0xffffff, 2.2);
    sun.position.set(1, 0.5, 0.7);
    scene.add(sun);

    // ── Starfield for parallax reference ──
    const STAR_COUNT = 4000;
    const starPos = new Float32Array(STAR_COUNT * 3);
    for (let i = 0; i < STAR_COUNT; i++) {
      // distribute on a large shell so they read as "infinitely far" but still parallax slightly
      const u = Math.random(), v = Math.random();
      const theta = 2 * Math.PI * u, phi = Math.acos(2 * v - 1);
      const r = 20 + Math.random() * 30;
      starPos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
      starPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      starPos[i * 3 + 2] = r * Math.cos(phi);
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.06, sizeAttenuation: true }));
    scene.add(stars);

    // ── Real flight model + head mount (imported, NOT copied) ──
    const model = new SupercruiseModel();
    const headMount = new HeadMount();

    // Single gravity body = the reference planet at origin (rebased frame = world here).
    function refreshBodies() {
      model.setBodies([{ position: planet.position, radius: PLANET_RADIUS }]);
    }

    // Reset to rest at radius×6, nose pointed at the planet.
    // Ship sits at +Z; nose is (0,0,-1) → points toward origin. Throttle 0, speed 0.
    function resetModel() {
      model.position.set(0, 0, ENTRY_DIST);
      model.orientation.identity();   // nose = -Z → straight at the planet at origin
      model.speed = 0;
      model.throttle = 0;
      model.setTurnInput(0, 0);
      headMount.yaw = 0; headMount.pitch = 0; headMount.endLook();
      refreshBodies();
      headMount.applyTo(camera, model.position, model.orientation);
    }
    resetModel();

    // ── Projected screen-space radius of the planet (the PERCEPTUAL signal) ──
    // Project planet center + a limb point to NDC, measure pixel radius.
    const _c = new THREE.Vector3();
    const _l = new THREE.Vector3();
    const _right = new THREE.Vector3();
    function projectedScreenRadiusPx() {
      camera.updateMatrixWorld();
      // camera right vector in world space (for a limb point perpendicular to view)
      _right.setFromMatrixColumn(camera.matrixWorld, 0).normalize();
      _c.copy(planet.position);
      _l.copy(planet.position).addScaledVector(_right, PLANET_RADIUS);
      const cNdc = _c.clone().project(camera);
      const lNdc = _l.clone().project(camera);
      const halfW = window.innerWidth / 2, halfH = window.innerHeight / 2;
      const cx = cNdc.x * halfW, cy = cNdc.y * halfH;
      const lx = lNdc.x * halfW, ly = lNdc.y * halfH;
      return Math.hypot(lx - cx, ly - cy);
    }

    // ── Input: W/S throttle + mouse-drag virtual joystick (mirror main.js manual) ──
    const keys = { w: false, s: false };
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w') keys.w = true;
      if (k === 's') keys.s = true;
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w') keys.w = false;
      if (k === 's') keys.s = false;
    });

    // Mouse drag = virtual joystick. Offset from drag-start → setTurnInput(x, y).
    let dragging = false, dragX = 0, dragY = 0;
    const JOY_RANGE = 200; // px to reach full deflection
    canvas.addEventListener('mousedown', (e) => { dragging = true; dragX = e.clientX; dragY = e.clientY; });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const yaw   = THREE.MathUtils.clamp((e.clientX - dragX) / JOY_RANGE, -1, 1);
      const pitch = THREE.MathUtils.clamp(-(e.clientY - dragY) / JOY_RANGE, -1, 1);
      model.setTurnInput(yaw, pitch);
    });
    window.addEventListener('mouseup', () => { dragging = false; model.setTurnInput(0, 0); });

    // ── Tuning sliders bound live to model.tuning ──
    const TUNING_IDS = ['ETA_K', 'ACCEL_TAU', 'CAP_MIN_FRAC', 'THROTTLE_RATE'];
    function bindTuning(id) {
      const el = document.getElementById(id);
      const out = document.getElementById(id + 'Val');
      const apply = () => {
        const v = parseFloat(el.value);
        model.tuning[id] = v;
        out.textContent = id === 'ETA_K' ? v.toFixed(1) : v.toFixed(2);
      };
      el.oninput = apply;
      apply();
    }
    TUNING_IDS.forEach(bindTuning);

    // ── Fixed-timestep sim loop ──
    const FIXED_DT = 1 / 60;
    let acc = 0, last = performance.now();
    let scripted = null; // when a flyFromRest run is active, hold its driver

    function step(dt) {
      // Throttle stepping from held W/S (mirrors main.js setThrottle(throttle ± RATE*dt)).
      if (!scripted) {
        if (keys.w) model.setThrottle(model.throttle + model.tuning.THROTTLE_RATE * dt);
        if (keys.s) model.setThrottle(model.throttle - model.tuning.THROTTLE_RATE * dt);
      }
      refreshBodies();          // current rebased body positions every tick (per model contract)
      model.update(dt);         // steering + speed + translate
      headMount.update(dt);     // recenter easing when not held
      headMount.applyTo(camera, model.position, model.orientation);
    }

    function tickPhysics(now) {
      acc += (now - last) / 1000;
      last = now;
      // clamp to avoid spiral-of-death after a tab stall
      if (acc > 0.25) acc = 0.25;
      while (acc >= FIXED_DT) {
        step(FIXED_DT);
        if (scripted) scripted.onStep(FIXED_DT);
        acc -= FIXED_DT;
      }
    }

    // ── HUD + FPS ──
    function updateHud() {
      const d = model.position.length();
      hudEl.textContent =
        `Flight Controls Lab — real SupercruiseModel\n` +
        `planet R = ${PLANET_RADIUS.toFixed(5)} u  (Earth, real scale)\n` +
        `entry dist = ${ENTRY_DIST.toFixed(5)} u (R×6)\n` +
        `dist to centre = ${d.toFixed(5)} u\n` +
        `throttle = ${model.throttle.toFixed(2)}   speed = ${model.speed.toExponential(2)} u/s\n` +
        `cap = ${model.speedCap().toExponential(2)} u/s\n` +
        `screen R = ${projectedScreenRadiusPx().toFixed(1)} px`;
    }

    let frameCount = 0, fpsTimer = performance.now();
    function updateFps() {
      frameCount++;
      const now = performance.now();
      if (now - fpsTimer >= 500) {
        fpsEl.textContent = `FPS: ${(frameCount * 1000 / (now - fpsTimer)).toFixed(1)}`;
        frameCount = 0; fpsTimer = now;
      }
    }

    function loop(now) {
      tickPhysics(now);
      renderer.render(scene, camera);
      updateHud();
      updateFps();
      requestAnimationFrame(loop);
    }

    // ── window._lab API ──
    // flyFromRest: reset to rest at R×6, full throttle (W), run the sim for `seconds`,
    // sampling speed / camera world-pos / projected planet screen-radius over time.
    // visiblyTranslated = projected screen radius grew >= 25% within the window.
    function flyFromRest({ seconds = 6 } = {}) {
      return new Promise((resolve) => {
        resetModel();
        model.setThrottle(1);            // full W
        const baselineScreenR = projectedScreenRadiusPx();
        const startPos = camera.position.clone();
        const samples = [];
        let elapsed = 0, peakSpeed = 0, maxScreenR = baselineScreenR;
        // record an initial t=0 sample
        const sample = () => {
          const screenR = projectedScreenRadiusPx();
          if (screenR > maxScreenR) maxScreenR = screenR;
          if (model.speed > peakSpeed) peakSpeed = model.speed;
          samples.push({
            t: +elapsed.toFixed(3),
            speed: model.speed,
            dist: model.position.length(),
            camPos: [camera.position.x, camera.position.y, camera.position.z],
            screenRadiusPx: +screenR.toFixed(2),
          });
        };
        sample();
        let sampleAcc = 0;
        const SAMPLE_EVERY = 0.25; // s between recorded samples
        scripted = {
          onStep(dt) {
            elapsed += dt;
            sampleAcc += dt;
            if (model.speed > peakSpeed) peakSpeed = model.speed;
            const sr = projectedScreenRadiusPx();
            if (sr > maxScreenR) maxScreenR = sr;
            if (sampleAcc >= SAMPLE_EVERY) { sampleAcc -= SAMPLE_EVERY; sample(); }
            if (elapsed >= seconds) {
              sample();
              scripted = null;
              model.setThrottle(0);
              const growthPct = baselineScreenR > 0
                ? ((maxScreenR - baselineScreenR) / baselineScreenR) * 100
                : (maxScreenR > 0 ? Infinity : 0);
              const distanceTravelled = startPos.distanceTo(camera.position);
              resolve({
                visiblyTranslated: growthPct >= 25,
                screenRadiusGrowthPct: +growthPct.toFixed(2),
                peakSpeed,
                distanceTravelled,
                baselineScreenRadiusPx: +baselineScreenR.toFixed(2),
                maxScreenRadiusPx: +maxScreenR.toFixed(2),
                samples,
              });
            }
          },
        };
      });
    }

    function setTuning(k, v) {
      if (!(k in model.tuning)) throw new Error(`Unknown tuning key: ${k}`);
      model.tuning[k] = v;
      const el = document.getElementById(k);
      const out = document.getElementById(k + 'Val');
      if (el) { el.value = v; }
      if (out) { out.textContent = k === 'ETA_K' ? v.toFixed(1) : v.toFixed(2); }
    }

    window._lab = {
      flyFromRest,
      reset: resetModel,
      setTuning,
      model,
      headMount,
      camera,
      planet,
      PLANET_RADIUS,
      ENTRY_DIST,
      projectedScreenRadiusPx,
    };

    // ── Panel buttons ──
    document.getElementById('btnReset').onclick = () => resetModel();
    document.getElementById('btnFly').onclick = async (e) => {
      e.target.textContent = 'Flying…';
      const r = await flyFromRest({ seconds: 6 });
      e.target.textContent = `Fly from rest (6s) — ${r.visiblyTranslated ? 'VISIBLE ✓' : 'NOT VISIBLE ✗'} (${r.screenRadiusGrowthPct}%)`;
      console.log('[flight-controls-lab] flyFromRest →', r);
    };

    statusEl.style.display = 'none';
    panelEl.style.display = 'block';
    requestAnimationFrame(loop);
  </script>
</body>
</html>
