  ==================================================================================================
  URL:  http://localhost:5175/well-dipper/nav-240p-lab.html
        (vite.config.js sets base '/well-dipper/' in dev — the bare root path 404s.)

  ── WHY THIS PAGE EXISTS ───────────────────────────────────────────────────────────────────────

  Max, 2026-09-06: "we need to begin by making these nav computer screens work in fullscreen first
  (the N menu) then figure out how to represent that in the diegetic screens."

  THE FULL-SCREEN NAV IS THE SOURCE. It is today a ~1560x860 DOM canvas drawing vector type over a
  240-line world — roughly 3.6x the world's line count and 13x its pixel count. Three designs were
  authored for what it should be at the world's own resolution. Max does not rule on prose, so all
  three are drawn here, at 427x240, with the shipped face and the game's own data.

  ── ⛔ WHAT IS REAL ON THIS PAGE AND WHAT IS NOT ────────────────────────────────────────────────

  REAL — imported and called, not imitated:
    · the face          src/rendering/PixelText.js  (drawPixelText / measurePixelText / FACE) — and
                        `;` is PixelText's OWN key (PixelText.js:433-441), not a lab reimplementation
    · the buffer        src/rendering/renderLines.js bufferForLines() — the same function that sizes
                        the world render target, over the same RENDER_LINE_OPTIONS
    · the galaxy        src/generation/GalacticMap.js, seed 'well-dipper-galaxy-1' (main.js:286)
    · the sectors       src/generation/GalacticSectors.js — all 775, with their real names
    · the density image src/rendering/GalaxyLuminosityRenderer.js — the CPU renderer the nav's own
                        _renderDensityBg falls back to
    · the prism stars   src/generation/HashGridStarfield.findStarsInPrism() — the same call, the same
                        block, at the same 0.0015 kpc default radius
    · the star names    src/generation/NameGenerator.generateSystemName() through an alea rng built
                        exactly as NavComputer._makeRng does (NavComputer.js:315-327)
    · the real stars    src/generation/RealStarCatalog.js — hyg-stars.json, fetched and merged on the
                        same 2 pc rule NavComputer._queryYRange uses
    · the system        src/generation/arrivalResolution.resolveArrivalSystem() — the exact call
                        NavComputer.js:2458 makes, so planets, moons, belts, zones and rings are the
                        ones a warp would deliver
    · multiplicity      src/generation/multiplicityOracle.multiplicityForSeed()

  DERIVED HERE, and said out loud because a lab that hides its own arithmetic is worthless:
    · the per-tile star-count estimate is `density * DENSITY_TO_STARS_PER_PC3 * volume`, the same
      arithmetic NavComputer._computeTileSize inverts and _estimateBlockStarCount performs. Those are
      private methods; the two constants and the formula are reproduced below, cited.
    · a VISITED flag does not exist anywhere in the pipeline. Design 1 wanted one. It draws blank.
    · the density image above 448 texels is rendered at 448 and magnified with nearest-neighbour —
      a LAB COMPUTE CAP (the CPU renderer is ~1.35 s at 427², ~12 s at 1280²), not a design property.
      At 240p every design is under the cap and the image is exact.

  ⚠ WHAT THIS PAGE IS NOT. It is not the nav computer. Nothing here is interactive the way the
  instrument is — no hover, no drag, no click-to-drill. It answers the STATIC question these three
  designs disagree about: at 427x240, with the real face and the real data, WHAT DOES EACH ONE LOOK
  LIKE, and does it read? Whether the whole thing coheres in the ship is Max's eye in the game.
-->

// ════════════════════════════════════════════════════════════════════════════════════════════════
// THE GUARD.  cockpit-panel-budget-lab.html's assertFits, generalised from "one row" to "any ink in
// any named region".  It is the only thing standing between a design that fits and a design that
// LOOKS like it fits because the canvas clipped the overflow for free.
// ════════════════════════════════════════════════════════════════════════════════════════════════
/** THE SABOTAGE STRING. `X` appends it to each design's longest single-line field and hands the
 *  UNCLIPPED result to assertFits, so the guard is proved to fire on demand rather than asserted to
 *  work. Every design has one, so the proof covers all three. */
const SAB = '   SABOTAGE: THIS STRING IS DELIBERATELY LONGER THAN THE ROW IT IS DRAWN INTO AND THE GUARD MUST SAY SO';
const _fired = new Set();
let _violations = 0;
/** Every region a design declares this frame, so a caller cannot invent one that is not on the glass. */
let REGIONS = {};
function region(name, x, y, w, h) { REGIONS[name] = { x, y, w, h }; return REGIONS[name]; }

/**
 * @param {string} what   what was being drawn (appears in the console error)
 * @param {string} rname  the declared region it must stay inside
 * @param {number} x @param {number} y @param {number} w @param {number} h  the ink's bounding box
 */
function assertFits(what, rname, x, y, w, h) {
  const r = REGIONS[rname];
  if (!r) { fire(`${what}: region ${JSON.stringify(rname)} was never declared this frame`); return false; }
  const over = [];
  if (x < r.x)                 over.push(`left by ${(r.x - x).toFixed(1)}`);
  if (y < r.y)                 over.push(`top by ${(r.y - y).toFixed(1)}`);
  if (x + w > r.x + r.w)       over.push(`right by ${(x + w - r.x - r.w).toFixed(1)}`);
  if (y + h > r.y + r.h)       over.push(`bottom by ${(y + h - r.y - r.h).toFixed(1)}`);
  if (!over.length) return true;
  fire(`${what} overflows ${rname} — ${over.join(', ')} texel(s). ` +
       `ink ${w.toFixed(1)}x${h.toFixed(1)} at (${x.toFixed(1)},${y.toFixed(1)}); ` +
       `region ${r.w}x${r.h} at (${r.x},${r.y}).`);
  return false;
}
/** Two blocks that each fit their region can still land on top of each other — which is exactly what
 *  Design 1's status line does at 144p, and what assertFits alone cannot see. */
function assertClear(what, rgn, leftEnd, rightStart) {
  if (leftEnd <= rightStart) return true;
  fire(`${what} collides inside ${rgn} — the left block ends at ${Math.round(leftEnd)} and the ` +
       `right block starts at ${Math.round(rightStart)}, ${Math.round(leftEnd - rightStart)} texel(s) of overlap.`);
  return false;
}
/**
 * ⭐⭐ THE MARK GUARD — `assertFits` FOR INK THAT IS NOT TYPE.
 *
 * ⛔ `assertFits` IS REACHED ONLY THROUGH `T()`, AND THEREFORE ONLY THROUGH `plated()`. Every other
 * mark on the glass — `rect`, `sprite`, `dottedEllipse`, `frame`, `checker` — has always been
 * unguarded, so a mark that walks off its pane is CLIPPED BY THE CANVAS FOR FREE and the violation
 * counter stays at zero. That was invisible while every mark's position was a fixed literal. It
 * stops being invisible the moment a camera angle is an input: at `rotX = π/2` the orrery's minor
 * axis becomes its major one and the outer ring overshoots the map pane by ~93 texels per side,
 * straight through the topbar and off the canvas, WITHOUT FIRING ANYTHING.
 *
 * ⛔ IT IS CALLED PER SHAPE, NEVER PER TEXEL. `dottedEllipse` plots up to 220 texels and `checker`
 * plots w*h of them; a guard inside those loops would be the most expensive thing on the page. So
 * the caller hands over the shape's BOUNDING BOX once — which is also the only box that means
 * anything, since a partially-clipped ring is exactly as broken as a fully-clipped one.
 *
 * ⚠ IT ROUNDS THE WAY `rect()` ROUNDS. The marks are drawn at `Math.round`ed coordinates, so a box
 * measured off the raw floats would report half-texel overflows the glass never had.
 */
function assertMark(what, rname, x, y, w, h) {
  return assertFits(what, rname, Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function fire(msg) {
  _violations++;
  const key = `${S.design}|${S.level}|${S.lines}|${FACE.name}|${msg}`;
  if (_fired.has(key)) return;
  _fired.add(key);
  console.error(`NAV-240p OVERFLOW [D${S.design} ${LEVELS[S.level]} ${S.lines}p ${FACE.name}] — ${msg}`);
}

// ════════════════════════════════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════════════════════════════════
const LEVELS = ['GALAXY', 'SECTOR', 'REGION', 'PRISM', 'SYSTEM'];

// ── ⭐⭐ THE TWO CAMERAS' DEFAULT ANGLES — DERIVED FROM THE PICTURE, NEVER THE PICTURE FROM THEM ──
//
// `projectPrism` and `d2System` each used to carry a FIXED tilt spelled as a bare literal, and those
// literals ARE the picture Max ruled on. So they stay the source of truth and the ANGLE is what gets
// computed. Reversing that — storing the angle and recovering the gains — moves the picture:
//
// ⛔ THE PRISM'S ROUND TRIP IS NOT BIT-IDENTICAL. Its two gains are not a rotation matrix;
//    `hypot(0.42, 0.55) = 0.692… ≠ 1`, so the picture factors as an elevation-only rotation TIMES an
//    anisotropic scale K. Recovering the gains from the angle gives `K*sin(ROTX0)` =
//    0.42000000000000004 and `K*cos(ROTX0)` = 0.5500000000000002 — each 1-2 ULP off. Every texel
//    consumer rounds, so nothing visible would move; but the same raw floats feed the bounds culls
//    and go UNROUNDED into `S.prismHits`, where the picker measures distance to the cursor. So
//    `projectPrism` keeps an explicit default path spelled with the literals themselves, and the
//    trigonometry runs only once the pilot has actually turned the camera.
// ⭐ THE ORRERY'S ROUND TRIP *IS* EXACT — `Math.sin(Math.asin(0.42)) === 0.42` — because 0.42 there
//    is a true sine and not half of an anisotropic pair. `d2System` therefore just reads the angle.
//
// ⛔ TWO PAIRS, NOT ONE. The game keeps `_localRot*` and `_systemRot*` distinct and clamps them
//    differently; folding them into one field would make a prism drag turn the orrery.
const PRISM_TILT0 = 0.42;                                   // the prism's default z-gain …
const PRISM_RISE0 = 0.55;                                   // … and its default y-gain
const PRISM_K = Math.hypot(PRISM_TILT0, PRISM_RISE0);       // 0.6920260110718384
const PRISM_ROTX0 = Math.atan2(PRISM_TILT0, PRISM_RISE0);   // 0.6521714117570698 rad = 37.3667°
const PRISM_ROTY0 = 0;
const SYS_TILT0 = 0.42;                                     // the orrery's default minor-axis gain
const SYS_ROTX0 = Math.asin(SYS_TILT0);                     // 0.43344532006988595 rad = 24.8346°
const SYS_ROTY0 = 0;
/** ⛔ THE ORRERY'S RADIUS BUDGET DIVIDES BY THE MINOR-AXIS GAIN, so a top-down orrery (rotX → 0)
 *  divides by zero and a nearly-flat one divides by a hair. This floor is what leaves the WIDTH term
 *  winning the `Math.min` instead of handing it an Infinity. */
const SYS_MIN_SIN = 1e-3;

const S = {
  design: 1,
  level: 3,               // open on PRISM so the first frame shows the crowded level
  lines: 240,
  sabotage: false,
  list: false,               // Design 2's 'L' list mode — its ONE answer to the comparison problem
  legend: true,
  ladderScroll: 0,        // design 1's SYSTEM ladder pans horizontally (Max, 2026-09-07)
  buf: { width: 427, height: 240 },
  // ── ⭐ THE CALLER'S HALF OF THE SEAM. Everything from here down arrives from OUTSIDE the
  //    designs — in the game from src/ui/navViewModes/state.js, on this page from buildData() and
  //    the key handler below. The extractor strips this whole literal, so it costs the game nothing
  //    and it is the only written-down record of the shape every design expects to be handed.
  // ⛔ SIX FIELDS, AND THE LAST TWO ARE ANGLES IN RADIANS, NOT GAINS. `rotY` is the azimuth applied
  //    to (dx, dz) BEFORE the anisotropic gains — after them it would SHEAR the field rather than
  //    spin it, because the two gains are not equal. `rotX` is the elevation; at PRISM_ROTX0 the
  //    projection takes an explicit literal path and is bit-identical to the fixed-tilt original.
  cam: { x: 0, y: 0, z: 0, radius: 0.0015,     // the prism camera: anchor + half-extent, in kpc.
         rotX: PRISM_ROTX0, rotY: PRISM_ROTY0 },
                                               // buildData() re-anchors it to the player and sets
                                               // radius = ZOOM_STOPS[0], which IS 0.0015 — the game's
                                               // own entry state, so the picture does not move.
  // ⛔ THE ORRERY'S OWN PAIR. The game clamps this one to [0.1, π/2] and the prism's to [0, π/2];
  //    one shared field would make a drag at PRISM turn the orrery at SYSTEM.
  sysCam: { rotX: SYS_ROTX0, rotY: SYS_ROTY0 },
  // ⭐ THE COMMITTED CLICK, so the glass acknowledges a drill BEFORE the zoom carries it away.
  //    `{ level, i, j, tMs } | null` — DRIVER writes it, the 2D painters frame that cell, DRIVER
  //    clears it when the drill lands. ⛔ `i`/`j` are the DESIGN'S OWN grid coordinates, not the
  //    game's `col`/`row`: `row = n - 1 - j`, the Z-flip from the previous INTERFACE §1.
  pick: null,
  view: { cx: 0, cz: 0, size: 44 },   // the 2D frame levelView() reads at levels 1-2
  sortIdx: 0,      // DRIVER: index into the active level's sort-key list
  listOffset: 0,   // DRIVER: first row of the ranked list that is drawn
  sortLabel: '',   // DRIVER writes it, design 1's hint row draws it — Max never opens a console, so
                   // the active sort key has to be legible ON THE GLASS or it does not exist
  // ── AND THE PAINT'S HALF. Every field below is written BY a draw site, for a hit-test to read.
  //    ⛔ Restating any of these outside the paint is the AC-4 defect: two copies of one geometry,
  //    one of them silently wrong, and the wrong one is the one the pilot clicks.
  mapProj: null,    // d1TwoD / d2TwoD — the 2D projection at levels 0-2, `null` otherwise
  prismHits: null,  // d1Prism / d2Prism — every star mark at PRISM, in DRAW ORDER
  bodyHits: null,   // d1Ladder / d2System — every body mark at SYSTEM
  railTiles: null,  // d1Rail levels 1-2 — the tiles its rows name, already sliced
  listGeom: null,   // d2List — the row grid, and only when a list actually painted
  tabRects: null,   // drawDesign2 — the tab strip's own rectangles
  chipRect: null,   // drawDesign2 — the commit chip's rectangle and whether it is armed
  // ── ⭐ THE DRAWN SEARCH (AC-11). `open` / `text` / `highlight` / `rows` arrive from the CALLER
  //    — in the game from the driver, which types into NavComputer's own `_runSearch` and mirrors

  //    designs never resolve a name themselves: they draw four fields, which is the whole split.

  //    resolver at all.
  search: { open: false, text: '', highlight: -1, rows: [] },
  searchGeom: null, // d1Search / d2Search — the drawn result rows, so a MOUSE can pick one too
};

// ── INKS.  Solid fills only.  Batch 1 established that at 240p there are exactly two representable
// stroke weights and that alpha alone has never separated selected from tentative, so every "dim"
// tone here is a literal darker ink or a 1-texel parity checker — never globalAlpha.
const INK = {
  BG:     '#04070c',
  RULE:   '#1d3a4a',
  DIM:    '#2f6b7a',
  BODY:   '#7fd8e8',
  KEY:    '#d8fbff',
  YOU:    '#2ee6c0',
  TARGET: '#ffb03a',
  WARN:   '#e8674f',
};
/** BURN or WARP is not "which level am I on" — it is NavComputer._isCurrentSystem() (:1098-1105), a
