    `<span><span class="k">Q E</span> azimuth · <span class="k">↑ ↓</span> elevation — the PRISM camera at 3, the ORRERY at 4` +
      ` (${S.level === 4 ? `orrery ${(S.sysCam.rotX * 180 / Math.PI).toFixed(1)}°/${(S.sysCam.rotY * 180 / Math.PI).toFixed(0)}°`
                         : `prism ${(S.cam.rotX * 180 / Math.PI).toFixed(1)}°/${(S.cam.rotY * 180 / Math.PI).toFixed(0)}°`})</span>` +
    `<span><span class="k">0</span> back to the default tilt — the picture Max ruled on</span>` +
    `<span><span class="k">N</span> next system (${(D.sysStar?.name || '—').toUpperCase()}, ${D.bodies.length} bodies)</span>` +
    `<span><span class="k">;</span> face — 5x5 &harr; 5x7, PixelText's own live A/B</span>` +
    `<span><span class="k">L</span> Design 2's list mode${S.list ? ' (ON)' : ''}</span>` +
    `<span><span class="k">/</span> search — the drawn field, in each design's own ink${S.search.open ? ' (OPEN)' : ''}</span>` +
    `<span><span class="k">[ ]</span> sort key (${S.sortLabel || LAB_SORT_LABELS[S.level][0]}) — re-orders the tiles at SECTOR/REGION; elsewhere the driver owns the order</span>` +
    `<span><span class="k">X</span> sabotage the guard</span>` +
    `<span><span class="k">H</span> hide this bar</span>` +
    `<span class="sep">|</span>` +
    `<span>${_violations ? `<span class="bad">${_violations} OVERFLOW(S) — see console</span>` : '<span style="color:#8fce9b">guard clean</span>'}</span>` +
    `<span class="sep">|</span><span style="color:#8b8378">${D.note.join(' · ')}</span>`;
}

addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  // ⭐⭐ THE DRAWN FIELD OWNS THE KEYBOARD WHILE IT IS OPEN, AND IT IS THE FIRST TEST ON THIS
  // HANDLER — the same position the game's `searchKey` clause takes on NavComputer.js:349, and for
  // the same reason: W A S D R F are the pan keys, and a field you cannot type a `W` into is not a
  // field. Consuming them here is ALSO what makes `_searchFocused` unnecessary in the game.
  if (S.search.open) { labSearchKey(e); e.preventDefault(); draw(); return; }
  if (k === '/') { S.search.open = true; S.search.text = ''; labSearch(); e.preventDefault(); draw(); return; }
  // ⚠ `[` and `]` MOVE THE PUBLISHED KEY, WHICH IS ALL THIS PAGE CAN HONESTLY DO — see the note on
  //   LAB_SORT_LABELS. At SECTOR and REGION it really does re-order the tiles, because those rows
  //   are built in the paint; everywhere else it moves the word on the hint row and nothing else.
  if (k === '[' || k === ']') {
    const labels = LAB_SORT_LABELS[S.level];
    S.sortIdx = ((S.sortIdx + (k === ']' ? 1 : -1)) % labels.length + labels.length) % labels.length;
    S.sortLabel = labels[S.sortIdx];
    e.preventDefault(); draw(); return;
  }
  if (k === '1' || k === '2' || k === '3') S.design = +k;
  // ⛔ THE LEVEL CHANGE RESETS THE SORT INDEX, because the key LISTS differ in length between
  //    levels — carrying an index across either points past the end or silently means another key.
  //    `state.js:299` does exactly this in the game, off the same reasoning.
  // ⚠ AND IT CLEARS THE LABEL RATHER THAN NAMING THE DEFAULT KEY, WHICH IS A DELIBERATE DIVERGENCE
  //    FROM THE GAME AND THE SMALLER OF TWO. The game's `refresh()` writes `S.sortLabel` every
  //    frame, so its hint row has read `[ ] SORT DIST` since phase 1; this page has always read a
  //    bare `[ ] SORT`. Naming the default here would move a drawn string on a page Max has ruled
  //    on, for no control he has touched — so the label appears only once `[` or `]` is pressed,
  //    which is the moment the control becomes his. ⭐ The legend below names the default anyway.
  else if (k === 'ArrowRight') { S.level = (S.level + 1) % 5; S.sortIdx = 0; S.sortLabel = ''; }
  else if (k === 'ArrowLeft') { S.level = (S.level + 4) % 5; S.sortIdx = 0; S.sortLabel = ''; }
  else if (k === 'p' || k === 'P') S.lines = RENDER_LINE_OPTIONS[(RENDER_LINE_OPTIONS.indexOf(S.lines) + 1) % RENDER_LINE_OPTIONS.length];
  else if (k === 'z' || k === 'Z') { zoomIdx = (zoomIdx + 1) % ZOOM_STOPS.length; S.cam.radius = ZOOM_STOPS[zoomIdx]; }
  // ⭐ THE SIX KEYS THE GLASS ADVERTISES, HONOURED HERE TOO. Both designs print `WASD PAN` and
  // design 2 prints `R/F UP`; a page that draws those words and does not move the picture is the
  // exact defect this workstream exists to close, and a spec that cannot be flown is not a spec.
  // One step is a fifth of the current half-extent, so the picture moves a readable amount at every
  // zoom stop rather than a texel at one and off the glass at another.
  // ⛔ R AND S NOW BELONG TO THE PILOT, so this page's own two controls moved: P is the line count
  //    and N is the next system. Both are announced in the legend below.
  else if (k.length === 1 && 'wasdrfWASDRF'.includes(k)) {
    const step = S.cam.radius * 0.2;
    if (k === 'w' || k === 'W') S.cam.z -= step;
    else if (k === 's' || k === 'S') S.cam.z += step;
    else if (k === 'a' || k === 'A') S.cam.x -= step;
    else if (k === 'd' || k === 'D') S.cam.x += step;
    else if (k === 'r' || k === 'R') S.cam.y += step;
    else S.cam.y -= step;
  }
  // ⭐⭐ ROTATION, AND IT IS ROUTED BY LEVEL EXACTLY AS THE GAME ROUTES IT. The instrument keeps two
  // camera pairs — `_localRot*` at PRISM and `_systemRot*` at SYSTEM — and one drag gesture that
  // means whichever of them is on the glass. Four keys, the same rule: at PRISM they turn `S.cam`,
  // at SYSTEM they turn `S.sysCam`, and at levels 0-2 there is no camera to turn so they do nothing.
  // ⛔ NOT THE ARROW KEYS FOR AZIMUTH — ← and → are the level change (below) and have been since
  //    batch 1. Q/E is the pair every flight sim already spends on yaw.
  // ⛔ THE CLAMPS ARE THE GAME'S, NOT INVENTED HERE: elevation is [0, π/2] at PRISM and [0.1, π/2] at
  //    SYSTEM (a zero-tilt orrery is a set of straight lines with every planet on one row), and the
  //    azimuth WRAPS rather than clamping — the game's own `_localRotY` is unclamped AND unwrapped
  //    and grows without bound across drags, which is a defect this page declines to reproduce.
  else if (k === 'q' || k === 'Q' || k === 'e' || k === 'E' || k === 'ArrowUp' || k === 'ArrowDown') {
    const cam = S.level === 4 ? S.sysCam : S.level === 3 ? S.cam : null;
    if (cam) {
      const loX = S.level === 4 ? 0.1 : 0;
      const step = 0.08;
      if (k === 'q' || k === 'Q') cam.rotY -= step;
      else if (k === 'e' || k === 'E') cam.rotY += step;
      else cam.rotX = Math.max(loX, Math.min(Math.PI / 2, cam.rotX + (k === 'ArrowUp' ? step : -step)));
      cam.rotY = ((cam.rotY % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    }
  }
  // ⭐ AND A WAY BACK TO THE PICTURE MAX RULED ON, because the whole claim being made about
  //    `projectPrism` is that the default is BIT-IDENTICAL — an A/B you cannot return from is not an
  //    A/B. `0` restores both cameras to the design defaults these constants were derived from.
  else if (k === '0') { S.cam.rotX = PRISM_ROTX0; S.cam.rotY = PRISM_ROTY0;
                        S.sysCam.rotX = SYS_ROTX0; S.sysCam.rotY = SYS_ROTY0; }
  else if (k === 'x' || k === 'X') { S.sabotage = !S.sabotage; if (S.sabotage) console.warn('NAV-240p SABOTAGE ON — an over-long hint/status string is now handed to assertFits UNCLIPPED. The guard must fire.'); }
  else if (k === 'l' || k === 'L') { S.list = !S.list; S.design = 2; S.level = 3; }
  else if (k === 'h' || k === 'H') S.legend = !S.legend;
  else if (k === 'n' || k === 'N') { sysPick = (sysPick + 1) % Math.max(1, (D.sysCands || [1]).length);
                                     buildSystem(D.sysCands[sysPick]); S.level = 4; }
  else if (k === ',' || k === '.') { const st = S.ladderStops || []; const cur = S.ladderScroll || 0;
    const next = k === '.' ? st.find((v) => v > cur) : [...st].reverse().find((v) => v < cur);
    S.ladderScroll = next == null ? (k === '.' ? (S.ladderMax || 0) : 0) : next; }
  else if (k === ';') { requestAnimationFrame(draw); return; }   // PixelText owns the face swap
  else return;
  e.preventDefault();
  draw();
});
addEventListener('resize', draw);

// ── BOOT ─────────────────────────────────────────────────────────────────────────────────────────
draw();
setTimeout(async () => {
  const t0 = performance.now();
  try { buildData(); }
  catch (e) {
    D.fail.push('REAL DATA COULD NOT BE BUILT: ' + e.message + ' — nothing on this page is trustworthy.');
    D.catalogSettled = true; draw(); console.error(e); return;
  }
  D.ready = true;
  D.note.push(`built in ${Math.round(performance.now() - t0)} ms`);
  draw();
  // The catalog is a fetch; merge it in when it lands, exactly as _queryYRange does (2 pc rule).
  try {
    const cat = new RealStarCatalog();
    await cat.load();
    D.catalog = cat;
    D.catalogOk = cat.loaded;
    if (cat.loaded) {
      const half = 0.0052;
      const real = cat.findInVolume(D.player, half, 0.25);
      let merged = 0, added = 0;
      for (const rs of real) {
        if (!rs.name || rs.name === '"') continue;
        let best = -1, bd = 0.002;
        for (let i = 0; i < D.stars.length; i++) {
          const s = D.stars[i]; if (s.isReal) continue;
          const d = Math.hypot(s.wx - rs.x, s.wy - rs.y, s.wz - rs.z);
          if (d < bd) { bd = d; best = i; }
        }
        if (best >= 0) { D.stars[best].name = rs.name; D.stars[best].isReal = true; merged++; }
        else {
          D.stars.push({ wx: rs.x, wy: rs.y, wz: rs.z, seed: `real-${rs.name}`, spectral: (rs.spect || 'G')[0],
                         dist: Math.hypot(rs.x - D.player.x, rs.y - D.player.y, rs.z - D.player.z),
                         name: rs.name, isReal: true });
          added++;
        }
      }
      D.note.push(`${cat.count} catalog stars · ${merged} merged + ${added} added in block`);
      reindexStars();
      sysPick = 0; pickSystem(0);
    }
  } catch (e) { D.fail.push('RealStarCatalog: ' + e.message); }
  D.catalogSettled = true;
  draw();
}, 30);
</script>
</body>
</html>
